name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger a deploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Folder on the server that maps to app.vibemarketing.in.
          # If your FTP account already opens inside public_html, change this to ./app/
          server-dir: ./public_html/app/
          # Never touch secrets, runtime uploads, dev files, or the DB scripts.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/db/**
            **/backend/**
            **/*.md
            **/*.zip
            **/api/config.php
            **/api/config.sample.php
            **/uploads/**
            **/logo-src.png
            **/icon-preview.png
            **/pothys_text.txt
            **/vibe-marketing-crm.jsx
