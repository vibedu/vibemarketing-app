      .reduce((s, a) => { const d = drvOf(a.driverId); return s + (+(d && d.wage) || 0) + (a.outstation ? (+(d && d.batta) || 0) : 0); }, 0);
    const rec = receivables(db, paidOn);
    const thisMonthSpend = expenseTotal(expensesIn(db, mth));
    const thisMonthInputGst = inputGstIn(db, mth);
    const lowCards = (db.fuelCards || []).filter(c => c.active !== false && cardLow(c, db.settings));
    const callsDue = followupsDue(db);
    const marked = new Set((db.tallyMarks || []).map(m => m.id));
    const pendingVouchers = dayBook(db, mth).filter(v => !marked.has(v.id)).length;
    // TDS the customers have kept back this financial year (April to March).
    const fyStart = (today().slice(5, 7) >= "04" ? today().slice(0, 4) : String(+today().slice(0, 4) - 1)) + "-04-01";
    const tdsYtd = (db.payments || []).filter(p => String(p.date || "") >= fyStart).reduce((s, p) => s + (+p.tds || 0), 0);
    // This week's payroll, for the shortcut below — same Sunday-to-Saturday
    // window as the Attendance & payroll sheet, so the two never disagree.
    const curWeekEnd = weekEnding(today()), curWeekStart = weekRange(curWeekEnd).start;
    const driverPayroll = db.drivers.reduce((s, d) => s + driverWeek(db, d, curWeekStart, curWeekEnd).net, 0);
    const staffPayroll = (db.staff || []).filter(s => s.active !== false && (!s.joined || s.joined <= curWeekEnd))
      .reduce((s, x) => s + (+x.weeklyWage || 0), 0);

    // The Finance Dashboard's period window. "This Year" is the current
    // financial year (April–March) to date, matching the TDS figure above —
    // one calendar convention for the whole screen, not two.
    const dashRange = (() => {
      const t = today();
      if (dashPeriod === "week") return weekRange(weekEnding(t));
      if (dashPeriod === "month") {
        const d = new Date(t + "T12:00:00Z");
        const end = localDay(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0, 12)));
        return { start: t.slice(0, 7) + "-01", end: end < t ? end : t };
      }
      if (dashPeriod === "year") return { start: fyStart, end: t };
      if (dashPeriod === "custom") return { start: dashCustom.from, end: dashCustom.to };
      return { start: t, end: t };
    })();
    const cash = cashFlow(db, dashRange.start, dashRange.end);
    const runningNow = db.vehicles.map(v => ({
      v, a: (db.attendance || []).find(a => a.vehicleId === v.id && a.date === today() && !a.outAt),
    })).filter(x => x.a);

    return (
      <>
        <div className="vz-eyebrow" style={{ marginTop:0 }}>Finance Dashboard</div>
        <F label="Period">
          <select value={dashPeriod} onChange={e => setDashPeriod(e.target.value)}>
            <option value="today">Today</option>
            <option value="week">This week</option>
            <option value="month">This month</option>
            <option value="year">This year</option>
            <option value="custom">Custom range</option>
          </select>
        </F>
        {dashPeriod === "custom" && (
          <div className="vz-2">
            <F label="From"><input type="date" value={dashCustom.from} onChange={e => setDashCustom({ ...dashCustom, from: e.target.value })} /></F>
            <F label="To"><input type="date" value={dashCustom.to} min={dashCustom.from} onChange={e => setDashCustom({ ...dashCustom, to: e.target.value })} /></F>
          </div>
        )}
        <div className="vz-grid" style={{ marginBottom:6 }}>
          <div className="vz-stat"><i>Opening balance</i><b style={{ fontSize:17 }}>{inr(cash.opening)}</b><small>as of {dmy(cash.openingAsOf)}</small></div>
          <div className="vz-stat"><i>Closing balance</i><b style={{ fontSize:17, color: cash.closing >= 0 ? "#178951" : "#E5484D" }}>{inr(cash.closing)}</b><small>{dmy(dashRange.end)}</small></div>
          <div className="vz-stat"><i>Income</i><b style={{ fontSize:17, color:"#178951" }}>{inr(cash.income)}</b><small>received in period</small></div>
          <div className="vz-stat"><i>Expenses</i><b style={{ fontSize:17, color:"#E5484D" }}>{inr(cash.expenses)}</b><small>paid out, incl. payroll</small></div>
        </div>

        <div className="vz-eyebrow">Vehicles running now</div>
        {runningNow.length === 0 && <div className="vz-card"><div className="vz-meta">Nothing on the road right now.</div></div>}
        {runningNow.map(({ v, a }) => (
          <div className="vz-kv" key={v.id} style={{ background:"#fff", padding:"10px 13px", border:"1px solid var(--line)", borderRadius:10, marginBottom:6 }}>
            <span style={{ color:"var(--ink)", fontWeight:600 }}>{v.plate}<br />
              <small style={{ color:"var(--muted)", fontWeight:400 }}>{a.driverName || "—"} · since {clock(a.inAt).split(", ").pop()}</small></span>
            <b className="vz-money">{a.openKm != null ? a.openKm + " km" : "—"}</b>
          </div>
        ))}

        <div className="vz-grid">
          <div className="vz-stat"><i>Invoiced</i><b style={{ fontSize:18 }}>{inr(stats.billed)}</b><small>confirmed orders</small></div>
          <div className="vz-stat"><i>Received</i><b style={{ fontSize:18, color:"#178951" }}>{inr(stats.collected)}</b><small>{tdsYtd > 0 ? "plus " + inr(tdsYtd) + " TDS this FY" : "all modes"}</small></div>
          <div className="vz-stat"><i>Pending</i><b style={{ fontSize:18, color:"#E5484D" }}>{inr(rec.total)}</b><small>{rec.overdue > 0 ? inr(rec.overdue) + " past due" : "none past due"}</small></div>
          <div className="vz-stat"><i>Monthly costs</i><b style={{ fontSize:18 }}>{inr(spend + wages + thisMonthSpend)}</b><small>wages, workshop &amp; running</small></div>
        </div>

        {/* The morning's work, before anything else: which cards are empty and
            who has to be called back today. */}
        {(lowCards.length > 0 || callsDue.length > 0) && (
          <div className="vz-card" style={{ background:"#FFF9E6", borderColor:"#F5DFA0" }}>
            <div className="vz-eyebrow" style={{ marginTop:0 }}>Today</div>
            {lowCards.length > 0 && (
              <button className="vz-kv vz-tapcard" style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", width:"100%", textAlign:"left", background:"transparent", border:0, padding:"6px 0", gap:12 }}
                onClick={() => setSheet({ type:"fuel" })}>
                <span>{lowCards.length} petrol card{lowCards.length === 1 ? "" : "s"} need a recharge</span>
                <b style={{ color:"#B4262A" }}>{lowCards.map(c => (vehOf(c.vehicleId) || {}).plate).filter(Boolean).slice(0, 3).join(", ")}</b>
              </button>
            )}
            {callsDue.length > 0 && (
              <button className="vz-kv vz-tapcard" style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", width:"100%", textAlign:"left", background:"transparent", border:0, padding:"6px 0", gap:12 }}
                onClick={() => setSheet({ type:"receivables" })}>
                <span>{callsDue.length} customer{callsDue.length === 1 ? "" : "s"} to call back</span>
                <b style={{ color:"#8A6100" }}>follow up</b>
              </button>
            )}
          </div>
        )}

        <div className="vz-eyebrow">
          Reports
          <button onClick={() => setSheet({ type:"reports" })}>Day, month, quarter, year</button>
        </div>
        <div className="vz-meta" style={{ marginTop:-4, marginBottom:10 }}>
          Profit &amp; loss, GST return, sales, collections, ageing, customer ledgers, payroll and
          the day book — over any period, as files that open in Excel.
        </div>

        <div className="vz-eyebrow">
          Petrol cards
          <button onClick={() => setSheet({ type:"fuel" })}>Balances &amp; recharge</button>
        </div>
        <div className="vz-meta" style={{ marginTop:-4, marginBottom:10 }}>
          {(db.fuelCards || []).length === 0
            ? "No cards yet — add one per van and the balance is checked from here every morning."
            : (db.fuelCards || []).length + " card" + ((db.fuelCards || []).length === 1 ? "" : "s")
              + " · " + inr((db.fuelCards || []).reduce((s, c) => s + cardBalance(c), 0)) + " on them"
              + (lowCards.length ? " · " + lowCards.length + " running low." : " · none running low.")}
        </div>

        <div className="vz-eyebrow">
          Day book
          <button onClick={() => setSheet({ type:"daybook" })}>Entries for the books</button>
        </div>
        <div className="vz-meta" style={{ marginTop:-4, marginBottom:10 }}>
          {pendingVouchers > 0
            ? pendingVouchers + " entr" + (pendingVouchers === 1 ? "y" : "ies") + " this month still to go into the books."
            : "Everything this month is in the books."}
        </div>

        <div className="vz-eyebrow">
          Pending from customers
          <button onClick={() => setSheet({ type:"receivables" })}>Who owes what</button>
        </div>
        <div className="vz-meta" style={{ marginTop:-4, marginBottom:10 }}>
          {rec.rows.length === 0
            ? "Every invoice raised has been settled."
            : inr(rec.total) + " across " + rec.rows.length + " invoice" + (rec.rows.length === 1 ? "" : "s")
              + (rec.overdue > 0 ? " — " + inr(rec.overdue) + " is past the agreed date." : " — none past the agreed date yet.")}
        </div>

        <div className="vz-eyebrow">
          Forecast
          <button onClick={() => setSheet({ type:"forecast" })}>Next four months</button>
        </div>
        <div className="vz-meta" style={{ marginTop:-4, marginBottom:10 }}>
          What is due in on the agreed dates, against payroll and the GST that leaves on the 20th.
        </div>

        <div className="vz-eyebrow">
          Campaign profit
          <button onClick={() => setSheet({ type:"pnl" })}>What each campaign made</button>
        </div>
        <div className="vz-meta" style={{ marginTop:-4, marginBottom:10 }}>
          Revenue against the wages of the vans that actually carried it.
        </div>

        <div className="vz-eyebrow">
          Money out
          <button onClick={() => setSheet({ type:"expenses" })}>Expenses</button>
        </div>
        <div className="vz-meta" style={{ marginTop:-4, marginBottom:10 }}>
          {thisMonthSpend > 0
            ? inr(thisMonthSpend) + " recorded this month" + (thisMonthInputGst > 0 ? ", carrying " + inr(thisMonthInputGst) + " of input GST." : ".")
            : "Nothing recorded this month — diesel, flex, tolls, EMIs. Without these the forecast is only half the picture."}
        </div>

        <div className="vz-eyebrow">
          Vendors
          <button onClick={() => setSheet({ type:"suppliers" })}>Who we buy from</button>
        </div>
        <div className="vz-meta" style={{ marginTop:-4, marginBottom:10 }}>
          {(db.suppliers || []).length > 0
            ? (db.suppliers || []).length + " vendor" + ((db.suppliers || []).length === 1 ? "" : "s") + " on file."
            : "Flex printers, fabricators, fuel stations, landlords — add them here to pick from when recording an expense."}
        </div>

        <div className="vz-eyebrow">
          Petty cash
          <button onClick={() => setSheet({ type:"pettycash" })}>{inr(pettyCashBalance(db))} in the tin</button>
        </div>
        <div className="vz-meta" style={{ marginTop:-4, marginBottom:10 }}>
          A small cash float, topped up from the bank now and then — kept separate from the running balance above.
        </div>

        <div className="vz-eyebrow">
          Payroll
          <button onClick={() => setSheet({ type:"attendance" })}>Attendance &amp; payroll</button>
        </div>
        <div className="vz-meta" style={{ marginTop:-4, marginBottom:10 }}>
          Week ending {dmy(curWeekEnd)} (paid Saturday): {inr(driverPayroll + staffPayroll)}
          {" "}— drivers {inr(driverPayroll)}, staff {inr(staffPayroll)}.
        </div>

        <div className="vz-eyebrow">
          Credit notes
          <button onClick={() => setSheet({ type:"creditnote" })}>Raise one</button>
        </div>
        <div className="vz-meta" style={{ marginTop:-4, marginBottom:10 }}>
          The way to undo an invoice that has already gone out — cancel it in full, or credit part of it.
          The invoice itself stays exactly as it was sent.
        </div>
        {(db.creditNotes || []).slice(0, 4).map(c => {
          const o = orderOf(c.orderId), v = o ? vendorOf(o.vendorId) : null;
          return (
            <div className="vz-card" key={c.id} style={{ background:"#FFF6F6", borderColor:"#F2C9C9" }}>
              <div className="vz-row">
                <div style={{ minWidth:0 }}>
                  <div className="vz-title">{c.no} · {v ? v.name : "—"}</div>
                  <div className="vz-meta">{dmy(c.date)} · against #{c.againstInv} · {c.reason}</div>
                </div>
                <b className="vz-money" style={{ color:"#B4262A" }}>− {inr(c.total)}</b>
              </div>
              <button className="vz-chip c-blue" style={{ marginTop:9 }} onClick={() => openCreditNote(c)}>Open the note</button>
            </div>
          );
        })}

        <div className="vz-eyebrow">
          GST
          <button onClick={() => setSheet({ type:"gst" })}>GST &amp; filing</button>
        </div>
        <div className="vz-meta" style={{ marginTop:-4, marginBottom:10 }}>
          Every tax invoice raised, month by month, with the tax split out and a file for the accountant.
        </div>

        <div className="vz-eyebrow">Proforma invoices</div>
        {db.orders.map(o => {
          const v = vendorOf(o.vendorId), m = orderMath(o), paid = paidOn(o.id);
          return (
            <div className="vz-card" key={o.id}>
              <div className="vz-row">
                <button className="vz-tapcard" style={{ flex:1 }} onClick={() => setOpenOrder(o.id)}>
                  <div className="vz-title" style={{ fontFamily:"var(--mono)", fontSize:13 }}>{o.no}</div>
                  <div className="vz-meta">{v ? v.name : "—"} · {o.title}</div>
                </button>
                <div style={{ textAlign:"right" }}>
                  <div className="vz-money">{inr(m.total)}</div>
                  <Chip c={paid >= m.total ? "c-green" : paid > 0 ? "c-yellow" : "c-grey"}>{paid >= m.total ? "Settled" : paid > 0 ? "Part paid" : "Unpaid"}</Chip>
                </div>
              </div>
              <button className="vz-chip c-blue" style={{ marginTop:9 }} onClick={() => sendProforma(o, false)}>Send invoice again</button>
            </div>
          );
        })}

        {(db.payLinks || []).length > 0 && <>
          <div className="vz-eyebrow">Payment links awaiting payment ({(db.payLinks || []).length})</div>
          {(db.payLinks || []).map(l => (
            <div className="vz-card" key={l.id}>
              <div className="vz-row">
                <div style={{ minWidth:0 }}>
                  <div className="vz-title">{l.vendor_name || "—"}</div>
                  <div className="vz-meta">{l.order_no} · {l.kind} · sent {dmy(l.created_at)}</div>
                </div>
                <b className="vz-money">{inr(l.amount)}</b>
              </div>
              <div className="vz-inline" style={{ marginTop:9, flexWrap:"wrap" }}>
                <button className="vz-chip c-green" onClick={() => { try { navigator.clipboard.writeText(l.link_url); } catch (e) {} setToast("Link copied"); }}>Copy link</button>
                <button className="vz-chip c-blue" onClick={() => window.open(l.link_url, "_blank")}>Open</button>
                <button className="vz-chip c-grey" onClick={async () => {
                  if (!window.confirm("Cancel this payment link?")) return;
                  await apiPost("payments.php", { id: l.id });
                  setDb(d => ({ ...d, payLinks: (d.payLinks || []).filter(x => x.id !== l.id) }));
                  setToast("Link cancelled");
                }}>Cancel</button>
              </div>
            </div>
          ))}
        </>}

        <div className="vz-eyebrow">Payments received</div>
        {db.payments.length === 0 && <div className="vz-card"><div className="vz-meta">No payments recorded.</div></div>}
        {db.payments.map(p => {
          const o = orderOf(p.orderId), v = o ? vendorOf(o.vendorId) : null;
          return (
            <div className="vz-card" key={p.id}>
              <div className="vz-row">
                <div><div className="vz-title">{v ? v.name : "—"}</div><div className="vz-meta">{p.kind} · {p.mode} · {dmy(p.date)}{p.ref ? " · " + p.ref : ""}</div></div>
                <div style={{ textAlign:"right" }}>
                  <div className="vz-money" style={{ color:"#178951" }}>{inr(p.amount)}</div>
                  {perm.del && <button className="vz-chip c-red" style={{ marginTop:6 }}
                    onClick={() => { if (window.confirm("Delete this payment entry?")) { drop("payments", p.id); setToast("Payment deleted"); } }}>Delete</button>}
                </div>
              </div>
            </div>
          );
        })}

        {/* The itemised jobs are a fleet record, not a finance one — the spend
            still counts in monthly costs above and against each campaign's
            margin. Only the Director, who books the work, sees the list. */}
        {perm.fleetEdit && <>
          <div className="vz-eyebrow">Workshop spend</div>
          {db.jobs.map(j => {
            const v = vehOf(j.vehicleId);
            return (
              <div className="vz-kv" key={j.id} style={{ background:"#fff", padding:"11px 14px", border:"1px solid var(--line)", borderRadius:10, marginBottom:6 }}>
                <span>{j.type} · {v ? v.plate : "—"}</span><b className="vz-money">{inr(j.cost)}</b>
              </div>
            );
          })}
        </>}
      </>
    );
  };

  /* ---------------- driver mode ---------------- */
  const signOut = () => {
    if (ADMIN_TOKEN) { try { apiPost("admin_logout.php", {}); } catch (e) {} }  // best-effort: kill the server session
    setAdminToken("");
    setDb(d => ({ ...d, role: "", userId: "", adminToken: "", adminName: "", adminRole: "" }));
    setGate({ step:"choose", userId:"", name:"", pin:"", pin2:"", email:"", pw:"", setupCode:"" });
    setLocked(false); setLockPin("");
    setTab("home");
  };

  const unlock = () => {
    if (me && lockPin === me.pin) { setLocked(false); setLockPin(""); }
    else { setToast("Wrong PIN"); setLockPin(""); }
  };

  // Server admin auth: password verified on the server, returns a session token that
  // unlocks the shared driver/attendance/proof data. A local quick-PIN gates re-opening.
  const finishAdminLogin = (res, pin, name) => {
    setAdminToken(res.token);
    const nm = name || res.name || "Admin";
    // Accounts made before roles existed come back without one — they are Directors.
    const rl = res.role || "Director";
    const u = { id: "admin", name: nm, role: rl, pin: pin };
    setDb(d => ({ ...d, users: [u], userId: "admin", role: "manager",
      adminToken: res.token, adminName: nm, adminRole: rl }));
    setLocked(false); setLockPin("");
    setGate({ step:"choose", userId:"", name:"", pin:"", pin2:"", email:"", pw:"", setupCode:"" });
    setTab("home");
  };
  const adminLogin = async () => {
    const email = (gate.email || "").trim(); const pw = gate.pw || ""; const pin = gate.pin || "";
    if (!email || !pw) return; // PIN is optional
    const res = await apiPost("admin_login.php", { email, password: pw });
    if (!res) { setToast("Could not reach the server — check your connection"); return; }
    if (!res.ok || !res.token) { setToast(res.error === "wrong email or password" ? "Wrong email or password" : (res.error || "Login failed")); return; }
    finishAdminLogin(res, pin, res.name);
  };
  const adminSetup = async () => {
    const email = (gate.email || "").trim(); const pw = gate.pw || ""; const pin = gate.pin || "";
    const code = (gate.setupCode || "").trim(); const name = (gate.name || "").trim();
    if (!email || !pw) return; // PIN and setup code are optional (code is enforced server-side only if configured)
    const s = await apiPost("admin_setup.php", { setup_key: code, email, password: pw, name });
    if (!s) { setToast("Could not reach the server — check your connection"); return; }
    if (!s.ok) { setToast(s.error || "Setup failed"); return; }
    const res = await apiPost("admin_login.php", { email, password: pw });
    if (!res || !res.ok) { setToast("Admin created — now log in"); return; }
    finishAdminLogin(res, pin, name || res.name);
  };
  /* Recovering a forgotten admin password needs the server's own setup key —
     the same secret that protects creating the first admin, kept in
     api/config.php, off the phone. Whoever has that already has real access
     to the server; this just spares them a trip into phpMyAdmin. */
  const adminResetPassword = async () => {
    const email = (gate.email || "").trim(), code = (gate.setupCode || "").trim();
    const pw = gate.pw || "", pw2 = gate.pw2 || "";
    if (!email || !code || !pw) return;
    if (pw !== pw2) { setToast("Those two passwords don't match"); return; }
    if (pw.length < 8) { setToast("Password must be at least 8 characters"); return; }
    const res = await apiPost("admin_reset_password.php", { email, setup_key: code, password: pw });
    if (!res) { setToast("Could not reach the server — check your connection"); return; }
    if (!res.ok) { setToast(res.error || "Could not reset the password"); return; }
    setToast("Password changed — log in with it");
    setGate({ step:"office", userId:"", name:"", pin:"", pin2:"", email, pw:"", pw2:"", setupCode:"", resetting:false });
  };

  // The Admin login / first-time setup / forgot-password screen (server-verified).
  const AdminAuthScreen = () => {
    const cfg = adminCfg;
    const setup = !!(cfg && !cfg.configured);
    const resetting = !setup && !!gate.resetting;
    const requireCode = !!(cfg && cfg.setup_enabled); // a setup code is only needed if the server has one
    const ready = resetting
      ? (gate.email || "").trim() && (gate.setupCode || "").trim() && (gate.pw || "") && (gate.pw2 || "")
      : (gate.email || "").trim() && (gate.pw || "") && (!setup || !requireCode || (gate.setupCode || "").trim());
    return (
      <div className="vz-gate">
        <div className="vz-loginhero">
          <img src="icon.svg" alt="" className="vz-loginlogo" />
          <div className="vz-loginname">Vibe Marketing</div>
          <div className="vz-logintag">Admin</div>
        </div>
        <div className="vz-logincard">
          <h2>{resetting ? "Reset admin password" : setup ? "Set up admin" : "Admin login"}</h2>
          <p>
            {resetting ? "Needs the setup key from api/config.php on the server — not the old password."
              : setup ? "Create the one admin account for your business."
              : "Log in with your admin email and password."}
          </p>
          {!cfg && <div className="vz-meta" style={{ marginTop:0 }}>Checking with the server…</div>}
          {setup && !resetting && (
            <>
              {requireCode && <F label="Setup code"><input value={gate.setupCode || ""} onChange={e => setGate({ ...gate, setupCode: e.target.value })} autoComplete="off" placeholder="from api/config.php" /></F>}
              <F label="Your name"><input value={gate.name || ""} onChange={e => setGate({ ...gate, name: e.target.value })} placeholder="Raj Mohan" /></F>
            </>
          )}
          <F label="Email"><input type="email" value={gate.email || ""} onChange={e => setGate({ ...gate, email: e.target.value })} inputMode="email" autoComplete="username" placeholder="you@vibemarketing.in" /></F>
          {resetting ? (
            <>
              <F label="Setup key"><input value={gate.setupCode || ""} onChange={e => setGate({ ...gate, setupCode: e.target.value })} autoComplete="off" placeholder="from api/config.php" /></F>
              <F label="New password"><input type="password" value={gate.pw || ""} onChange={e => setGate({ ...gate, pw: e.target.value })} autoComplete="new-password" placeholder="at least 8 characters" /></F>
              <F label="Confirm new password"><input type="password" value={gate.pw2 || ""} onChange={e => setGate({ ...gate, pw2: e.target.value })} autoComplete="new-password" placeholder="type it again" /></F>
            </>
          ) : (
            <F label="Password"><input type="password" value={gate.pw || ""} onChange={e => setGate({ ...gate, pw: e.target.value })} autoComplete="current-password" placeholder={setup ? "choose a strong password" : "your password"} /></F>
          )}
          <button className="vz-btn" disabled={!ready} onClick={resetting ? adminResetPassword : setup ? adminSetup : adminLogin}>
            {resetting ? "Reset password" : setup ? "Create admin & open" : "Log in"}
          </button>
          {!setup && (
            <button className="vz-link" onClick={() => setGate({ ...gate, resetting: !resetting, pw:"", pw2:"", setupCode:"" })}>
              {resetting ? "Back to login" : "Forgot password?"}
            </button>
          )}
          <button className="vz-link" onClick={() => { if (mode) signOut(); else setGate({ step:"choose", userId:"", name:"", pin:"", pin2:"", email:"", pw:"", setupCode:"" }); }}>{mode ? "Log out" : tr(lang, "back")}</button>
        </div>
      </div>
    );
  };

  // Shown over the admin app when the session is locked; PIN required to continue.
  const LockScreen = () => (
    <div className="vz-gate">
      <div className="vz-loginhero">
        <img src="icon.svg" alt="" className="vz-loginlogo" />
        <div className="vz-loginname">Vibe Marketing</div>
        <div className="vz-logintag">Locked</div>
      </div>
      <div className="vz-logincard">
        <h2>Welcome back{me ? ", " + String(me.name || "").split(/\s+/)[0] : ""}</h2>
        <p>Enter your admin PIN to continue.</p>
        <F label="PIN">
          <input type="password" value={lockPin} inputMode="numeric" autoFocus
            onChange={e => setLockPin(e.target.value.replace(/\D/g, "").slice(0, 6))}
            onKeyDown={e => { if (e.key === "Enter" && lockPin.length >= 4) unlock(); }}
            style={{ fontFamily:"var(--mono)", letterSpacing:8, fontSize:20, textAlign:"center" }} />
        </F>
        <button className="vz-btn" disabled={lockPin.length < 4} onClick={unlock}>Unlock</button>

            <div className="vz-kv"><span>Webhook secret</span><b>{rzpStatus.webhook ? "✓ set" : "— missing"}</b></div>
            <div className="vz-kv"><span>Payments table</span><b>{rzpStatus.table ? "✓ created" : "— missing"}</b></div>
            {!rzpStatus.ready && (
              <div className="vz-meta" style={{ color:"#8A6100" }}>
                {!rzpStatus.keys && <>Add <b>RAZORPAY_KEY_ID</b> and <b>RAZORPAY_KEY_SECRET</b> in api/config.php.<br /></>}
                {!rzpStatus.webhook && <>Add <b>RAZORPAY_WEBHOOK_SECRET</b> in api/config.php.<br /></>}
                {!rzpStatus.table && <>Run <b>db/db-payments.sql</b> in phpMyAdmin.</>}
              </div>
            )}
            {rzpStatus.ready && rzpStatus.mode === "test" && (
              <div className="vz-meta" style={{ color:"#8A6100" }}>
                Test keys are in use — payments are not real. Swap to live keys when you are ready.
              </div>
            )}
          </>
        )}
      </div>

      <div className="vz-eyebrow">Admin password</div>
      <div className="vz-card">
        <div className="vz-meta" style={{ marginTop:0 }}>
          Signed in as <b>{db.adminName || "Admin"}</b>. Changing the password signs out every other device.
        </div>
        <button className="vz-btn alt" style={{ marginTop:10 }} onClick={() => setSheet({ type:"chgpw" })}>Change password</button>
      </div>

      {perm.users && (
        <>
          <div className="vz-eyebrow">Office logins</div>
          <div className="vz-card">
            <div className="vz-meta" style={{ marginTop:0 }}>
              The finance team sit elsewhere and file the GST returns. Give them their own login
              rather than sharing yours — they see customers, campaigns and money, but not the
              field work, the fleet, or this list.
            </div>
            <button className="vz-btn alt" style={{ marginTop:10 }} onClick={() => setSheet({ type:"users" })}>Manage office logins</button>
          </div>
        </>
      )}

      <div className="vz-eyebrow">Backup</div>
      <div className="vz-card" style={{ background:"#FFF9E6", borderColor:"#F5DFA0" }}>
        <div className="vz-meta" style={{ marginTop:0, color:"#8A6100" }}>
          Everything lives on this phone only. If the browser data is cleared or the phone is lost, it is gone.
          Take a backup every week and keep it somewhere safe.
        </div>
      </div>
      <button className="vz-btn" onClick={() => exportBackup(true)}>Back up everything (with photos)</button>
      <button className="vz-btn alt" onClick={() => exportBackup(false)}>Back up records only (smaller)</button>

      {/* Taking a backup is everyone's business; replacing the books with one is
          not. Restoring, seeding and erasing all overwrite the whole company —
          on the server as well — so they stay with whoever owns it. */}
      {perm.users && <>
        <button className="vz-btn alt" onClick={() => importRef.current && importRef.current.click()}>Restore from a backup file</button>
        <input ref={importRef} className="vz-hidden" type="file" accept="application/json,.json" onChange={importBackup} />

        <div className="vz-eyebrow">Danger zone</div>
        <button className="vz-btn alt" onClick={() => { setDb(d => ({ ...seedData(), users: d.users, userId: d.userId, role: d.role })); setPics({}); setSheet(null); setToast("Sample data loaded"); }}>Load sample data (overwrites everything)</button>
        <button className="vz-btn warn" onClick={() => {
          if (!window.confirm("Erase every customer, campaign, payment, driver and photo — on this phone AND on the server? Take a backup first.")) return;
          setDb(d => {
            // Erasing locally is not enough now that records are backed up: without
            // tombstones the next sync would simply pull all of it back again.
            const now = new Date().toISOString();
            const tomb = [...(d.tombstones || [])];
            Object.keys(SYNC_KEYS).forEach(key => {
              (d[key] || []).forEach(r => { if (r && r.id) tomb.push({ key, id: r.id, updatedAt: now }); });
            });
            return {
              ...blankData(),
              users: d.users, userId: d.userId, role: d.role, settings: d.settings,
              adminToken: d.adminToken, adminName: d.adminName, adminRole: d.adminRole,   // stay signed in
              tombstones: tomb, lastSync: d.lastSync, lastPush: d.lastPush,
            };
          });
          setPics({}); setSheet(null); setToast("Erased — syncing the deletion to the server");
          setTimeout(() => runSync(), 400);
        }}>Erase all records</button>
      </>}
    </Sheet>
  );

            <div className="vz-sub">{!mode ? "Sign in" : mode === "driver" ? "Driver camera" : (me ? me.name + " · " + TITLES[tab] : TITLES[tab])} · {new Date().toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" })}</div>
          </div>
          <div style={{ display:"flex", alignItems:"center" }}>
            {mode === "driver" && (
              <div className="vz-mode" style={{ marginLeft:6 }}>
                <button data-on={lang === "en" ? "1" : "0"} onClick={() => setLang("en")}>EN</button>
                <button data-on={lang === "ta" ? "1" : "0"} onClick={() => setLang("ta")}>தமிழ்</button>
              </div>
            )}
            {mode === "manager" && (pics[me && me.photoId] || (me && me.photoUrl)) && (
              <img className="vz-hdrav" src={pics[me && me.photoId] || me.photoUrl} alt="" />
            )}
            {/* We do not run on credit: a campaign whose advance or midpoint
                balance is unmet gets its own bell, separate from renewals, so
                it is never lost among 36 unrelated FC/insurance badges. Only
                whoever can actually chase money sees it. */}
            {mode === "manager" && !adminGated && perm.money && (
              <button className="vz-gear" onClick={() => setSheet({ type:"paymentalerts" })} aria-label="Payment collection alerts">
                <Icon d={ICONS.money} />
                {stats.paymentAlerts.length > 0 && (
                  <span className="vz-badge" style={{ background: stats.paymentAlerts.some(a => a.level === "overdue") ? "var(--red)" : "var(--yellow)" }}>
                    {stats.paymentAlerts.length}
                  </span>
                )}
              </button>
            )}
            {/* FC and insurance are the fleet's business. Finance was carrying a
                red badge for 36 things she has no way to act on. */}
            {mode === "manager" && !adminGated && perm.renewals !== false && (
              <button className="vz-gear" onClick={() => setSheet({ type:"alerts" })} aria-label="Renewal alerts">
                <Icon d={ICONS.bell} />
                {stats.alerts.length > 0 && <span className="vz-badge">{stats.alerts.length}</span>}
              </button>
            )}
            {mode === "manager" && !adminGated && perm.settings && <button className="vz-gear" onClick={() => setSheet({ type:"settings" })}><Icon d={ICONS.gear} /></button>}
            {mode === "manager" && <button className="vz-logout" onClick={signOut} aria-label="Log out"><Icon d={ICONS.out} />Log out</button>}
          </div>
        </div>
      </header>


      {!mode && RoleGate()}
      {needServerAuth && AdminAuthScreen()}
      {adminLocked && LockScreen()}

      <main className="vz-body" style={{ display: (mode && !adminGated) ? "block" : "none" }}>
        {full && (
          <div className="vz-card" style={{ background:"#FDE4E5", borderColor:"#F3B9BB" }}>
            <div className="vz-meta" style={{ marginTop:0, color:"#B4262A" }}>
              This phone's storage is full, so the newest photos may not be saved. Back up now, then use
              Settings to erase old records.
            </div>
          </div>
        )}
        {mode === "driver" && DriverMode()}
        {mode === "manager" && tab === "home" && Home()}
        {mode === "manager" && tab === "vendors" && Vendors()}
        {mode === "manager" && tab === "orders" && Orders()}
        {mode === "manager" && tab === "field" && Field()}
        {mode === "manager" && tab === "fleet" && Fleet()}
        {mode === "manager" && tab === "money" && Money()}
        <div className="vz-fabgap" style={{ height: fabFor ? 68 : 0 }} />
      </main>

      {fabFor && <button className="vz-fab" onClick={fabFor[1]}>+ {fabFor[0]}</button>}

      {/* On a desktop the rail carries the brand; on a phone this is hidden and
          the brand stays in the header where it always was. */}
      {mode === "manager" && !adminGated && (
        <div className="vz-rail-brand">
          <img src="icon.svg" alt="" />
          <b>Vibe Marketing</b>
        </div>
      )}
      {mode === "manager" && !adminGated && (
        <nav className="vz-nav">
          {[["home","Home"],["vendors","Customers"],["orders","Orders"],["field","Field"],["fleet","Fleet"],["money","Money"]]
            .filter(([k]) => perm.tabs.includes(k)).map(([k, l]) => (
            <button key={k} data-on={tab === k ? "1" : "0"} onClick={() => { setTab(k); setQ(""); }}>
              <Icon d={ICONS[k === "vendors" ? "vendor" : k === "orders" ? "order" : k]} />{l}
            </button>
          ))}
        </nav>
      )}

      {toast && <div className="vz-toast">{toast}</div>}

      {openOrder && OrderDetail()}
      {openProof && ProofDetail()}

      {sheet?.type === "settings" && Settings()}
      {sheet?.type === "gst" && <GstSheet db={db} vendorOf={vendorOf} onClose={() => setSheet(null)} />}
      {sheet?.type === "users" && <OfficeUsersSheet setToast={setToast} onClose={() => setSheet(null)} />}
      {sheet?.type === "attendance" && <AttendanceSheet db={db} vehOf={vehOf} drvOf={drvOf} perm={perm}
        onPunchIn={officePunchIn} onPunchOut={officePunchOut}
        onEditStaff={(s) => setSheet({ type:"staff", data:s })}
        onOutstation={(a, on) => setDb(d => ({ ...d, attendance: (d.attendance || []).map(x => (x.id === a.id ? { ...x, outstation: on } : x)) }))}
        onAdvance={(drv) => setSheet({ type:"advance", data:drv })}
        onPayWeek={payWeek} onPayslip={sendPayslip}
        onClose={() => setSheet(null)} />}
      {sheet?.type === "expenses" && (
        <ExpensesSheet db={db} vehOf={vehOf} onClose={() => setSheet(null)}
          onAdd={() => setSheet({ type:"expense" })}
          onEdit={(e) => setSheet({ type:"expense", data:e })} />
      )}
      {sheet?.type === "expense" && (() => {
        const back = sheet.returnTo || "expenses";
        return (
          <ExpenseForm init={sheet.data} db={db} defaultMode={sheet.defaultMode} onClose={() => setSheet({ type:back })}
            onSave={(x) => { put("expenses", x); setSheet({ type:back }); setToast("Expense saved"); }}
            onDelete={(id) => { drop("expenses", id); setSheet({ type:back }); setToast("Expense deleted"); }} />
        );
      })()}
      {sheet?.type === "pettycash" && (
        <PettyCashSheet db={db} onClose={() => setSheet(null)}
          onAdd={() => setSheet({ type:"expense", defaultMode:"Petty cash", returnTo:"pettycash" })}
          onEditExpense={(e) => setSheet({ type:"expense", data:e, returnTo:"pettycash" })}
          onTopup={() => setSheet({ type:"pettytopup" })}
          onDeleteTopup={(id) => { drop("pettyTopups", id); setToast("Top-up removed"); }} />
      )}
      {sheet?.type === "pettytopup" && (
        <TopupForm onClose={() => setSheet({ type:"pettycash" })}
          onSave={(x) => { put("pettyTopups", x); setSheet({ type:"pettycash" }); setToast("Top-up recorded"); }} />
      )}
      {sheet?.type === "creditnote" && (
        <CreditNoteForm db={db} vendorOf={vendorOf} paidOn={paidOn}
          nextNo={"CN/" + new Date().getFullYear() + "/" + String(db.settings.nextCnNo || 1).padStart(3, "0")}
          onClose={() => setSheet(null)}
          onSave={(cn) => {
            put("creditNotes", cn);
            setSetting("nextCnNo", (db.settings.nextCnNo || 1) + 1);
            setToast("Credit note " + cn.no + " raised");
            openCreditNote(cn);
          }} />
      )}
      {sheet?.type === "paymentalerts" && (
        <PaymentAlertsSheet list={stats.paymentAlerts} onClose={() => setSheet(null)}
          onOpenOrder={(id) => { setSheet(null); setOpenOrder(id); }}
          onRecordPayment={(orderId, kind) => setSheet({ type:"payment", data:{ orderId, kind } })}
          onSend={sendPaymentReminder} />
      )}
      {sheet?.type === "advance" && (
        <AdvanceForm driver={sheet.data} db={db} onClose={() => setSheet({ type:"attendance" })}
          onSave={(x) => { put("advances", x); setSheet({ type:"attendance" }); setToast("Advance recorded"); }}
          onDelete={(id) => { drop("advances", id); setToast("Advance deleted"); }} />
      )}
      {sheet?.type === "receivables" && (
        <ReceivablesSheet db={db} paidOn={paidOn} onClose={() => setSheet(null)}
          onOpenOrder={(id) => { setSheet(null); setOpenOrder(id); }}
          onSend={sendStatement}
          onFollowup={(row) => setSheet({ type:"followup", data:row })} />
      )}
      {sheet?.type === "followup" && (
        <FollowupForm row={sheet.data} db={db} onClose={() => setSheet({ type:"receivables" })}
          onSave={(x) => { put("followups", x); setSheet({ type:"receivables" }); setToast("Follow-up saved"); }} />
      )}
      {sheet?.type === "fuel" && (
        <FuelCardsSheet db={db} vehOf={vehOf} perm={perm} onClose={() => setSheet(null)}
          onAddCard={() => setSheet({ type:"fuelcard" })}
          onEditCard={(c) => setSheet({ type:"fuelcard", data:c })}
          onRecharge={(c) => setSheet({ type:"fueltxn", data:c, kind:"recharge" })}
          onBalance={(c) => setSheet({ type:"fueltxn", data:c, kind:"reading" })} />
      )}
      {sheet?.type === "fuelcard" && (
        <FuelCardForm init={sheet.data} db={db} vehOf={vehOf} onClose={() => setSheet({ type:"fuel" })}
          onSave={(x) => { put("fuelCards", x); setSheet({ type:"fuel" }); setToast("Card saved"); }}
          onDelete={(id) => { drop("fuelCards", id); setSheet({ type:"fuel" }); setToast("Card removed"); }} />
      )}
      {sheet?.type === "fueltxn" && (
        <FuelTxnForm card={sheet.data} vehOf={vehOf} kind={sheet.kind} onClose={() => setSheet({ type:"fuel" })}
          onSave={(t) => { rechargeCard(sheet.data, t); setSheet({ type:"fuel" }); }} />
      )}
      {sheet?.type === "reports" && (
        <ReportsSheet db={db} paidOn={paidOn} vendorOf={vendorOf} vehOf={vehOf} drvOf={drvOf} onClose={() => setSheet(null)} />
      )}
      {sheet?.type === "daybook" && (
        <DayBookSheet db={db} onClose={() => setSheet(null)}
          onAddVoucher={() => setSheet({ type:"voucher" })}
          onMark={(id, on) => { if (on) put("tallyMarks", { id, at: new Date().toISOString() }); else drop("tallyMarks", id); }} />
      )}
      {sheet?.type === "voucher" && (
        <VoucherForm db={db} onClose={() => setSheet({ type:"daybook" })}
          onSave={(x) => { put("vouchers", x); setSheet({ type:"daybook" }); setToast("Entry saved"); }} />
      )}
      {sheet?.type === "forecast" && <ForecastSheet db={db} paidOn={paidOn} onClose={() => setSheet(null)} />}
      {sheet?.type === "pnl" && (
        <CampaignPnlSheet db={db} vendorOf={vendorOf} onClose={() => setSheet(null)}
          onOpenOrder={(id) => { setSheet(null); setOpenOrder(id); }} />
      )}
      {sheet?.type === "staff" && (
        <StaffForm init={sheet.data} onClose={() => setSheet(null)}
          onSave={(x) => { put("staff", x); setSheet(null); }}
          onDelete={(id) => { if (window.confirm("Remove this person from staff? Past weeks stay in the record.")) { drop("staff", id); setSheet(null); } }} />
      )}
      {sheet?.type === "suppliers" && (
        <SuppliersSheet suppliers={db.suppliers} onClose={() => setSheet(null)}
          onAdd={() => setSheet({ type:"supplier" })}
          onEdit={(s) => setSheet({ type:"supplier", data:s })} />
      )}
      {sheet?.type === "supplier" && (
        <SupplierForm init={sheet.data} onClose={() => setSheet({ type:"suppliers" })}
          onSave={(x) => { put("suppliers", x); setSheet({ type:"suppliers" }); }}
          onDelete={(id) => { if (window.confirm("Delete this vendor?")) { drop("suppliers", id); setSheet({ type:"suppliers" }); } }} />
      )}
      {sheet?.type === "reminders" && (
        <RemindersSheet db={db} onSend={sendCustomerReminder} onManage={() => setSheet({ type:"occasions" })} onClose={() => setSheet(null)} />
      )}
      {sheet?.type === "occasions" && (
        <OccasionsSheet db={db} onAdd={() => setSheet({ type:"occasion" })} onEdit={(o) => setSheet({ type:"occasion", data:o })} onClose={() => setSheet({ type:"reminders" })} />
      )}
      {sheet?.type === "occasion" && (
        <OccasionForm init={sheet.data} onClose={() => setSheet({ type:"occasions" })}
          onSave={(x) => { put("occasions", x); setSheet({ type:"occasions" }); setToast("Occasion saved"); }}
          onDelete={(id) => { drop("occasions", id); setSheet({ type:"occasions" }); setToast("Occasion deleted"); }} />
      )}
      {sheet?.type === "alerts" && (
        <AlertsSheet list={stats.alerts} settings={db.settings} onClose={() => setSheet(null)}
          onRenew={(a) => setSheet({ type:"renew", data:a })}
          onRemind={remindRenewal}
          onSnooze={snoozeAlert} />
      )}
      {sheet?.type === "renew" && (
        <RenewSheet alert={sheet.data} vehicle={vehOf(sheet.data.vehId)} onClose={() => setSheet(null)}
          onSave={(f) => doRenew(sheet.data, f)} />
      )}
      {sheet?.type === "vendor" && (
        <VendorForm init={sheet.data} canDel={perm.del} onClose={() => setSheet(null)}
          onSave={(x) => {
            const isNew = !sheet.data;
            put("vendors", x); setSheet(null);
            if (isNew && (x.phone || x.email)) setTimeout(() => sendCustomerReminder({ kind:"welcome", key:"welcome|" + x.id, vendor:x }), 200);
          }}
          onDelete={(id) => {
            if (db.orders.some(o => o.vendorId === id)) { setToast("This vendor has campaigns — delete those first"); return; }
            const vn = (db.vendors.find(x => x.id === id) || {}).name || "this customer";
            if (!window.confirm("Delete " + vn + "? This cannot be undone.")) return;
            drop("vendors", id); setSheet(null); setToast("Customer deleted");
          }} />
      )}
      {sheet?.type === "order" && (
        <OrderForm init={sheet.data} vendors={db.vendors} settings={db.settings} onClose={() => setSheet(null)}
          onSave={(x) => {
            let issued = null;
            if (!x.no) { issued = nextOrderNo(); }
            // Stamp the tax treatment from the customer's state now, so every
            // later screen prints the right pair without needing the customer.
            const rec = { ...x, no: x.no || issued.no, created: x.created || today(), sends: x.sends || [], vehicleIds: x.vehicleIds || [],
              igst: isInterstate(vendorOf(x.vendorId), db.settings) };
            if (issued) setSetting(issued.key, issued.n);
            put("orders", rec);
            setSheet(null);
            // The proper document, not a text message: this used to fire the
            // plain-text version automatically while the actual formatted PDF
            // sat one tap away on the order screen — so the one send that
            // happens without anyone asking for it was the weaker one.
            if (!x.id || !(x.sends || []).length) { if (db.settings.autoSendProforma) setTimeout(() => openDoc(rec, "QUOTATION"), 250); }
          }} />
      )}
      {sheet?.type === "vehicle" && (
        <VehicleForm init={sheet.data} drivers={db.drivers} plates={db.vehicles} canEdit={perm.fleetEdit} canDel={perm.fleetEdit} onClose={() => setSheet(null)}
          onSave={(x) => { put("vehicles", x); setSheet(null); }}
          onDelete={(id) => {
            const veh = (db.vehicles || []).find(x => x.id === id) || {};
            const hist = (db.attendance || []).filter(a => a.vehicleId === id).length;
            const warn = "Delete vehicle " + (veh.plate || "") + "? This cannot be undone."
              + (hist ? " It has " + hist + " duty record(s), which stay but lose their vehicle." : "");
            if (!window.confirm(warn)) return;
            drop("vehicles", id);
            setDb(d => ({ ...d, orders: d.orders.map(o => ({ ...o, vehicleIds: (o.vehicleIds || []).filter(x => x !== id) })) }));
            setSheet(null); setToast("Vehicle deleted");
          }} />
      )}
      {sheet?.type === "driver" && (
        <DriverForm init={sheet.data} pics={pics} canEdit={perm.fleetEdit} canDel={perm.fleetEdit} onPhoto={savePic} onClose={() => setSheet(null)}
          onSave={(x) => {
            put("drivers", x); setSheet(null);
            apiPost("drivers.php", {
              id: x.id, name: x.name, phone: x.phone, pin: x.pin || "", active: 1,
              emergency: x.refPhone || "", dl: x.dl || "", dl_expiry: x.dlExpiry || "",
              photo_data: pics[x.photoId] || "", dl_front_data: pics[x.dlFrontId] || "", dl_back_data: pics[x.dlBackId] || "",
            }).then(res => {
              if (res && (res.photo_url || res.dl_front_url || res.dl_back_url)) {
                put("drivers", { ...x, photoUrl: res.photo_url || x.photoUrl, dlFrontUrl: res.dl_front_url || x.dlFrontUrl, dlBackUrl: res.dl_back_url || x.dlBackUrl });
              }
            });
          }}
          onDelete={(id) => {
            const d0 = (db.drivers || []).find(x => x.id === id);
            const onDuty = (db.attendance || []).some(a => a.driverId === id && !a.outAt);
            if (onDuty) { setToast("This driver is on duty — end the shift first"); return; }
            if (!window.confirm("Remove driver " + ((d0 || {}).name || "") + "? They will no longer be able to sign in.")) return;
            drop("drivers", id);
            if (d0) apiPost("drivers.php", { id: d0.id, name: d0.name, phone: d0.phone, pin: d0.pin || "", active: 0 });
            setDb(d => ({ ...d, vehicles: d.vehicles.map(v => v.driverId === id ? { ...v, driverId: "" } : v) }));
            setSheet(null); setToast("Driver deleted");
          }} />
      )}
      {sheet?.type === "chgpw" && (
        <ChangePwSheet onClose={() => setSheet(null)}
          onSave={async (cur, nw) => {
            const res = await apiPost("admin_password.php", { current_password: cur, new_password: nw });
            if (!res) { setToast("Could not reach the server"); return; }
            if (!res.ok) { setToast(res.error || "Could not change the password"); return; }
            setSheet(null);
            setToast("Password changed · other devices signed out");
          }} />
      )}
      {sheet?.type === "paylink" && (
        <PayLinkSheet order={sheet.data} vendor={vendorOf(sheet.data.vendorId)} math={orderMath(sheet.data)}
          paid={paidOn(sheet.data.id)} busy={payBusy} status={rzpStatus}
          onCreate={(amt, kind) => makePayLink(sheet.data, amt, kind)}
          onClose={() => setSheet(null)} />
      )}
      {sheet?.type === "payment" && (
        <PaymentForm orders={db.orders} vendors={db.vendors} paidOn={paidOn}
          initOrderId={sheet.data && sheet.data.orderId} initKind={sheet.data && sheet.data.kind}
          onClose={() => setSheet(null)}
          onSave={(x) => {
            put("payments", x); setSheet(null);
            const o = orderOf(x.orderId);
            if (o && db.settings.autoReceipt) setTimeout(() => sendReceipt(o, x), 250);
          }} />
      )}
      {sheet?.type === "job" && <JobForm vehicles={db.vehicles} onClose={() => setSheet(null)} onSave={(x) => { put("jobs", x); setSheet(null); }} />}

      {invAsk && (() => {
        const o = invAsk.order;
        const rate = quotedOutRate(o, db.settings);
        const km = +invAsk.km || 0;
        const extra = Math.round(rate * km);
        return (
          <Sheet title="Extra kilometres run" onClose={() => setInvAsk(null)}>
            <div className="vz-meta" style={{ marginBottom:12 }}>
              Outstation running is charged at {inr(rate)} per kilometre. Enter the total
              extra kilometres for this campaign, or leave it blank if there were none.
            </div>
            <F label="Total extra kilometres">
              <input type="number" inputMode="numeric" min="0" autoFocus placeholder="0"
                value={invAsk.km}
                onChange={e => setInvAsk({ ...invAsk, km: e.target.value.replace(/\D/g, "").slice(0, 6) })} />
            </F>
            {(() => {
              const v = vendorOf(o.vendorId);
              const monthly = billingOf(o, v) === "monthly";
              const slice = monthly ? nextSlice({ ...o, outKm: km }, v) : null;
              const total = monthly
                ? (slice ? cnMath(o, slice.sub).total : 0)
                : orderMath({ ...o, outKm: km }).total;
              return (
                <>
                  <div className="vz-card" style={{ background:"#FAFBFC" }}>
                    {monthly && slice && (
                      <div className="vz-kv">
                        <span>Billing period</span>
                        <b>{dmy(slice.from)} – {dmy(slice.to)} · {slice.days} days</b>
                      </div>
                    )}
                    <div className="vz-kv">
                      <span>{km ? km + " km × " + inr(rate) : "Extra running"}</span>
                      <b className="vz-money">{extra ? inr(extra) : "—"}</b>
                    </div>
                    <div className="vz-kv">
                      <span style={{ fontWeight:700, color:"#12192A" }}>Invoice total</span>
                      <b className="vz-money" style={{ fontSize:16 }}>{inr(total)}</b>
                    </div>
                  </div>
                  {monthly && !slice && (
                    <div className="vz-meta" style={{ color:"#8A6100" }}>
                      Every month of this campaign has already been invoiced.
                    </div>
                  )}
                  {monthly && slice && !slice.last && (
                    <div className="vz-meta">
                      This bills one month only. The outstation running is added to the final month's invoice.
                    </div>
                  )}
                  <button className="vz-btn" disabled={monthly && !slice} onClick={() => raiseInvoice(o, km)}>
                    {monthly
                      ? (slice ? "Raise invoice for " + dmy(slice.from) + " – " + dmy(slice.to) : "Nothing left to invoice")
                      : (km ? "Raise tax invoice with " + km + " km" : "Raise tax invoice — no extra running")}
                  </button>
                </>
              );
            })()}
          </Sheet>
        );
      })()}

      {doc && (
        <div className="vz-invoice-overlay">
          <div className="vz-invoice-actions vz-noprint" style={{ flexWrap:"wrap" }}>
            <button className="vz-btn alt" style={{ margin:0 }} onClick={() => setDoc(null)}>← Close</button>
            {/* The PDF goes on its own — no message alongside it. A quotation
                repeated as text under the attachment read as clutter. */}
            <button className="vz-btn go" style={{ margin:0 }} onClick={async () => {
              const ok = await sharePdf(doc.blob, doc.file);
              if (ok) { logSend(doc.order, doc.title === "TAX INVOICE" ? "Invoice" : "Quotation", "WhatsApp"); setToast("Sent"); }
              else { savePdf(doc.blob, doc.file); openWA(doc.vendor?.phone, ""); setToast("PDF saved — attach it in the chat"); }
            }}>Send PDF on WhatsApp</button>
            <button className="vz-btn alt" style={{ margin:0 }} onClick={() => {
              savePdf(doc.blob, doc.file);
              setToast("PDF saved to your downloads");
            }}>Save PDF</button>
            <button className="vz-btn alt" style={{ margin:0 }} onClick={() => {
              savePdf(doc.blob, doc.file);
              openMail(doc.vendor?.email, doc.subject, "");
              setToast("Email opened — attach the saved PDF");
            }}>Email</button>
            <button className="vz-btn alt" style={{ margin:0 }} onClick={() => {
              try { navigator.clipboard.writeText(doc.text); } catch (e) {}
              setToast("Text copied");
            }}>Copy text</button>
          </div>
          <div className="vz-invoice" style={{ padding:0, background:"#fff" }}>
            {doc.pages.map((p, i) => (
              <img key={i} src={p.url} alt={doc.title + " page " + (i + 1)}
                style={{ width:"100%", display:"block", marginBottom: i === 0 ? 14 : 0 }} />
            ))}
          </div>
        </div>
      )}

      {closing && (
        <Sheet title={lang === "ta" ? "பணி முடி" : "Stop duty"} onClose={() => setClosing(false)}>
          <F label={lang === "ta" ? "இறுதி கிலோமீட்டர் (Closing KM)" : "Closing kilometers"}>
            <input value={closeKm} onChange={e => setCloseKm(e.target.value.replace(/\D/g, "").slice(0, 8))}
              inputMode="numeric" placeholder={lang === "ta" ? "மீட்டர் அளவை உள்ளிடவும்" : "Enter the odometer reading"} style={{ fontFamily:"var(--mono)", fontSize:19 }} />
          </F>
          <button className="vz-btn go" disabled={(closeKm || "") === ""} onClick={confirmEndDuty}>
            {lang === "ta" ? "பணியை முடி" : "Confirm — stop duty"}
          </button>
          <div className="vz-meta">{lang === "ta" ? "இறுதி கிலோமீட்டர் கட்டாயம்." : "Closing kilometers are required to stop duty."}</div>
        </Sheet>
      )}

      {capture && (
        <CaptureSheet ctx={capture} pics={pics} lang={lang} onPhoto={savePic} onClose={() => setCapture(null)}
          onSave={(pr) => {
            put("proofs", pr); setCapture(null);
            setToast("Photo saved with GPS stamp");
            const dataUrl = pics[pr.photoId];
            const ord = pr.orderId ? orderOf(pr.orderId) : null;
            queuePost("proofs.php", {
              id: pr.id, at: pr.at, kind: pr.kind,
              vehicle_id: pr.vehicleId, vehicle_plate: (vehOf(pr.vehicleId) || {}).plate || "",
              driver_name: pr.driverName || "", order_id: pr.orderId || "",
              vendor_name: (ord && vendorOf(ord.vendorId) || {}).name || "",
              lat: pr.lat, lng: pr.lng, place: pr.place || "", note: pr.note || "",
              photo_data: dataUrl || "",
            }).then(res => { if (res && res.photo_url) put("proofs", { ...pr, photoUrl: res.photo_url }); });
            if (db.settings.autoProofToVendor) setTimeout(() => sendProof({ ...pr, auto: true }, "vendor"), 250);
          }} />
      )}

      {send && <SendSheet payload={send} onClose={() => setSend(null)} onSent={(ch) => { send.onSent(ch); setSend(null); }} />}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<VibeCRM />);
</script>
</body>
</html>
