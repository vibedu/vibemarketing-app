            <div className="vz-sub">{!mode ? "Sign in" : mode === "driver" ? "Driver camera" : (me ? me.name + " · " + TITLES[tab] : TITLES[tab])} · {new Date().toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" })}</div>
          </div>
          <div style={{ display:"flex", alignItems:"center" }}>
            {mode === "driver" && (
              <div className="vz-mode" style={{ marginLeft:6 }}>
                <button data-on={lang === "en" ? "1" : "0"} onClick={() => setLang("en")}>EN</button>
                <button data-on={lang === "ta" ? "1" : "0"} onClick={() => setLang("ta")}>தமிழ்</button>
              </div>
            )}
            {mode === "manager" && (pics[me && me.photoId] || (me && me.photoUrl)) && (
              <img className="vz-hdrav" src={pics[me && me.photoId] || me.photoUrl} alt="" />
            )}
            {mode === "manager" && !adminGated && (
              <button className="vz-gear" onClick={() => setSheet({ type:"alerts" })} aria-label="Renewal alerts">
                <Icon d={ICONS.bell} />
                {stats.alerts.length > 0 && <span className="vz-badge">{stats.alerts.length}</span>}
              </button>
            )}
            {mode === "manager" && !adminGated && perm.settings && <button className="vz-gear" onClick={() => setSheet({ type:"settings" })}><Icon d={ICONS.gear} /></button>}
            {mode === "manager" && <button className="vz-logout" onClick={signOut} aria-label="Log out"><Icon d={ICONS.out} />Log out</button>}
          </div>
        </div>
      </header>


      {!mode && RoleGate()}
      {needServerAuth && AdminAuthScreen()}
      {adminLocked && LockScreen()}

      <main className="vz-body" style={{ display: (mode && !adminGated) ? "block" : "none" }}>
        {full && (
          <div className="vz-card" style={{ background:"#FDE4E5", borderColor:"#F3B9BB" }}>
            <div className="vz-meta" style={{ marginTop:0, color:"#B4262A" }}>
              This phone's storage is full, so the newest photos may not be saved. Back up now, then use
              Settings to erase old records.
            </div>
          </div>
        )}
        {mode === "driver" && DriverMode()}
        {mode === "manager" && tab === "home" && Home()}
        {mode === "manager" && tab === "vendors" && Vendors()}
        {mode === "manager" && tab === "orders" && Orders()}
        {mode === "manager" && tab === "field" && Field()}
        {mode === "manager" && tab === "fleet" && Fleet()}
        {mode === "manager" && tab === "money" && Money()}
        <div className="vz-fabgap" style={{ height: fabFor ? 68 : 0 }} />
      </main>

      {fabFor && <button className="vz-fab" onClick={fabFor[1]}>+ {fabFor[0]}</button>}

      {mode === "manager" && !adminGated && (
        <nav className="vz-nav">
          {[["home","Home"],["vendors","Vendors"],["orders","Orders"],["field","Field"],["fleet","Fleet"],["money","Money"]]
            .filter(([k]) => perm.tabs.includes(k)).map(([k, l]) => (
            <button key={k} data-on={tab === k ? "1" : "0"} onClick={() => { setTab(k); setQ(""); }}>
              <Icon d={ICONS[k === "vendors" ? "vendor" : k === "orders" ? "order" : k]} />{l}
            </button>
          ))}
        </nav>
      )}

      {toast && <div className="vz-toast">{toast}</div>}

      {openOrder && OrderDetail()}
      {openProof && ProofDetail()}

      {sheet?.type === "settings" && Settings()}
      {sheet?.type === "user" && (
        <UserForm init={sheet.data} isSelf={sheet.data && sheet.data.id === db.userId}
          onClose={() => setSheet(null)}
          onSave={(x) => { put("users", x); setSheet(null); setToast("User saved"); }}
          onDelete={(id) => { drop("users", id); setSheet(null); setToast("User removed"); }} />
      )}
      {sheet?.type === "attendance" && <AttendanceSheet db={db} vehOf={vehOf} drvOf={drvOf} onClose={() => setSheet(null)} />}
      {sheet?.type === "reminders" && (
        <RemindersSheet db={db} onSend={sendCustomerReminder} onManage={() => setSheet({ type:"occasions" })} onClose={() => setSheet(null)} />
      )}
      {sheet?.type === "occasions" && (
        <OccasionsSheet db={db} onAdd={() => setSheet({ type:"occasion" })} onEdit={(o) => setSheet({ type:"occasion", data:o })} onClose={() => setSheet({ type:"reminders" })} />
      )}
      {sheet?.type === "occasion" && (
        <OccasionForm init={sheet.data} onClose={() => setSheet({ type:"occasions" })}
          onSave={(x) => { put("occasions", x); setSheet({ type:"occasions" }); setToast("Occasion saved"); }}
          onDelete={(id) => { drop("occasions", id); setSheet({ type:"occasions" }); setToast("Occasion deleted"); }} />
      )}
      {sheet?.type === "alerts" && (
        <AlertsSheet list={stats.alerts} settings={db.settings} onClose={() => setSheet(null)}
          onRenew={(a) => setSheet({ type:"renew", data:a })}
          onRemind={remindRenewal}
          onSnooze={snoozeAlert} />
      )}
      {sheet?.type === "renew" && (
        <RenewSheet alert={sheet.data} vehicle={vehOf(sheet.data.vehId)} onClose={() => setSheet(null)}
          onSave={(f) => doRenew(sheet.data, f)} />
      )}
      {sheet?.type === "vendor" && (
        <VendorForm init={sheet.data} canDel={perm.del} onClose={() => setSheet(null)}
          onSave={(x) => {
            const isNew = !sheet.data;
            put("vendors", x); setSheet(null);
            if (isNew && (x.phone || x.email)) setTimeout(() => sendCustomerReminder({ kind:"welcome", key:"welcome|" + x.id, vendor:x }), 200);
          }}
          onDelete={(id) => {
            if (db.orders.some(o => o.vendorId === id)) { setToast("This vendor has campaigns — delete those first"); return; }
            drop("vendors", id); setSheet(null); setToast("Vendor deleted");
          }} />
      )}
      {sheet?.type === "order" && (
        <OrderForm init={sheet.data} vendors={db.vendors} onClose={() => setSheet(null)}
          onSave={(x) => {
            const rec = { ...x, no: x.no || nextOrderNo(), created: x.created || today(), sends: x.sends || [], vehicleIds: x.vehicleIds || [] };
            put("orders", rec);
            setSheet(null);
            if (!x.id || !(x.sends || []).length) { if (db.settings.autoSendProforma) setTimeout(() => sendProforma(rec, true), 250); }
          }} />
      )}
      {sheet?.type === "vehicle" && (
        <VehicleForm init={sheet.data} drivers={db.drivers} plates={db.vehicles} canEdit={perm.fleetEdit} canDel={perm.del} onClose={() => setSheet(null)}
          onSave={(x) => { put("vehicles", x); setSheet(null); }}
          onDelete={(id) => {
            drop("vehicles", id);
            setDb(d => ({ ...d, orders: d.orders.map(o => ({ ...o, vehicleIds: (o.vehicleIds || []).filter(x => x !== id) })) }));
            setSheet(null); setToast("Vehicle deleted");
          }} />
      )}
      {sheet?.type === "driver" && (
        <DriverForm init={sheet.data} pics={pics} canEdit={perm.fleetEdit} canDel={perm.del} onPhoto={savePic} onClose={() => setSheet(null)}
          onSave={(x) => {
            put("drivers", x); setSheet(null);
            apiPost("drivers.php", {
              id: x.id, name: x.name, phone: x.phone, pin: x.pin || "", active: 1,
              emergency: x.refPhone || "", dl: x.dl || "", dl_expiry: x.dlExpiry || "",
              photo_data: pics[x.photoId] || "", dl_front_data: pics[x.dlFrontId] || "", dl_back_data: pics[x.dlBackId] || "",
            }).then(res => {
              if (res && (res.photo_url || res.dl_front_url || res.dl_back_url)) {
                put("drivers", { ...x, photoUrl: res.photo_url || x.photoUrl, dlFrontUrl: res.dl_front_url || x.dlFrontUrl, dlBackUrl: res.dl_back_url || x.dlBackUrl });
              }
            });
          }}
          onDelete={(id) => {
            const d0 = (db.drivers || []).find(x => x.id === id);
            drop("drivers", id);
            if (d0) apiPost("drivers.php", { id: d0.id, name: d0.name, phone: d0.phone, pin: d0.pin || "", active: 0 });
            setDb(d => ({ ...d, vehicles: d.vehicles.map(v => v.driverId === id ? { ...v, driverId: "" } : v) }));
            setSheet(null); setToast("Driver deleted");
          }} />
      )}
      {sheet?.type === "chgpw" && (
        <ChangePwSheet onClose={() => setSheet(null)}
          onSave={async (cur, nw) => {
            const res = await apiPost("admin_password.php", { current_password: cur, new_password: nw });
            if (!res) { setToast("Could not reach the server"); return; }
            if (!res.ok) { setToast(res.error || "Could not change the password"); return; }
            setSheet(null);
            setToast("Password changed · other devices signed out");
          }} />
      )}
      {sheet?.type === "paylink" && (
        <PayLinkSheet order={sheet.data} vendor={vendorOf(sheet.data.vendorId)} math={orderMath(sheet.data)}
          paid={paidOn(sheet.data.id)} busy={payBusy} status={rzpStatus}
          onCreate={(amt, kind) => makePayLink(sheet.data, amt, kind)}
          onClose={() => setSheet(null)} />
      )}
      {sheet?.type === "payment" && (
        <PaymentForm orders={db.orders} vendors={db.vendors} onClose={() => setSheet(null)}
          onSave={(x) => {
            put("payments", x); setSheet(null);
            const o = orderOf(x.orderId);
            if (o && db.settings.autoReceipt) setTimeout(() => sendReceipt(o, x), 250);
          }} />
      )}
      {sheet?.type === "job" && <JobForm vehicles={db.vehicles} onClose={() => setSheet(null)} onSave={(x) => { put("jobs", x); setSheet(null); }} />}

      {invoice && InvoiceView()}

      {doc && (
        <div className="vz-invoice-overlay">
          <div className="vz-invoice-actions vz-noprint" style={{ flexWrap:"wrap" }}>
            <button className="vz-btn alt" style={{ margin:0 }} onClick={() => setDoc(null)}>← Close</button>
            <button className="vz-btn go" style={{ margin:0 }} onClick={async () => {
              const ok = await sharePhoto(doc.url, doc.text);
              if (ok) { logSend(doc.order, doc.title === "TAX INVOICE" ? "Invoice" : "Quotation", "WhatsApp"); setToast("Shared"); }
              else { openWA(doc.vendor?.phone, doc.text); setToast("Image sharing not supported here — text opened instead"); }
            }}>Send on WhatsApp</button>
            <button className="vz-btn" style={{ margin:0 }} onClick={() => window.print()}>Print / Save PDF</button>
            <button className="vz-btn alt" style={{ margin:0 }} onClick={() => {
              const a = document.createElement("a");
              a.href = doc.url;
              a.download = (doc.title === "TAX INVOICE" ? "invoice-" : "quotation-") + (doc.order.invNo || doc.order.no || "").replace(/\W+/g, "-") + ".jpg";
              document.body.appendChild(a); a.click(); document.body.removeChild(a);
              setToast("Saved to your downloads");
            }}>Save image</button>
            <button className="vz-btn alt" style={{ margin:0 }} onClick={() => {
              openMail(doc.vendor?.email, doc.subject, doc.text);
              setToast("Email opened — attach the saved image");
            }}>Email</button>
            <button className="vz-btn alt" style={{ margin:0 }} onClick={() => {
              try { navigator.clipboard.writeText(doc.text); } catch (e) {}
              setToast("Text copied");
            }}>Copy text</button>
          </div>
          <div className="vz-invoice" style={{ padding:0, background:"#fff" }}>
            <img src={doc.url} alt={doc.title} style={{ width:"100%", display:"block" }} />
          </div>
        </div>
      )}

      {closing && (
        <Sheet title={lang === "ta" ? "பணி முடி" : "Stop duty"} onClose={() => setClosing(false)}>
          <F label={lang === "ta" ? "இறுதி கிலோமீட்டர் (Closing KM)" : "Closing kilometers"}>
            <input value={closeKm} onChange={e => setCloseKm(e.target.value.replace(/\D/g, "").slice(0, 8))}
              inputMode="numeric" placeholder={lang === "ta" ? "மீட்டர் அளவை உள்ளிடவும்" : "Enter the odometer reading"} style={{ fontFamily:"var(--mono)", fontSize:19 }} />
          </F>
          <button className="vz-btn go" disabled={(closeKm || "") === ""} onClick={confirmEndDuty}>
            {lang === "ta" ? "பணியை முடி" : "Confirm — stop duty"}
          </button>
          <div className="vz-meta">{lang === "ta" ? "இறுதி கிலோமீட்டர் கட்டாயம்." : "Closing kilometers are required to stop duty."}</div>
        </Sheet>
      )}

      {capture && (
        <CaptureSheet ctx={capture} pics={pics} lang={lang} onPhoto={savePic} onClose={() => setCapture(null)}
          onSave={(pr) => {
            put("proofs", pr); setCapture(null);
            setToast("Photo saved with GPS stamp");
            const dataUrl = pics[pr.photoId];
            const ord = pr.orderId ? orderOf(pr.orderId) : null;
            apiPost("proofs.php", {
              id: pr.id, at: pr.at, kind: pr.kind,
              vehicle_id: pr.vehicleId, vehicle_plate: (vehOf(pr.vehicleId) || {}).plate || "",
              driver_name: pr.driverName || "", order_id: pr.orderId || "",
              vendor_name: (ord && vendorOf(ord.vendorId) || {}).name || "",
              lat: pr.lat, lng: pr.lng, place: pr.place || "", note: pr.note || "",
              photo_data: dataUrl || "",
            }).then(res => { if (res && res.photo_url) put("proofs", { ...pr, photoUrl: res.photo_url }); });
            if (db.settings.autoProofToVendor) setTimeout(() => sendProof({ ...pr, auto: true }, "vendor"), 250);
          }} />
      )}

      {send && <SendSheet payload={send} onClose={() => setSend(null)} onSent={(ch) => { send.onSent(ch); setSend(null); }} />}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<VibeCRM />);
</script>
</body>
</html>
