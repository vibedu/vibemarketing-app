      <div className="vz-eyebrow">Ageing</div>
      {AGE_BUCKETS.map(b => (
        <div className="vz-kv" key={b.k} style={{ background:"#fff", padding:"10px 13px", border:"1px solid var(--line)", borderRadius:10, marginBottom:6 }}>
          <span style={{ color: b.k === "b90p" ? "#B4262A" : "var(--ink)" }}>{b.label}</span>
          <b className="vz-money">{inr(r.buckets[b.k])}</b>

      <div className="vz-mode" style={{ margin:"12px auto", width:"fit-content" }}>

        <button data-on={view === "invoice" ? "1" : "0"} onClick={() => setView("invoice")}>By invoice</button>

              </div>

          {g.v && (g.v.phone || g.v.email) && (
            <button className="vz-chip c-green" style={{ marginTop:9 }} onClick={() => onSend(g)}>Send statement</button>
          )}

      ))}

      {view === "invoice" && r.rows.map(x => (
        <button className="vz-card vz-tapcard" key={x.o.id + ":" + x.bill.id} onClick={() => onOpenOrder(x.o.id)}>
          <div className="vz-row">
            <div style={{ minWidth:0 }}>
              <div className="vz-title">{x.bill.invNo ? "#" + x.bill.invNo : x.o.no} · {x.v ? x.v.name : "—"}</div>
              <div className="vz-meta">{x.o.title || "—"} · due {dmy(x.dueOn)}

              <div className="vz-meta">

            <div style={{ textAlign:"right" }}>

            </div>
          </div>
        </button>
      ))}
    </Sheet>
  );

/* ---------------------------- forecast ----------------------------
   What is expected in and what is committed out, month by month. Nothing here
   is a projection of business we hope to win — only campaigns already on the
   books, wages the fleet is already earning and tax already charged. */
function ForecastSheet({ db, paidOn, onClose }) {
  const r = receivables(db, paidOn);
  const months = [];
  for (let i = 0; i < 4; i++) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + i);
    months.push(d.getFullYear() + "-" + pad2(d.getMonth() + 1));
  }

  /* Wages are the fleet's own run-rate: what the last four weeks actually cost,
     carried forward. Quoting the rate card instead would forecast a fleet that
     never has a van in the workshop. */
  const curWeek = weekEnding(today());
  let weeks = 0, wageSum = 0;
  /* Start at the week in progress, not the one before it. A fleet that has only
     just started recording duty had every completed week empty, so the forecast
     showed a payroll of nothing at all. */
  for (let i = 0; i <= 4; i++) {
    const w = addDays(curWeek, -7 * i), { start } = weekRange(w);
    const recs = (db.attendance || []).filter(a => String(a.date || "") >= start && String(a.date || "") <= w);
    if (!recs.length) continue;
    weeks++;
    wageSum += (db.drivers || []).reduce((s, d) => {
      const mine = recs.filter(a => a.driverId === d.id);
      return s + mine.length * (+d.wage || 0) + mine.filter(a => a.outstation).length * (+d.batta || 0);
    }, 0);
  }
  const weeklyWages = weeks ? Math.round(wageSum / weeks) : 0;
  const staffWeekly = (db.staff || []).filter(s => s.active !== false).reduce((s, x) => s + (+x.weeklyWage || 0), 0);
  const monthlyPayroll = Math.round((weeklyWages + staffWeekly) * 52 / 12);

  /* Running costs carried forward the same way: the average of whatever the
     last three months actually cost. Months with nothing recorded are left out
     rather than averaged in as zero, which would halve the figure. */
  let mCount = 0, mSum = 0;
  for (let i = 0; i <= 3; i++) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    const mo = d.getFullYear() + "-" + pad2(d.getMonth() + 1);
    const spent = expenseTotal(expensesIn(db, mo));
    if (spent > 0) { mCount++; mSum += spent; }
  }
  const monthlyExpenses = mCount ? Math.round(mSum / mCount) : 0;
  const anyExpense = (db.expenses || []).length > 0;

  const rows = months.map(mo => {
    // Money in: the balance on every invoice whose due date falls in the month.
    // Anything already overdue is expected this month — it is owed now.
    const collect = r.rows.filter(x => {
      const m2 = String(x.dueOn).slice(0, 7);
      return mo === months[0] ? m2 <= mo : m2 === mo;
    }).reduce((s, x) => s + x.due, 0);

    // GST charged on invoices raised in the previous month is payable on the
    // 20th of this one. It is not our money and it leaves on a fixed date.
    const prev = (() => { const d = new Date(mo + "-01T12:00:00Z"); d.setUTCMonth(d.getUTCMonth() - 1); return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1); })();
    const outTax = (db.orders || []).flatMap(o => billsOf(o, (db.vendors || []).find(x => x.id === o.vendorId)))
      .filter(b => String(b.date || "").slice(0, 7) === prev)
      .reduce((s, b) => s + (+b.gst || 0), 0);
    const credited = (db.creditNotes || []).filter(c => String(c.date || "").slice(0, 7) === prev)
      .reduce((s, c) => s + (+c.gst || 0), 0);
    const gstOut = Math.max(0, outTax - credited - inputGstIn(db, prev));

    // Straight off the vehicle records, not the alert list: alerts only reach
    // 30 days ahead, and a forecast that stops at 30 days is not a forecast.
    let renewals = 0;
    (db.vehicles || []).forEach(v => DOCS.forEach(doc => {
      if (String(v[doc.k] || "").slice(0, 7) === mo) renewals++;
    }));

    return { mo, collect, gstOut, payroll: monthlyPayroll, expenses: monthlyExpenses, renewals,
             net: collect - gstOut - monthlyPayroll - monthlyExpenses };
  });

  let running = 0;
  return (
    <Sheet title="Forecast" onClose={onClose}>
      <div className="vz-meta" style={{ marginTop:0, marginBottom:10 }}>
        Built only from campaigns already invoiced and wages already being paid — no guessed business.
      </div>

      <div className="vz-grid" style={{ marginBottom:6 }}>
        <div className="vz-stat"><i>Due to come in</i><b style={{ fontSize:17 }}>{inr(r.total)}</b><small>{r.rows.length} invoices</small></div>
        <div className="vz-stat"><i>Payroll a month</i><b style={{ fontSize:17 }}>{inr(monthlyPayroll)}</b><small>{weeks ? "from " + weeks + " week" + (weeks === 1 ? "" : "s") + " of duty" : "no attendance yet"}</small></div>
        <div className="vz-stat"><i>Running costs</i><b style={{ fontSize:17 }}>{inr(monthlyExpenses)}</b><small>{mCount ? "average of " + mCount + " month" + (mCount === 1 ? "" : "s") : "nothing recorded"}</small></div>
      </div>
      {!anyExpense && (
        <div className="vz-card" style={{ background:"#FFF9E6", borderColor:"#F5DFA0" }}>
          <div className="vz-meta" style={{ marginTop:0, color:"#8A6100" }}>
            No expenses have been recorded, so this forecast counts only wages and GST going out.
            Diesel, flex, tolls and EMIs are missing — record them and these figures become real.
          </div>
        </div>
      )}

      {rows.map(x => {
        running += x.net;
        return (
          <div className="vz-card" key={x.mo}>
            <div className="vz-row">
              <div>
                <div className="vz-title">{monthLabel(x.mo)}</div>
                <div className="vz-meta">{x.mo === months[0] ? "this month, including everything overdue" : "on the agreed due dates"}</div>
              </div>
              <b className="vz-money" style={{ color: x.net >= 0 ? "#178951" : "#E5484D" }}>{inr(x.net)}</b>
            </div>
            <div className="vz-kv"><span>Collections expected</span><b className="vz-money" style={{ color:"#178951" }}>{inr(x.collect)}</b></div>
            <div className="vz-kv"><span>Payroll (drivers + staff)</span><b className="vz-money">− {inr(x.payroll)}</b></div>
            <div className="vz-kv"><span>Running costs (diesel, flex, tolls…)</span><b className="vz-money">− {inr(x.expenses)}</b></div>
            <div className="vz-kv"><span>GST payable on the 20th</span><b className="vz-money">− {inr(x.gstOut)}</b></div>
            <div className="vz-kv"><span>Running position</span><b className="vz-money" style={{ color: running >= 0 ? "#178951" : "#E5484D" }}>{inr(running)}</b></div>
            {x.renewals > 0 && <div className="vz-meta" style={{ color:"#8A6100" }}>
              {x.renewals} vehicle document{x.renewals === 1 ? "" : "s"} fall due this month — insurance and FC are not in the figures above.
            </div>}
          </div>
        );
      })}

      <div className="vz-meta">
        Workshop spend is not forecast: it happens when it happens. Keep a month of payroll aside for it.
      </div>
    </Sheet>
  );
}

/* ---------------------------- campaign P&L ----------------------------
   What each campaign actually made, once the wages of the vans that carried it
   are counted against it. A campaign that quoted well and ran on six vans for
   two months is not the same campaign at the end of the month. */
function CampaignPnlSheet({ db, vendorOf, onOpenOrder, onClose }) {
  const [only, setOnly] = useState("all");         // all | running | done
  const list = (db.orders || [])
    .filter(o => only === "all" || (only === "running" ? (o.stage === "Running" || o.stage === "Advance paid") : o.stage === "Completed"))
    .map(o => ({ o, v: vendorOf(o.vendorId), p: campaignPnl(db, o) }))
    .sort((a, b) => (a.p.margin - b.p.margin));     // worst first: those are the ones to look at

  const tot = list.reduce((t, x) => ({
    revenue: t.revenue + x.p.revenue, cost: t.cost + x.p.cost, margin: t.margin + x.p.margin,
    wages: t.wages + x.p.wages + x.p.battas,
  }), { revenue:0, cost:0, margin:0, wages:0 });

  const exportCsv = () => {
    const rows = [["Campaign", "Customer", "Period", "Vans", "Duty days", "Revenue (excl GST)",
                   "Driver wages", "Batta", "Production", "Running costs", "Workshop", "Total cost", "Margin", "Margin %"]];
    list.forEach(({ o, v, p }) => rows.push([
      o.title || o.no, v ? v.name : "", (o.start || "") + " to " + (o.end || ""), (o.vehicleIds || []).length,
      p.dutyDays, p.revenue, p.wages, p.battas, p.production, p.running, p.workshop, p.cost, p.margin,
      p.revenue > 0 ? Math.round((p.margin / p.revenue) * 100) + "%" : "",
    ]));
    downloadCsv("campaign-pnl-" + today() + ".csv", rows);
  };

  return (
    <Sheet title="What each campaign made" onClose={onClose}>
      <div className="vz-meta" style={{ marginTop:0 }}>
        Driver wages are taken from the days these vans were actually on duty inside the campaign
        period. A van carrying two brands on one day splits that day's wage between them.
      </div>

      <div className="vz-grid" style={{ marginBottom:6 }}>
        <div className="vz-stat"><i>Revenue (excl GST)</i><b style={{ fontSize:17 }}>{inr(tot.revenue)}</b><small>{list.length} campaigns</small></div>
        <div className="vz-stat"><i>Margin</i><b style={{ fontSize:17, color: tot.margin >= 0 ? "#178951" : "#E5484D" }}>{inr(tot.margin)}</b><small>after wages &amp; production</small></div>
      </div>

      <div className="vz-mode" style={{ margin:"10px auto", width:"fit-content" }}>
        {[["all", "All"], ["running", "Running"], ["done", "Completed"]].map(([k, lbl]) =>
          <button key={k} data-on={only === k ? "1" : "0"} onClick={() => setOnly(k)}>{lbl}</button>)}
      </div>
      <button className="vz-btn alt" style={{ marginTop:0 }} disabled={!list.length} onClick={exportCsv}>Export</button>

      {list.length === 0 && <div className="vz-card"><div className="vz-meta">No campaigns in this view.</div></div>}
      {list.map(({ o, v, p }) => {
        const pct = p.revenue > 0 ? Math.round((p.margin / p.revenue) * 100) : 0;
        return (
          <div className="vz-card" key={o.id}>
            <div className="vz-row">
              <button className="vz-tapcard" style={{ flex:1 }} onClick={() => onOpenOrder(o.id)}>
                <div className="vz-title">{o.title || o.no}</div>
                <div className="vz-meta">{v ? v.name : "—"} · {(o.vehicleIds || []).length} van(s) · {p.dutyDays} duty days</div>
              </button>
              <div style={{ textAlign:"right" }}>
                <div className="vz-money" style={{ color: p.margin >= 0 ? "#178951" : "#E5484D" }}>{inr(p.margin)}</div>
                <Chip c={pct >= 40 ? "c-green" : pct >= 15 ? "c-yellow" : "c-red"}>{pct}%</Chip>
              </div>
            </div>
            <div className="vz-kv"><span>Revenue excluding GST</span><b className="vz-money">{inr(p.revenue)}</b></div>
            <div className="vz-kv"><span>Driver wages{p.battas > 0 ? " + batta" : ""}</span><b className="vz-money">− {inr(p.wages + p.battas)}</b></div>
            {p.production > 0 && <div className="vz-kv"><span>Flex &amp; fabrication</span><b className="vz-money">− {inr(p.production)}</b></div>}
            {p.running > 0 && <div className="vz-kv"><span>Diesel &amp; running</span><b className="vz-money">− {inr(p.running)}</b></div>}
            {p.workshop > 0 && <div className="vz-kv"><span>Workshop while running</span><b className="vz-money">− {inr(p.workshop)}</b></div>}
            {p.dutyDays === 0 && (o.vehicleIds || []).length > 0 && (
              <div className="vz-meta" style={{ color:"#8A6100" }}>
                No duty was recorded for these vans in this period — the wage cost here is not real yet.
              </div>
            )}
          </div>
        );
      })}
    </Sheet>
  );
}

/* ---------------------------- attendance ----------------------------
   The office records duty for the drivers on basic phones: they call the
   reading in and it is entered here. Everything the driver flow enforces is
   enforced here too — the checks live in officePunchIn / officePunchOut. */
function OfficePunchIn({ db, vehOf, onPunchIn }) {
  const [f, set] = useState({ driverId:"", vehicleId:"", openKm:"" });
  const onDuty = (db.attendance || []).filter(a => !a.outAt);
  const busyVeh = new Set(onDuty.map(a => a.vehicleId));
  const busyDrv = new Set(onDuty.map(a => a.driverId));
  const free = db.drivers.filter(d => !busyDrv.has(d.id));
  const drv = db.drivers.find(d => d.id === f.driverId);
  // Suggest the van this driver is assigned to, and warn if it is already out.
  const assigned = drv ? db.vehicles.find(v => v.driverId === drv.id) : null;
  const veh = vehOf(f.vehicleId);
  const last = veh ? (db.attendance || []).filter(a => a.vehicleId === veh.id && (a.closeKm != null || a.openKm != null))
    .sort((a, b) => (String(a.inAt) < String(b.inAt) ? 1 : -1))[0] : null;
  const lastKm = last ? (last.closeKm != null ? last.closeKm : last.openKm) : null;
  const ready = f.driverId && f.vehicleId && String(f.openKm).trim() !== "";
  return (
    <div className="vz-card" style={{ background:"#F7FAFF", borderColor:"#CFE0FA" }}>
      <div className="vz-eyebrow" style={{ marginTop:0 }}>Start a driver's duty from the office</div>
      <div className="vz-meta" style={{ marginTop:0, marginBottom:10 }}>
        For drivers without a smartphone — take the opening reading over the phone and enter it here.
      </div>
      {free.length === 0 && <div className="vz-meta">Every driver is already on duty.</div>}
      {free.length > 0 && (
        <>
          <F label="Driver">
            <select value={f.driverId} onChange={e => {
              const id = e.target.value;
              const a = db.vehicles.find(v => v.driverId === id);
              set({ ...f, driverId:id, vehicleId: a && !busyVeh.has(a.id) ? a.id : "" });
            }}>
              <option value="">— choose the driver —</option>
              {free.map(d => <option key={d.id} value={d.id}>{d.name} · {d.phone}</option>)}
            </select>
          </F>
          <F label="Vehicle">
            <select value={f.vehicleId} onChange={e => set({ ...f, vehicleId: e.target.value })}>
              <option value="">— choose the vehicle —</option>
              {db.vehicles.map(v => (
                <option key={v.id} value={v.id} disabled={busyVeh.has(v.id)}>
                  {v.plate}{busyVeh.has(v.id) ? " — already out" : ""}
                </option>
              ))}
            </select>
          </F>
          {assigned && f.vehicleId && assigned.id !== f.vehicleId && (
            <div className="vz-meta" style={{ color:"#8A6100", marginTop:-4 }}>
              {drv.name} is normally on {assigned.plate} — this will be recorded as a substitute run.
            </div>
          )}
          <F label={"Opening kilometres" + (lastKm != null ? " — last recorded " + lastKm : "")}>
            <input value={f.openKm} inputMode="numeric" placeholder={lastKm != null ? String(lastKm) : "odometer reading"}
              onChange={e => set({ ...f, openKm: e.target.value.replace(/\D/g, "").slice(0, 8) })}
              style={{ fontFamily:"var(--mono)", fontSize:19 }} />
          </F>
          <button className="vz-btn go" style={{ margin:0 }} disabled={!ready}
            onClick={() => { if (onPunchIn(f)) set({ driverId:"", vehicleId:"", openKm:"" }); }}>
            Start duty
          </button>
        </>
      )}
    </div>
  );
}

/* Cash handed to a driver ahead of his wage. It is recovered from the coming
   weeks automatically, so nobody has to remember it on a Saturday. */
function AdvanceForm({ driver, db, onSave, onDelete, onClose }) {
  const [f, set] = useState({ date: today(), amount:"", note:"" });
  const mine = (db.advances || []).filter(a => a.driverId === driver.id).sort((a, b) => (a.date < b.date ? 1 : -1));
  const owed = advanceOwed(db, driver.id, weekEnding(today()));
  return (
    <Sheet title={"Advance · " + driver.name} onClose={onClose}>
      <div className="vz-stat" style={{ marginBottom:10 }}>
        <i>Still to recover</i><b style={{ fontSize:18 }}>{inr(owed)}</b>
        <small>comes off the coming weeks' wages</small>
      </div>
      <div className="vz-2">
        <F label="Amount ₹"><input type="number" value={f.amount} onChange={e => set({ ...f, amount: e.target.value })} inputMode="numeric" /></F>
        <F label="Given on"><input type="date" value={f.date} onChange={e => set({ ...f, date: e.target.value })} /></F>
      </div>
      <F label="What for (optional)"><input value={f.note} onChange={e => set({ ...f, note: e.target.value })} placeholder="hospital, school fees…" /></F>
      <button className="vz-btn" disabled={!(+f.amount > 0)}
        onClick={() => onSave({ id: uid(), driverId: driver.id, date: f.date, amount: +f.amount, note: f.note.trim() })}>
        Record advance
      </button>
      {mine.length > 0 && <div className="vz-eyebrow">Advances given</div>}
      {mine.map(a => (
        <div className="vz-kv" key={a.id} style={{ background:"#fff", padding:"11px 13px", border:"1px solid var(--line)", borderRadius:10, marginBottom:6 }}>
          <span>{dmy(a.date)}{a.note ? " · " + a.note : ""}</span>
          <span style={{ display:"flex", alignItems:"center", gap:8 }}>
            <b className="vz-money">{inr(a.amount)}</b>
            <button className="vz-chip c-red" onClick={() => { if (window.confirm("Delete this advance? The wages already worked out will change.")) onDelete(a.id); }}>Delete</button>
          </span>
        </div>
      ))}
      <div className="vz-meta">
        Recovery is capped at what he earned that week, so an advance never leaves a man with nothing.
      </div>
    </Sheet>
  );
}

function AttendanceSheet({ db, vehOf, drvOf, perm, onPunchIn, onPunchOut, onEditStaff, onOutstation, onAdvance, onPayWeek, onPayslip, onClose }) {
  const [closing, setClosing] = useState(null);   // {id, km} while ending a duty
  const [openRow, setOpenRow] = useState("");     // driver whose week is expanded
  // Payroll runs Sunday to Saturday and is keyed by the Saturday it is paid
  // on — "the week ending 16 Aug" is what means something here, not a month.
  const [weekEnd, setWeekEnd] = useState(weekEnding(today()));
  const { start: weekStart } = weekRange(weekEnd);
  const inWeek = (d) => d >= weekStart && d <= weekEnd;

  const weekRecs = (db.attendance || []).filter(a => inWeek(String(a.date || "")));
  const driverRows = db.drivers.map(d => {
    const w = driverWeek(db, d, weekStart, weekEnd);
    return { id: d.id, kind: "driver", name: d.name, w, rec: d,
      sub: w.days + " day" + (w.days === 1 ? "" : "s") + " × " + inr(d.wage)
        + (w.batta > 0 ? " + batta " + inr(w.batta) : "")
        + (w.advance > 0 ? " − advance " + inr(w.advance) : ""),
      pay: w.net };
  });
  // A fixed weekly wage, paid whether or not there was work that week — but
  // not before the person joined, and not once turned inactive.
  const staffRows = (db.staff || [])
    .filter(s => s.active !== false && (!s.joined || s.joined <= weekEnd))
    .map(s => ({ id: s.id, kind: "staff", name: s.name,
      sub: "weekly" + (s.role ? " · " + s.role : ""), pay: +s.weeklyWage || 0, rec: s }));
  const rows = [...driverRows, ...staffRows].sort((a, b) => b.pay - a.pay);
  const driverBill = driverRows.reduce((s, r) => s + r.pay, 0);
  const staffBill = staffRows.reduce((s, r) => s + r.pay, 0);
  const bill = driverBill + staffBill;
  // A week that has been paid says so, and says when. Without this a settled
  // week and one nobody has touched looked exactly alike on a Monday morning.
  const payrun = (db.payruns || []).find(p => p.weekEnd === weekEnd);
  // Weeks recorded before payroll had a release step carry no status, only a
  // paid date. They were paid, and must not reappear as waiting for approval.
  const wasPaid = !!payrun && (payrun.status === "paid" || (!payrun.status && !!payrun.paidOn));

  const weeks = [];
  for (let i = 0; i < 10; i++) {
    const d = new Date(weekEnding(today()) + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - 7 * i);
    weeks.push(localDay(d));
  }

  const log = (db.attendance || []).filter(a => a.date === today());
  return (
    <Sheet title="Attendance & payroll" onClose={onClose}>
      <div className="vz-grid" style={{ marginBottom:4 }}>
        <div className="vz-stat"><i>Present today</i><b>{log.length}<small style={{ fontSize:13 }}> / {db.drivers.length}</small></b><small>signed in with a vehicle</small></div>
        <div className="vz-stat"><i>Payroll, week ending {dmy(weekEnd)}</i><b style={{ fontSize:18 }}>{inr(bill)}</b><small>drivers {inr(driverBill)} · staff {inr(staffBill)}</small></div>
      </div>

      <OfficePunchIn db={db} vehOf={vehOf} onPunchIn={onPunchIn} />

      <div className="vz-eyebrow">Today — who drove what</div>
      {log.length === 0 && <div className="vz-card"><div className="vz-meta">Nobody has signed in yet today.</div></div>}
      {log.map(a => {
        const d = drvOf(a.driverId), v = vehOf(a.vehicleId);
        return (
          <div className="vz-card" key={a.id}>
            <div className="vz-row">
              <div>
                <div className="vz-title">{a.driverName || (d ? d.name : "—")}</div>
                <div className="vz-meta" style={{ fontFamily:"var(--mono)" }}>{a.vehiclePlate || (v ? v.plate : "—")}</div>
                <div className="vz-meta">In {clock(a.inAt)}{a.outAt ? " · Out " + clock(a.outAt) : ""}{a.autoClosed ? " · auto" : ""}</div>
                <div className="vz-meta">KM {a.openKm != null ? a.openKm : "—"} → {a.closeKm != null ? a.closeKm : "—"}{(a.openKm != null && a.closeKm != null) ? "  (" + (a.closeKm - a.openKm) + " km)" : ""}</div>
                {/* selfieUrl is the server's column name; it now holds the
                    odometer photo taken at punch-in. */}
                {a.selfieUrl && (
                  <img className="vz-thumb sm" src={a.selfieUrl} alt="odometer at punch-in"
                    style={{ width:96, height:72, objectFit:"cover", borderRadius:8, marginTop:6, cursor:"zoom-in" }}
                    onClick={() => viewImage(a.selfieUrl, "Odometer · " + (a.driverName || "") + " · " + clock(a.inAt))} />
                )}
                {(a.lat != null && a.lng != null) && (
                  <a className="vz-meta" style={{ color:"#2C6FD1", display:"block" }} href={mapLink(a.lat, a.lng)} target="_blank" rel="noreferrer">Open punch-in location</a>
                )}
              </div>
              <div style={{ textAlign:"right" }}>
                <Chip c={a.outAt ? "c-grey" : "c-green"}>{a.outAt ? "Done" : "On duty"}</Chip>
                {a.via === "office" && <div className="vz-meta" style={{ marginTop:4 }}>by office</div>}
              </div>
            </div>
            {!a.outAt && (closing && closing.id === a.id ? (
              <div style={{ marginTop:10 }}>
                <F label={"Closing kilometres — opened at " + (a.openKm != null ? a.openKm : "—")}>
                  <input value={closing.km} inputMode="numeric" autoFocus placeholder="odometer reading"
                    onChange={e => setClosing({ id:a.id, km: e.target.value.replace(/\D/g, "").slice(0, 8) })}
                    style={{ fontFamily:"var(--mono)", fontSize:19 }} />
                </F>
                <div className="vz-2">
                  <button className="vz-btn alt" style={{ margin:0 }} onClick={() => setClosing(null)}>Cancel</button>
                  <button className="vz-btn go" style={{ margin:0 }} disabled={closing.km === ""}
                    onClick={() => { if (onPunchOut(a, closing.km)) setClosing(null); }}>End duty</button>
                </div>
              </div>
            ) : (
              <button className="vz-btn alt" style={{ marginBottom:0 }} onClick={() => setClosing({ id:a.id, km:"" })}>
                End duty for {a.driverName || "this driver"}
              </button>
            ))}
          </div>
        );
      })}

      <div className="vz-eyebrow">Payroll</div>
      <F label="Week ending (Saturday)">
        <select value={weekEnd} onChange={e => setWeekEnd(e.target.value)}>
          {weeks.map(w => <option key={w} value={w}>{weekLabel(w)}{w === weekEnding(today()) ? " — current" : ""}</option>)}
        </select>
      </F>
      {rows.length === 0 && <div className="vz-card"><div className="vz-meta">No drivers or staff to pay yet.</div></div>}
      {rows.map(r => {
        const row = (
          <>
            <span style={{ color:"var(--ink)", fontWeight:600 }}>
              {r.name}
              {r.kind === "staff" && <Chip c="c-blue"> staff</Chip>}
              <br /><small style={{ color:"var(--muted)", fontWeight:400 }}>{r.sub}</small>
            </span>
            <b className="vz-money">{inr(r.pay)}</b>
          </>
        );
        if (r.kind === "staff") {
          return perm.money
            ? <button className="vz-kv vz-tapcard" key={r.id} style={{ background:"#fff", padding:"11px 13px", border:"1px solid var(--line)", borderRadius:10, marginBottom:6, width:"100%", textAlign:"left" }}
                onClick={() => onEditStaff(r.rec)}>{row}</button>
            : <div className="vz-kv" key={r.id} style={{ background:"#fff", padding:"11px 13px", border:"1px solid var(--line)", borderRadius:10, marginBottom:6 }}>{row}</div>;
        }
        /* A driver's week opens up: every day he was out, with the outstation
           tick that earns him his batta, and what he has taken in advance. The
           tick has to live here — the day is only known to be outstation once
           the van is back. */
        const open = openRow === r.id;
        return (
          <div key={r.id} style={{ background:"#fff", border:"1px solid var(--line)", borderRadius:10, marginBottom:6 }}>
            <button className="vz-kv vz-tapcard" style={{ padding:"11px 13px", width:"100%", textAlign:"left", background:"transparent", border:0 }}
              onClick={() => setOpenRow(open ? "" : r.id)}>{row}</button>
            {open && (
              <div style={{ padding:"0 13px 12px" }}>
                {r.w.records.length === 0 && <div className="vz-meta">No duty recorded this week.</div>}
                {r.w.records.slice().sort((a, b) => (a.date < b.date ? -1 : 1)).map(a => (
                  <div className="vz-kv" key={a.id}>
                    <span>{dmy(a.date)} · {a.vehiclePlate || (vehOf(a.vehicleId) || {}).plate || "—"}
                      {(a.openKm != null && a.closeKm != null) ? "  " + (a.closeKm - a.openKm) + " km" : ""}</span>
                    {perm.money
                      ? <button className={"vz-chip " + (a.outstation ? "c-green" : "c-grey")} onClick={() => onOutstation(a, !a.outstation)}>
                          {a.outstation ? "Outstation ✓" : "Outstation"}
                        </button>
                      : (a.outstation ? <Chip c="c-green">Outstation</Chip> : <span className="vz-meta">Local</span>)}
                  </div>
                ))}
                <div className="vz-kv"><span>Wage · {r.w.days} day(s)</span><b className="vz-money">{inr(r.w.wage)}</b></div>
                {(+r.rec.batta || 0) > 0 && <div className="vz-kv"><span>Batta · {r.w.outDays} outstation day(s)</span><b className="vz-money">{inr(r.w.batta)}</b></div>}
                {r.w.advance > 0 && <div className="vz-kv"><span>Advance recovered</span><b className="vz-money" style={{ color:"#B4262A" }}>− {inr(r.w.advance)}</b></div>}
                {r.w.owed > r.w.advance && <div className="vz-meta" style={{ color:"#8A6100" }}>
                  {inr(r.w.owed - r.w.advance)} of advance still to recover after this week.
                </div>}

/* ---------------------------- app ---------------------------- */
function VibeCRM() {
  const [db, setDb] = useState(blankData);
  const [pics, setPics] = useState({});
  /* The director has complete rights. The finance team, who sit elsewhere and
     file the GST returns, see the commercial side only — no field work, no
     fleet, and they cannot add or remove office logins. */
  const me = (db.users || []).find(u => u.id === db.userId) || null;
  const perm = ROLES[db.adminRole] || ROLES["Director"];
  const mode = db.role || "";
  const setMode = (v) => setDb(d => ({ ...d, role: v }));
  const [gate, setGate] = useState({ step:"choose", userId:"", name:"", pin:"", pin2:"" });
  const [tab, setTab] = useState("home");
  const [sheet, setSheet] = useState(null);
  const [send, setSend] = useState(null);
  const [capture, setCapture] = useState(null);
  const [fleetView, setFleetView] = useState("vehicles");
  // Finance Dashboard's period picker. Money() is called as a plain function,
  // not mounted as its own component, so this has to live up here rather
  // than as local state inside it.
  const [dashPeriod, setDashPeriod] = useState("today");
  const [dashCustom, setDashCustom] = useState({ from: today(), to: today() });
  const [pickVeh, setPickVeh] = useState("");
  const [fieldVeh, setFieldVeh] = useState("");
  const [q, setQ] = useState("");
  const [openOrder, setOpenOrder] = useState(null);
  const [openProof, setOpenProof] = useState(null);
  const [login, setLogin] = useState({ vehicleId:"", driverId:"", driverName:"", pin:"", openKm:"", shotId:"", shotLat:null, shotLng:null, shotAcc:null });
  const [verified, setVerified] = useState(null);
  const [closing, setClosing] = useState(false);
  const [closeKm, setCloseKm] = useState("");
  const [snapping, setSnapping] = useState(false);
  const [toast, setToast] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [full, setFull] = useState(false);
  const [locked, setLocked] = useState(false);   // admin session is locked until the PIN is re-entered
  const [lockPin, setLockPin] = useState("");
  const [adminCfg, setAdminCfg] = useState(null); // { configured, setup_enabled } from the server
  const [rzpStatus, setRzpStatus] = useState(null); // Razorpay setup state (booleans only)

  useEffect(() => {
    (async () => {
      try { const r = await window.storage.get(KEY_DATA); const base = (r && r.value) ? JSON.parse(r.value) : blankData(); setDb(stampForSync(seedOccasionsIfEmpty(seedInvoiceDefaults(seedFleetIfEmpty(base)))));
        setAdminToken(base && base.adminToken ? base.adminToken : "");
        // If an admin was left signed in, lock the app on open so the PIN is required again.
        if (base && base.role === "manager" && base.userId && (base.users || []).some(u => u.id === base.userId && u.pin)) setLocked(true);
      } catch (e) {}
      try { const r = await window.storage.get(KEY_PICS); if (r && r.value) setPics(JSON.parse(r.value)); } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  // Auto-lock the admin after idle time, and whenever the app returns to the foreground after a short absence.
  useEffect(() => {
    if (mode !== "manager" || !me || !me.pin) return;
    let lastActive = Date.now();
    const IDLE = 5 * 60 * 1000;   // 5 minutes idle
    const AWAY = 60 * 1000;       // re-lock if backgrounded for over a minute
    const doLock = () => { setLocked(true); setSheet(null); setSend(null); setInvAsk(null); setOpenOrder(null); setOpenProof(null); };
    const bump = () => { lastActive = Date.now(); };
    const check = () => { if (Date.now() - lastActive > IDLE) doLock(); };
    const onVis = () => { if (document.visibilityState === "visible" && Date.now() - lastActive > AWAY) doLock(); };
    const iv = setInterval(check, 30000);
    window.addEventListener("pointerdown", bump);
    window.addEventListener("keydown", bump);
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(iv); window.removeEventListener("pointerdown", bump); window.removeEventListener("keydown", bump); document.removeEventListener("visibilitychange", onVis); };
  }, [mode, me]);
  useEffect(() => { if (loaded) (async () => { try { await window.storage.set(KEY_DATA, JSON.stringify(db)); } catch (e) {} })(); }, [db, loaded]);

  // Keep the sender identity used by every outgoing message in step with Settings.
  useEffect(() => { if (loaded) setContact(db.settings || {}); }, [loaded, db.settings]);

  /* ---- office record sync -------------------------------------------------
     Vendors, campaigns, payments and vehicles used to live only in this
     device's storage, so losing the phone lost the business. They are now
     mirrored to the server: anything changed since the last sync is pushed,
     anything newer on the server is pulled, and whichever copy was edited last
     wins. Deletes travel as tombstones so a removed record stays removed. */
  const [syncState, setSyncState] = useState({ at: "", busy: false, error: "" });
  const syncingRef = useRef(false);
  const dbRef = useRef(db);
  useEffect(() => { dbRef.current = db; });   // always the latest data, for the timer

  const runSync = async (opts) => {
    const quiet = opts && opts.quiet;
    // Read through a ref, never the closed-over db: the background timer holds
    // one runSync from when it was created, so reading db directly meant it kept
    // uploading whatever the data looked like at login and silently ignored
    // everything added since.
    const cur = dbRef.current;
    if (syncingRef.current || !cur.adminToken || !navigator.onLine) return;
    syncingRef.current = true;
    if (!quiet) setSyncState(s => ({ ...s, busy: true, error: "" }));
    try {
      const since = cur.lastSync || "";           // server clock — drives the pull
      // What to PUSH is measured against this device's own clock. Comparing our
      // timestamps to the server's would silently drop changes whenever the two
      // clocks disagree, which is exactly how a delete went missing in testing.
      const pushedUpTo = cur.lastPush || "";
      const pushMark = new Date().toISOString();

      // 1. push everything edited since our last push, plus tombstones
      const push = [];
      Object.keys(SYNC_KEYS).forEach(key => {
        (cur[key] || []).forEach(r => {
          if (!r || !r.id) return;
          if (pushedUpTo && r.updatedAt && r.updatedAt <= pushedUpTo) return;   // unchanged
          const { fromServer, ...clean } = r;
          push.push({ kind: SYNC_KEYS[key], id: r.id, updatedAt: r.updatedAt || pushMark, data: clean });
        });
      });
      // Always re-send tombstones, not just new ones. If a delete failed to apply
      // server-side it would otherwise never be retried. They are few and tiny.
      (cur.tombstones || []).forEach(t => {
        push.push({ kind: SYNC_KEYS[t.key], id: t.id, updatedAt: t.updatedAt, deleted: true, data: {} });
      });
      if (push.length) {
        const pr = await apiPost("sync.php", { records: push });
        if (!pr || !pr.ok) throw new Error((pr && pr.error) || "could not send changes");
      }

      // 2. pull anything the server has that we haven't seen
      const res = await apiGet("sync.php" + (since ? "?since=" + encodeURIComponent(since) : ""));
      if (!res || !res.ok) throw new Error((res && res.error) || "could not fetch changes");

      setDb(d => {
        const next = { ...d };
        (res.records || []).forEach(r => {
          const key = SYNC_KEY_OF[r.kind];
          if (!key) return;
          const list = next[key] || [];
          const mine = list.find(x => x.id === r.id);
          // Only let the server overwrite a record we haven't edited more recently.
          if (mine && mine.updatedAt && r.updatedAt && mine.updatedAt > r.updatedAt) return;
          // Never resurrect something we deleted. If the server still shows it as
          // alive our tombstone simply hasn't landed yet, and re-adding it here is
          // what made deleted customers and campaigns reappear on every refresh.
          if (!r.deleted) {
            const tomb = (d.tombstones || []).find(t => t.key === key && t.id === r.id);
            if (tomb && (!r.updatedAt || tomb.updatedAt >= r.updatedAt)) return;
          }
          if (r.deleted) {
            next[key] = list.filter(x => x.id !== r.id);
          } else {
            const rec = { ...r.data, id: r.id, updatedAt: r.updatedAt };
            next[key] = mine ? list.map(x => (x.id === r.id ? rec : x)) : [rec, ...list];
          }
        });
        // Tombstones the server has taken no longer need repeating (measured on
        // our own clock, for the same reason as the push filter above).
        // Keep tombstones rather than dropping them the moment they're pushed: a
        // push the server didn't apply used to leave nothing behind, so the record
        // returned on the next pull and could never be deleted again. They are
        // small, re-sent harmlessly, and expire after 30 days.
        const cutoff = new Date(Date.now() - 30 * 24 * 3600 * 1000).toISOString();
        next.tombstones = (d.tombstones || []).filter(t => t.updatedAt > cutoff);
        next.lastSync = res.now || d.lastSync;
        next.lastPush = pushMark;
        return next;
      });
      setSyncState({ at: new Date().toISOString(), busy: false, error: "" });
    } catch (e) {
      setSyncState(s => ({ ...s, busy: false, error: String(e.message || e) }));
    }

  };

          const byId = {}; (next.attendance || []).forEach(a => { byId[a.id] = a; });

            id: r.id, date: r.date, vehicleId: r.vehicle_id, vehiclePlate: r.vehicle_plate || "", driverName: r.driver_name,
            inAt: srvISO(r.in_at), outAt: srvISO(r.out_at), lat: r.lat != null ? +r.lat : null,

          const roster = next.drivers || [];

          next = { ...next, attendance: Object.values(byId) };
        }
        return next;

    pull();
    const t = setInterval(pull, 15000);

      text: "Hello " + (v ? (v.person || v.name) : "") + ",\n\n" +
            kind + " for " + o.title + " (" + o.no + ").\n" +
            "Amount: " + inr(amt) + "\n\nPay securely here:\n" + res.url +
            "\n\nThank you!\n" + signOff(),
      onSent: (ch) => { logSend(o, "Payment link", ch); setToast("Payment link sent · " + ch); },
    });
  };
  const sendReceipt = (o, p) => {
    const v = vendorOf(o.vendorId), m = orderMath(o);
    setSend({
      title: "Auto-send receipt", auto: true, to: v ? v.name : "—", phone: v?.phone, email: v?.email,
      subject: "Payment received — " + o.no, text: receiptText(o, v, p, paidOn(o.id) + p.amount, m),
      onSent: (ch) => { logSend(o, "Receipt", ch); setToast("Receipt sent · " + ch); },
    });
  };
  const lang = db.settings.driverLang || "en";
  const setLang = (v) => setSetting("driverLang", v);

  // Step 1: verify a registered driver (name + PIN). On success we move to the opening-km step.
  const verifyDriver = async () => {
    const veh = vehOf(login.vehicleId);
    const name = (login.driverName || "").trim();
    const pin = (login.pin || "").replace(/\D/g, "");
    if (!veh || !name || pin.length < 4) return;

    const res = await apiPost("driver_login.php", { name, pin });
    let driver = res && res.ok && res.driver ? { id: res.driver.id, name: res.driver.name, photoUrl: res.driver.photo_url || "" } : null;
    if (!driver) {
      const d0 = (db.drivers || []).find(x =>
        String(x.name || "").trim().toLowerCase() === name.toLowerCase() &&
        (String(x.pin || "").trim() || String(x.phone || "").replace(/\D/g, "").slice(-4)) === pin);
      if (d0) driver = { id: d0.id, name: d0.name, photoUrl: pics[d0.photoId] || d0.photoUrl || "" };
    }
    if (!driver) {
      setToast(lang === "ta" ? "பெயர் அல்லது கடவுச்சொல் பொருந்தவில்லை" : "Name or PIN doesn't match a registered driver");
      return;
    }
    setVerified(driver);
  };

  /* Step 2a: photograph the odometer, with a GPS + time stamp burned in.
     This was a punch-in selfie. Identifying a driver by his face proved
     unreliable in the field, and the name and PIN already say who he is —
     what nobody can otherwise check is the reading he typed. */
  const shotRef = useRef(null);
  const grabOdometer = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (e.target) e.target.value = "";
    if (!file) return;
    setSnapping(true);
    const veh = vehOf(login.vehicleId);
    const fix = await getFix();
    const stamp = [
      (verified && verified.name ? verified.name : (login.driverName || "Driver")) + (veh ? " · " + veh.plate : ""),
      new Date().toLocaleString(),
      fix.ok ? ("GPS " + fix.lat + ", " + fix.lng + " (±" + fix.acc + "m)") : "GPS unavailable",
    ];
    try {
      const dataUrl = await processShot(file, stamp);
      const id = "self_" + uid();
      savePic(id, dataUrl);
      setLogin(l => ({ ...l, shotId: id, shotLat: fix.ok ? fix.lat : null, shotLng: fix.ok ? fix.lng : null, shotAcc: fix.ok ? fix.acc : null }));
    } catch (err) {
      setToast(lang === "ta" ? "படத்தை படிக்க முடியவில்லை, மீண்டும் முயற்சிக்கவும்" : "Couldn't read that photo — try again");
    }
    setSnapping(false);
  };

  // Step 2b: opening kilometres entered -> start the shift.
  const beginDuty = async () => {
    const veh = vehOf(login.vehicleId);
    const driver = verified;
    const openKm = (login.openKm || "").replace(/\D/g, "");
    if (!veh || !driver || openKm === "") return;
    if (!login.shotId || !pics[login.shotId]) { setToast(lang === "ta" ? "முதலில் மீட்டர் புகைப்படம் எடுக்கவும்" : "Please photograph the odometer first"); return; }
    // One vehicle, one driver: a van already signed out can't be taken by someone else.
    const busy = (db.attendance || []).find(a => a.vehicleId === veh.id && !a.outAt && a.driverId !== driver.id);
    if (busy) {
      setToast(lang === "ta"
        ? veh.plate + " ஏற்கனவே " + (busy.driverName || "another driver") + " பயன்படுத்துகிறார்"
        : veh.plate + " is already signed out by " + (busy.driverName || "another driver"));
      return;
    }
    // Sanity-check the odometer: opening km should not be below the vehicle's last recorded reading.
    const last = (db.attendance || []).filter(a => a.vehicleId === veh.id && (a.closeKm != null || a.openKm != null))
      .sort((a, b) => (String(a.inAt) < String(b.inAt) ? 1 : -1))[0];
    const lastKm = last ? (last.closeKm != null ? last.closeKm : last.openKm) : null;
    if (lastKm != null && +openKm < lastKm) {
      setToast((lang === "ta" ? "ஆரம்ப KM " : "Opening km ") + openKm + (lang === "ta" ? " கடந்த பதிவு " : " is below the last reading ") + lastKm + " — " + (lang === "ta" ? "மீட்டரை சரிபார்க்கவும்" : "check the odometer"));
      return;
    }
    // selfie_data / selfie_url are the attendance table's column names — they
    // carry the odometer photo now, and renaming them would need a migration.
    const odometer = pics[login.shotId] || "";
    const rec = { id: uid(), driverId: driver.id || "", driverName: driver.name, driverPhoto: driver.photoUrl || "", vehicleId: veh.id, date: today(),
      inAt: new Date().toISOString(), outAt: "", substitute: false, openKm: +openKm, closeKm: null,
      lat: login.shotLat != null ? login.shotLat : null, lng: login.shotLng != null ? login.shotLng : null,
      shotId: login.shotId, selfieUrl: "" };
    setDb(d => ({ ...d, attendance: [rec, ...(d.attendance || [])], session: rec.id }));
    queuePost("attendance.php", { id: rec.id, date: rec.date, vehicle_id: veh.id, vehicle_plate: veh.plate,
      driver_name: driver.name, in_at: rec.inAt, out_at: "", lat: rec.lat, lng: rec.lng, open_km: +openKm, selfie_data: odometer })
      .then(res => { if (res && res.selfie_url) setDb(d => ({ ...d, attendance: (d.attendance || []).map(a => a.id === rec.id ? { ...a, selfieUrl: res.selfie_url } : a) })); });
    setLogin({ vehicleId:"", driverId:"", driverName:"", pin:"", openKm:"", shotId:"", shotLat:null, shotLng:null, shotAcc:null });
    setVerified(null);
    setToast(tr(lang, "dutyStarted") + " · " + veh.plate);
  };

  // End duty opens a closing-km prompt; confirmEndDuty records it.
  const endDuty = () => { setCloseKm(""); setClosing(true); };
  const confirmEndDuty = () => {
    const km = (closeKm || "").replace(/\D/g, "");
    if (km === "") return;
    const cur = (db.attendance || []).find(a => a.id === db.session);
    if (cur && cur.openKm != null && +km < cur.openKm) {
      setToast(lang === "ta"
        ? "இறுதி KM ஆரம்ப KM (" + cur.openKm + ") ஐ விட குறைவாக இருக்க முடியாது"
        : "Closing km can't be less than the opening reading (" + cur.openKm + ")");
      return;
    }
    const out = new Date().toISOString();
    const rec = (db.attendance || []).find(a => a.id === db.session);
    setDb(d => ({ ...d,
      attendance: (d.attendance || []).map(a => a.id === d.session ? { ...a, outAt: out, closeKm: +km } : a),
      session: "" }));
    if (rec) queuePost("attendance.php", { id: rec.id, date: rec.date, vehicle_id: rec.vehicleId,
      vehicle_plate: (vehOf(rec.vehicleId) || {}).plate || "", driver_name: rec.driverName || "",
      in_at: rec.inAt, out_at: out, lat: rec.lat, lng: rec.lng, open_km: rec.openKm, close_km: +km });
    setClosing(false); setCloseKm("");
    setToast(tr(lang, "dutyEnded"));
  };

  /* Office-side attendance. Most drivers carry basic phones, so day to day
     the office records duty over a call: no odometer photo, no GPS — the
     record says so (via:"office") rather than pretending. The same rules as
     the driver flow still hold: one van one driver, one driver one van, and
     the odometer can't run backwards. */
  const officePunchIn = ({ driverId, vehicleId, openKm }) => {
    const veh = vehOf(vehicleId), drv = drvOf(driverId);
    const km = String(openKm || "").replace(/\D/g, "");
    if (!veh || !drv || km === "") { setToast("Pick the driver, the vehicle and the opening km"); return false; }
    const busy = (db.attendance || []).find(a => a.vehicleId === veh.id && !a.outAt && a.driverId !== drv.id);
    if (busy) { setToast(veh.plate + " is already signed out by " + (busy.driverName || "another driver")); return false; }
    const dbl = (db.attendance || []).find(a => a.driverId === drv.id && !a.outAt);
    if (dbl) { setToast(drv.name + " is already on duty with " + ((vehOf(dbl.vehicleId) || {}).plate || "another vehicle")); return false; }
    const last = (db.attendance || []).filter(a => a.vehicleId === veh.id && (a.closeKm != null || a.openKm != null))
      .sort((a, b) => (String(a.inAt) < String(b.inAt) ? 1 : -1))[0];
    const lastKm = last ? (last.closeKm != null ? last.closeKm : last.openKm) : null;
    if (lastKm != null && +km < lastKm) { setToast("Opening km " + km + " is below the last reading " + lastKm + " — check with the driver"); return false; }
    const rec = { id: uid(), driverId: drv.id, driverName: drv.name, driverPhoto: drv.photoUrl || "",
      vehicleId: veh.id, date: today(), inAt: new Date().toISOString(), outAt: "", substitute: false,
      openKm: +km, closeKm: null, lat: null, lng: null, shotId: "", selfieUrl: "", via: "office" };
    setDb(d => ({ ...d, attendance: [rec, ...(d.attendance || [])] }));
    queuePost("attendance.php", { id: rec.id, date: rec.date, vehicle_id: veh.id, vehicle_plate: veh.plate,
      driver_name: drv.name, in_at: rec.inAt, out_at: "", lat: null, lng: null, open_km: +km, selfie_data: "" });
    setToast("Duty started · " + drv.name + " · " + veh.plate);
    return true;
  };

  const officePunchOut = (a, closeKm) => {
    const km = String(closeKm || "").replace(/\D/g, "");
    if (km === "") { setToast("Enter the closing km"); return false; }
    if (a.openKm != null && +km < a.openKm) { setToast("Closing km can't be less than the opening reading (" + a.openKm + ")"); return false; }
    const out = new Date().toISOString();
    setDb(d => ({ ...d,
      attendance: (d.attendance || []).map(x => x.id === a.id ? { ...x, outAt: out, closeKm: +km } : x),
      session: d.session === a.id ? "" : d.session }));
    queuePost("attendance.php", { id: a.id, date: a.date, vehicle_id: a.vehicleId,
      vehicle_plate: (vehOf(a.vehicleId) || {}).plate || "", driver_name: a.driverName || "",
      in_at: a.inAt, out_at: out, lat: a.lat, lng: a.lng, open_km: a.openKm, close_km: +km });
    setToast("Duty ended · " + (a.driverName || ""));
    return true;
  };

  const importRef = useRef(null);

  const exportBackup = (withPhotos) => {
    const payload = { app:"vibe-marketing", version:2, exportedAt:new Date().toISOString(),
      data: db, photos: withPhotos ? pics : {} };
    const text = JSON.stringify(payload);
    const stamp = today().replace(/-/g, "");
    try {
      const blob = new Blob([text], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "vibe-backup-" + stamp + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      setToast("Backup saved to your downloads");
    } catch (e) { setToast("Could not save the backup here"); }
  };

  const importBackup = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || parsed.app !== "vibe-marketing" || !parsed.data) throw new Error("bad file");
        if (!window.confirm("Replace everything on this phone with the backup from " + dmy(parsed.exportedAt) + "?")) return;
        setDb({ ...blankData(), ...parsed.data });
        if (parsed.photos) setPics(parsed.photos);
        setSheet(null);
        setToast("Backup restored");
      } catch (err) { setToast("That file is not a Vibe backup"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const askNotify = async (want) => {
    if (!want) { setSetting("browserAlerts", false); return; }
    try {
      if (!("Notification" in window)) { setToast("This browser cannot show notifications"); return; }
      const perm = await Notification.requestPermission();
      if (perm === "granted") { setSetting("browserAlerts", true); setToast("Notifications on"); }
      else setToast("Blocked — allow notifications in browser settings");
    } catch (e) { setToast("Notifications not available here"); }
  };

  const doRenew = (a, f) => {
    const veh = vehOf(a.vehId);
    if (!veh) return;
    put("vehicles", { ...veh, [a.doc.k]: f.newDue });
    setDb(d => ({ ...d, renewals: [{ id: uid(), vehicleId: a.vehId, docType: a.doc.label, oldDue: a.due,
      newDue: f.newDue, date: f.date, cost: f.cost, vendor: f.vendor, note: f.note }, ...(d.renewals || [])] }));
    if (f.cost > 0) put("jobs", { id: uid(), vehicleId: a.vehId, type: a.doc.label + " renewal", date: f.date,
      cost: f.cost, vendor: f.vendor, note: [f.note, f.painting ? "painting done" : "", f.tinkering ? "tinkering done" : ""].filter(Boolean).join(", "), done: true });
    setDb(d => { const sn = { ...(d.snoozes || {}) }; delete sn[a.key]; return { ...d, snoozes: sn }; });
    setSheet(null);
    setToast(veh.plate + " " + a.doc.label + " valid to " + dmy(f.newDue));
  };

  const remindRenewal = (a) => {
    const list = a ? [a] : stats.alerts;
    if (!list.length) { setToast("Nothing due right now"); return; }
    setSend({
      title: a ? "Renewal reminder" : "Renewals digest", to: "Manager",
      phone: db.settings.managerPhone, email: db.settings.managerEmail,
      subject: "Vehicle papers due for renewal", text: digestText(list),
      onSent: (ch) => setToast("Renewal list sent · " + ch),
    });
    setSheet(null);
  };

  const snoozeAlert = (a) => {
    setDb(d => ({ ...d, snoozes: { ...(d.snoozes || {}), [a.key]: addDays(today(), 7) } }));
    setToast(a.plate + " " + a.doc.label + " snoozed 7 days");
  };

  const sendProof = (pr, who) => {
    const o = orderOf(pr.orderId), v = o ? vendorOf(o.vendorId) : null;
    const veh = vehOf(pr.vehicleId), drv = drvOf(pr.driverId);
    const toVendor = who === "vendor";
    setSend({
      title: toVendor ? "Send proof to customer" : "Send proof to manager", auto: !!pr.auto,
      to: toVendor ? (v ? v.name : "vendor") : "Manager",
      phone: toVendor ? v?.phone : db.settings.managerPhone,
      email: toVendor ? v?.email : db.settings.managerEmail,
      subject: "Campaign proof — " + (o ? o.title : ""), text: proofText(pr, o, v, veh, drv),
      photo: pics[pr.photoId],
      onSent: (ch) => {
        put("proofs", { ...pr, sentVendor: pr.sentVendor || toVendor, sentManager: pr.sentManager || !toVendor });
        setToast("Proof shared · " + ch);
      },
    });
  };

  // Record that a customer reminder was sent so it drops off the "due" list.
  const markReminded = (key) => setDb(d => {
    const log = { ...(d.reminderLog || {}), [key]: today() };
    // Keep the log from growing forever — anything older than two years has
    // served its purpose and is only consuming the device's storage budget.
    const cutoff = String(new Date().getFullYear() - 2);
    Object.keys(log).forEach(k => { if (String(log[k]).slice(0, 4) < cutoff) delete log[k]; });
    return { ...d, reminderLog: log };
  });

  // Open the send sheet for one customer reminder (festival, service, or welcome).
  const sendCustomerReminder = (item) => {
    const v = item.vendor;
    let text, subject, title;
    if (item.kind === "occasion") {
      text = occasionMsg(v, item.occ, item.daysLeft); subject = occasionSubject(item.occ);
      title = item.occ.name + " reminder — " + (v.name || firstName(v));
    } else if (item.kind === "welcome") {
      text = welcomeMsg(v); subject = welcomeSubject(); title = "Welcome message — " + (v.name || firstName(v));
    } else {
      text = serviceMsg(v); subject = "Mobile van branding by Vibe Marketing 🚚"; title = "Service reminder — " + (v.name || firstName(v));
    }
    setSend({
      title, to: v.name || firstName(v), phone: v.phone, email: v.email, subject, text,
      onSent: (ch) => { markReminded(item.key); setToast("Reminder sent · " + ch); },
    });
  };

  /* A statement of account: every invoice of theirs still open, what is overdue,
     and the total. Sent the same way as everything else — WhatsApp or email,
     with the message written and the customer's own terms quoted back. */
  const sendStatement = (g) => {
    const v = g.v;
    const lines = g.rows.map(x =>
      "• " + (x.bill.invNo ? "Invoice #" + x.bill.invNo : x.o.no) + " — " + inr(x.due)
      + " (due " + dmy(x.dueOn) + (x.daysLeft < 0 ? ", " + -x.daysLeft + " days over" : "") + ")");
    const text = ["*VIBE MARKETING* — statement of account", "",
      "Dear " + (v.person || v.name) + ",", "",
      "Our records show the following outstanding against your campaigns:", "",
      ...lines, "",
      "*Total outstanding: " + inr(g.due) + "*",
      creditDaysOf(v) > 0 ? "Agreed credit period: " + creditDaysOf(v) + " days from invoice date." : "",
      "", "If any of this has already been paid, please share the reference and we will update our books.",
      "", "Thank you for your business.", "— " + (db.settings.company || "Vibe Marketing")].filter(l => l !== "").join("\n");
    setSend({
      title: "Statement — " + v.name, to: v.name, phone: v.phone, email: v.email,
      subject: "Statement of account — " + inr(g.due) + " outstanding",
      text,
      onSent: (ch) => setToast("Statement sent · " + ch),
    });
  };

  /* The one message that exists because the rule is strict: the vehicles do
     not run on an unpaid advance, and do not stay out past the midpoint on an
     unpaid balance. Sent straight from the payment-alert card. */
  const sendPaymentReminder = (a) => {
    const v = a.v;
    const isAdvance = a.milestone === "advance";
    const text = ["*VIBE MARKETING*", "",
      "Dear " + (v ? (v.person || v.name) : "customer") + ",", "",
      isAdvance
        ? (a.days < 0
            ? "Your campaign “" + (a.o.title || a.o.no) + "” began on " + dmy(a.dueOn) + ", and the advance is still pending."
            : "Your campaign “" + (a.o.title || a.o.no) + "” is scheduled to begin on " + dmy(a.dueOn) + ".")
        : "Your campaign “" + (a.o.title || a.o.no) + "” has reached its midpoint, and the balance is due.",
      "As agreed, " + inr(a.expected) + " is payable " + (isAdvance ? "before the vehicles go out" : "by this point") + ".",
      a.collected > 0 ? "We have received " + inr(a.collected) + " so far." : "",
      "*Amount pending: " + inr(a.short) + "*", "",
      "Please share the payment so the campaign can " + (isAdvance ? "begin as scheduled" : "continue without interruption") + ".",
      "", "Thank you.", "— " + (db.settings.company || "Vibe Marketing")].filter(l => l !== "").join("\n");
    setSend({
      title: "Payment reminder — " + (v ? v.name : "customer"), to: v ? v.name : "customer",
      phone: v && v.phone, email: v && v.email,
      subject: "Payment pending — " + (a.o.title || a.o.no) + " — " + inr(a.short),
      text,
      onSent: (ch) => setToast("Reminder sent · " + ch),
    });
  };

  /* Putting money on a card is money leaving the business, so a recharge is two
     things at once: the card's balance goes up, and diesel spend goes on the
     books against that van. Correcting a balance moves neither — it only tells
     us what the pump already knows. */
  const rechargeCard = (card, t) => {
    put("fuelTxns", t);
    put("fuelCards", { ...card, balance: t.balance, balanceAt: t.date });
    if (t.type === "recharge" && t.amount > 0) {
      const veh = vehOf(card.vehicleId);
      put("expenses", {
        id: uid(), date: t.date, cat: "Diesel", amount: t.amount, gstPaid: 0,
        vehicleId: card.vehicleId, orderId: "", mode: "Bank transfer",
        note: "Petrol card recharge" + (veh ? " · " + veh.plate : "") + (card.number ? " · " + card.number : ""),
        fromCard: card.id,
      });
      setToast("Recharged " + inr(t.amount) + " — also recorded as diesel");
    } else {
      setToast("Balance updated");
    }
  };

  /* Payroll actually leaving the bank. The week is stored as it stood the day
     it was paid — attendance corrected afterwards must not rewrite history. */
  const payWeek = (weekEnd, rows, total, step) => {
    const who = db.adminName || "office";
    if (step === "release") {
      if (!window.confirm("Release the week ending " + dmy(weekEnd) + " for payment — " + inr(total) + "?")) return;
      put("payruns", {
        id: "pr_" + weekEnd, weekEnd, status: "released", total,
        initiatedBy: who, initiatedOn: today(), mode: "Cash",
        // The week is frozen as it stood when it was released — that is what
        // was approved, and it is what finance pays.
        lines: rows.map(r => r.kind === "driver"
          ? { id: r.id, name: r.name, kind: "driver", days: r.w.days, outDays: r.w.outDays,
              wage: r.w.wage, batta: r.w.batta, advance: r.w.advance, net: r.w.net }
          : { id: r.id, name: r.name, kind: "staff", net: r.pay }),
      });
      setToast("Released for payment · " + inr(total));
      return;
    }
    const cur = (db.payruns || []).find(p => p.weekEnd === weekEnd);
    if (!cur) { setToast("This week has not been released for payment yet"); return; }
    if (!window.confirm("Record " + inr(cur.total) + " as paid for the week ending " + dmy(weekEnd) + "?")) return;
    put("payruns", { ...cur, status: "paid", paidOn: today(), paidBy: who });
    setToast("Week ending " + dmy(weekEnd) + " marked paid");
  };

  /* What a driver is handed, in the language he reads. He cannot see the app's
     payroll screen, so this is the only account he gets of his own week. */
  const sendPayslip = (drv, w, weekEnd) => {
    const ta = (db.settings.driverLang || "en") === "ta";
    const { start } = weekRange(weekEnd);

  const openInvoice = (o) => setInvAsk({ order: o, km: o.outKm ? String(o.outKm) : "" });

  /* Number the invoice only now, so backing out of the question above doesn't
     burn an invoice number, then build the same two-page PDF as the quotation. */
  const raiseInvoice = (o, km) => {
    const v = vendorOf(o.vendorId);
    // Re-read the customer at the moment of invoicing: their state and credit
    // terms may have been corrected since the campaign was first raised.
    let ord = { ...o, outKm: km || 0, igst: isInterstate(v, db.settings) };

    /* Billed month by month: each raise takes the next unbilled slice and gives
       it its own number, period and due date. The flex and fabrication ride on
       the first bill, the outstation running on the last. */
    if (billingOf(ord, v) === "monthly") {
      const slice = nextSlice(ord, v);
      if (!slice) { setToast("Every month of this campaign has already been invoiced"); setInvAsk(null); return; }
      const n = db.settings.nextInvNo || 1;
      const t = cnMath(ord, slice.sub);
      const part = { id: uid(), invNo: n, date: today(), days: slice.days,
                     dueDate: creditDaysOf(v) > 0 ? addDays(today(), creditDaysOf(v)) : slice.to,
                     from: slice.from, to: slice.to, first: slice.first, last: slice.last,
                     sub: t.sub, gst: t.gst, cgst: t.cgst, sgst: t.sgst, igst: t.igst, inter: t.inter, total: t.total };
      ord = { ...ord, parts: [...(ord.parts || []), part] };
      setSetting("nextInvNo", n + 1);
      put("orders", ord);
      setInvAsk(null);
      // The PDF prints this slice, not the whole campaign.
      openDoc({ ...ord, invNo: part.invNo, invDate: part.date, dueDate: part.dueDate,
                start: part.from, end: part.to, dayWise: true, days: part.days,
                fabrication: part.first ? ord.fabrication : 0, flex: part.first ? ord.flex : 0,
                outKm: part.last ? (km || 0) : 0 }, "TAX INVOICE");
      return;
    }

    if (!ord.invNo) {
      const n = db.settings.nextInvNo || 1;
      ord = { ...ord, invNo: n, invDate: today() };
      ord = { ...ord, dueDate: creditDaysOf(v) > 0 ? addDays(ord.invDate, creditDaysOf(v)) : (ord.end || ord.invDate) };
      setSetting("nextInvNo", n + 1);
