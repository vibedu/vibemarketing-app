/* ---------------------------- GST register ----------------------------
   What the finance team needs to file a return: every tax invoice raised in a
   period, with its taxable value and tax split out, and the same figures as a
   file their accountant can open. The app is the only place these invoices
   exist, so this is the record — it is built from the same orderMath the
   invoice itself was printed from, never from figures typed again. */
const csvCell = (v) => {
  const s = String(v == null ? "" : v);
  /* A leading =, + or @ is treated as a formula by Excel and has to be quoted
     out. A leading minus does too — unless the cell is simply a negative
     number, which it usually is here. Guarding those as well turned every
     credit note and deduction into text the accountant could not add up. */
  const isNumber = /^-?\d+(\.\d+)?$/.test(s);
  const safe = (!isNumber && /^[=+\-@]/.test(s)) ? "'" + s : s;
  return /[",\n]/.test(safe) ? '"' + safe.replace(/"/g, '""') + '"' : safe;
};
const downloadCsv = (name, rows) => {
  // BOM so Excel opens the rupee sign and Tamil names correctly.
  const body = "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([body], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 20000);
};

const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monthLabel = (ym) => {
  const p = String(ym).split("-");
  return MONTH_NAMES[(+p[1] || 1) - 1] + " " + p[0];
};

/* Salary week: Sunday to Saturday, paid on the Saturday. Weeks are keyed by
   their Saturday's date, since that is the day that actually means something
   to whoever is running payroll — "the week ending 16 Aug", not an ISO week
   number nobody uses. Built from UTC noon throughout so a day never slips
   across midnight from a timezone offset. */
const weekEnding = (dateStr) => {
  const d = new Date((dateStr || today()) + "T12:00:00Z");
  const untilSat = 6 - d.getUTCDay();                 // 0 (Sun) .. 6 (Sat) -> 6 .. 0
  d.setUTCDate(d.getUTCDate() + untilSat);
  return localDay(d);
};
const weekRange = (satStr) => {
  const sat = new Date(satStr + "T12:00:00Z");
  const sun = new Date(sat); sun.setUTCDate(sat.getUTCDate() - 6);
  return { start: localDay(sun), end: satStr };
};
const weekLabel = (satStr) => {
  const { start } = weekRange(satStr);
  const s = new Date(start + "T12:00:00Z"), e = new Date(satStr + "T12:00:00Z");
  const sameMonth = s.getUTCMonth() === e.getUTCMonth();
  const sd = String(s.getUTCDate()).padStart(2, "0"), ed = String(e.getUTCDate()).padStart(2, "0");
  return sameMonth
    ? sd + "–" + ed + " " + MONTH_NAMES[e.getUTCMonth()] + " " + e.getUTCFullYear()
    : sd + " " + MONTH_NAMES[s.getUTCMonth()] + " – " + ed + " " + MONTH_NAMES[e.getUTCMonth()] + " " + e.getUTCFullYear();
};

/* ---------------------------- credit notes ----------------------------
   A numbered tax invoice cannot be deleted — not in law and not here. When a
   campaign is cut short, a rate was wrong or the customer disputes, the invoice
   stands and a credit note is raised against it. It carries its own number
   series, reduces what the customer owes, and reverses the tax that was
   charged so the month's GST comes out right. */
const cnMath = (order, taxable) => {
  const sub = Math.max(0, Math.round(+taxable || 0));
  const gst = order && order.gst ? Math.round(sub * 0.18) : 0;
  const inter = !!(order && order.igst);
  const cgst = inter ? 0 : Math.floor(gst / 2);
  const sgst = inter ? 0 : gst - cgst;
  return { sub, gst, cgst, sgst, igst: inter ? gst : 0, inter, total: sub + gst };
};
const notesFor = (db, orderId) => (db.creditNotes || []).filter(c => c.orderId === orderId);
const creditedOn = (db, orderId) => notesFor(db, orderId).reduce((s, c) => s + (+c.total || 0), 0);

/* ---------------------------- money out ----------------------------
   Everything that leaves the business other than wages: what it was, what it
   was for, and the GST paid on it — that tax is input credit and comes off
   what we hand over on the 20th. */
const EXPENSE_CATS = ["Diesel", "Flex printing", "Fabrication", "Tolls & parking", "Permit & RTO",
                      "Insurance", "Vehicle EMI", "Rent", "Office & phone", "Other"];
const expensesIn = (db, month) => (db.expenses || []).filter(e => String(e.date || "").slice(0, 7) === month);
const expenseTotal = (list) => list.reduce((s, e) => s + (+e.amount || 0), 0);
const inputGstIn = (db, month) => expensesIn(db, month).reduce((s, e) => s + (+e.gstPaid || 0), 0);

/* ---------------------------- fuel cards ----------------------------
   One prepaid card per van. The balance is not something the app can work out
   on its own — the pump knows it, the card's SMS knows it — so it is carried on
   the card and moved by two things only: a recharge puts money on, and reading
   today's balance off the card corrects it. Checking the cards is the first
   thing done every morning, so this screen is built to be read in one look. */
const LOW_FUEL_DEFAULT = 1000;
const cardBalance = (card) => Math.round(+((card || {}).balance) || 0);
const cardLow = (card, settings) => cardBalance(card) < (+((settings || {}).fuelLow) || LOW_FUEL_DEFAULT);
const lastRecharge = (db, cardId) => (db.fuelTxns || [])
  .filter(t => t.cardId === cardId && t.type === "recharge")
  .sort((a, b) => (a.date < b.date ? 1 : -1))[0] || null;
const cardChecked = (card) => (card && card.balanceAt) || "";
/* Cards worth acting on first: empty ones, then the ones nobody has looked at. */
const cardsToWatch = (db) => (db.fuelCards || [])
  .filter(c => c.active !== false)
  .sort((a, b) => cardBalance(a) - cardBalance(b));

/* ---------------------------- follow-ups ----------------------------
   Chasing money is a conversation, not a list. What was said and when to ring
   again is the part that was living in her head. */
const FOLLOWUP_OUTCOMES = [
  { k:"promised", label:"Promised to pay", chip:"c-green" },
  { k:"noanswer", label:"No answer",       chip:"c-grey"  },
  { k:"partial",  label:"Will pay part",   chip:"c-yellow" },
  { k:"dispute",  label:"Disputes it",     chip:"c-red"   },
  { k:"note",     label:"Just a note",     chip:"c-blue"  },
];
const followupsFor = (db, orderId) => (db.followups || [])
  .filter(f => f.orderId === orderId)
  .sort((a, b) => (a.date < b.date ? 1 : -1));
const lastFollowup = (db, orderId) => followupsFor(db, orderId)[0] || null;
/* Everything whose next call has come due — the morning's list. */
const followupsDue = (db) => {
  const seen = {};
  (db.followups || []).forEach(f => {
    if (!f.nextOn) return;
    const cur = seen[f.orderId];
    if (!cur || cur.date < f.date) seen[f.orderId] = f;
  });
  return Object.values(seen).filter(f => f.nextOn <= today());
};

/* ---------------------------- the day book ----------------------------
   What she would otherwise type into Tally, made once here. Every invoice,
   credit note, receipt, expense and payroll run already in the app becomes a
   voucher with its two sides and its ledger names; anything that happened
   outside the app is added by hand. Each one is ticked off when it is in the
   books, so nothing is entered twice and nothing is missed. */
const LEDGERS = {
  sales:  "Sales — Mobile Van Advertising",
  cgst:   "Output CGST",
  sgst:   "Output SGST",
  igst:   "Output IGST",
  inCgst: "Input CGST",
  inSgst: "Input SGST",
  inIgst: "Input IGST",
  tds:    "TDS Receivable",
  wages:  "Wages & Batta",
  cash:   "Cash",
  bank:   "Bank",
};
const modeLedger = (mode) => /cash/i.test(String(mode || "")) ? LEDGERS.cash : LEDGERS.bank;

/* One voucher: a type, a date, a party, and the lines that must balance. */
const dayBook = (db, month) => {
  const out = [];
  const vendorName = (id) => ((db.vendors || []).find(v => v.id === id) || {}).name || "Unknown customer";
  const inMonth = (d) => String(d || "").slice(0, 7) === month;

  // Sales — one per numbered invoice, part-billed campaigns included.
  (db.orders || []).forEach(o => {
    const v = (db.vendors || []).find(x => x.id === o.vendorId);
    billsOf(o, v).forEach(b => {
      if (!inMonth(b.date)) return;
      const party = vendorName(o.vendorId);
      const lines = [{ dr: party, amount: b.total }, { cr: LEDGERS.sales, amount: b.sub }];
      if (b.igst > 0) lines.push({ cr: LEDGERS.igst, amount: b.igst });
      if (b.cgst > 0) lines.push({ cr: LEDGERS.cgst, amount: b.cgst });
      if (b.sgst > 0) lines.push({ cr: LEDGERS.sgst, amount: b.sgst });
      out.push({ id: "sal_" + o.id + "_" + b.id, date: b.date, type: "Sales", ref: "#" + b.invNo,
                 party, narration: o.title || o.no, amount: b.total, lines });
    });
  });

  // Credit notes — the sales entry, reversed.
  (db.creditNotes || []).forEach(c => {
    if (!inMonth(c.date)) return;
    const o = (db.orders || []).find(x => x.id === c.orderId) || {};
    const party = vendorName(o.vendorId);
    const lines = [{ dr: LEDGERS.sales, amount: c.sub }];
    if (c.igst > 0) lines.push({ dr: LEDGERS.igst, amount: c.igst });
    if (c.cgst > 0) lines.push({ dr: LEDGERS.cgst, amount: c.cgst });
    if (c.sgst > 0) lines.push({ dr: LEDGERS.sgst, amount: c.sgst });
    lines.push({ cr: party, amount: c.total });
    out.push({ id: "cn_" + c.id, date: c.date, type: "Credit Note", ref: c.no,
               party, narration: c.reason || "", amount: c.total, lines });
  });

  // Receipts — money in, with the TDS the customer kept back sitting beside it.
  (db.payments || []).forEach(p => {
    if (!inMonth(p.date)) return;
    const o = (db.orders || []).find(x => x.id === p.orderId) || {};
    const party = vendorName(o.vendorId);
    const cash = +p.amount || 0, tds = +p.tds || 0;
    const lines = [{ dr: modeLedger(p.mode), amount: cash }];
    if (tds > 0) lines.push({ dr: LEDGERS.tds, amount: tds });
    lines.push({ cr: party, amount: cash + tds });
    out.push({ id: "rcp_" + p.id, date: p.date, type: "Receipt", ref: p.ref || p.mode || "",
               party, narration: (o.title || "") + (tds > 0 ? " · TDS " + inr(tds) : ""), amount: cash + tds, lines });
  });

  // Payments — every expense, with its input GST split out where there is one.
  (db.expenses || []).forEach(e => {
    if (!inMonth(e.date)) return;
    const gst = +e.gstPaid || 0, amt = +e.amount || 0;
    const lines = [{ dr: e.cat || "Other expenses", amount: amt - gst }];
    if (gst > 0) lines.push({ dr: LEDGERS.inCgst + " / " + LEDGERS.inSgst, amount: gst });
    lines.push({ cr: modeLedger(e.mode), amount: amt });
    out.push({ id: "exp_" + e.id, date: e.date, type: "Payment", ref: e.mode || "",
               party: e.cat || "Other", narration: e.note || "", amount: amt, lines });
  });

  // Payroll — one voucher for the week that went out.
  (db.payruns || []).forEach(p => {
    if (!p.paidOn || !inMonth(p.paidOn)) return;
    out.push({ id: "pay_" + p.id, date: p.paidOn, type: "Payment", ref: "Week ending " + dmy(p.weekEnd),
               party: LEDGERS.wages, narration: p.lines.length + " people",
               amount: p.total, lines: [{ dr: LEDGERS.wages, amount: p.total }, { cr: modeLedger(p.mode), amount: p.total }] });
  });

  // Anything that happened outside the app and was entered by hand.
  (db.vouchers || []).forEach(v => {
    if (!inMonth(v.date)) return;
    out.push({ id: "man_" + v.id, date: v.date, type: v.type || "Journal", ref: v.ref || "",
               party: v.dr, narration: v.narration || "", amount: +v.amount || 0, manual: true,
               lines: [{ dr: v.dr, amount: +v.amount || 0 }, { cr: v.cr, amount: +v.amount || 0 }] });
  });

  return out.sort((a, b) => (a.date === b.date ? a.type.localeCompare(b.type) : (a.date < b.date ? -1 : 1)));
};

/* ---------------------------- part-billing ----------------------------
   Some customers are billed month by month while the campaign runs, some once
   at the end. Both end up as numbered tax invoices; the monthly ones live in
   `parts` so each carries its own period, number and due date.

   billsOf() is the one list every money screen reads, so a campaign billed in
   three slices and one billed whole are counted the same way. */
const billsOf = (o, v) => {
  if (o && (o.parts || []).length) return o.parts.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  if (o && o.invNo) {
    const m = orderMath(o);
    return [{ id: "whole", invNo: o.invNo, date: o.invDate || o.created, dueDate: dueDateOf(o, v),
              from: o.start || "", to: o.end || "", sub: m.sub, gst: m.gst, cgst: m.cgst, sgst: m.sgst,
              igst: m.igst, inter: m.inter, total: m.total, whole: true }];
  }
  return [];
};
const billedTotal = (o, v) => billsOf(o, v).reduce((s, b) => s + (+b.total || 0), 0);
/* How a campaign is billed: its own setting, falling back to the customer's. */
const billingOf = (o, v) => (o && o.billing) || (v && v.billing) || "end";

/* The next unbilled slice of a monthly campaign: from the day after the last
   billed period to the end of that calendar month, clipped to the campaign. */
const nextSlice = (o, v) => {
  const bills = billsOf(o, v);
  // effectiveWindow gives a day-wise campaign a real end too, so monthly
  // billing on one actually reaches a last slice instead of asking forever.
  const win = effectiveWindow(o);
  const start = bills.length ? addDays(bills[bills.length - 1].to, 1) : win.start;
  if (start > win.end) return null;                               // fully billed
  const d = new Date(start + "T12:00:00Z");
  const monthEnd = localDay(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0, 12)));
  const to = win.end < monthEnd ? win.end : monthEnd;
  const days = spanDays(start, to) || 0;
  const first = bills.length === 0;
  const last = to >= win.end;
  const m = orderMath(o);
  // The vans and the rate are the campaign's; the days are this slice's. Flex
  // and fabrication are a one-off, so they ride on the first bill only, and the
  // outstation running is only known at the end.
  const base = Math.round((+o.vehicles || 0) * (+o.rate || 0) * days);
  const extras = first ? (+o.fabrication || 0) + (+o.flex || 0) : 0;
  const outstation = last ? m.outstation : 0;
  return { from: start, to, days, sub: base + extras + outstation, first, last };
};

/* ---------------------------- finance maths ----------------------------
   One place where money is worked out, read by the payroll sheet, the campaign
   P&L, the receivables list and the forecast alike. When these lived inside the
   screens that showed them, the same week's wages came to two different figures
   depending on which screen you were standing on. */

/* What a driver is owed for one week, and what comes off it.
   Wage is per day on duty; batta is per day marked outstation; advances taken
   during the week are recovered from that week's pay, never more than it. */
const driverWeek = (db, driver, weekStart, weekEnd) => {
  const days = (db.attendance || []).filter(a => a.driverId === driver.id
    && String(a.date || "") >= weekStart && String(a.date || "") <= weekEnd);
  const outDays = days.filter(a => a.outstation).length;
  const wage = days.length * (+driver.wage || 0);
  const batta = outDays * (+driver.batta || 0);
  const gross = wage + batta;
  const owed = advanceOwed(db, driver.id, weekEnd);
  const deduct = Math.min(owed, gross);
  return { days: days.length, outDays, wage, batta, gross, advance: deduct, owed, net: gross - deduct, records: days };
};

/* An advance is money handed over ahead of the wage; it is outstanding until
   the weeks that follow have covered it. Recovery is applied week by week in
   order, so a Friday advance never disappears against a wage already paid. */
const advanceOwed = (db, driverId, uptoWeekEnd) => {
  const taken = (db.advances || [])
    .filter(a => a.driverId === driverId && String(a.date || "") <= uptoWeekEnd)
    .reduce((s, a) => s + (+a.amount || 0), 0);
  if (taken <= 0) return 0;
  // Everything already recovered in earlier weeks.
  const first = (db.advances || []).filter(a => a.driverId === driverId)
    .reduce((mn, a) => (!mn || a.date < mn ? a.date : mn), "");
  let recovered = 0;
  if (first) {
    const drv = (db.drivers || []).find(d => d.id === driverId) || {};
    for (let w = weekEnding(first); w < uptoWeekEnd; w = addDays(w, 7)) {
      const { start } = weekRange(w);
      const days = (db.attendance || []).filter(a => a.driverId === driverId
        && String(a.date || "") >= start && String(a.date || "") <= w);
      const takenBy = (db.advances || []).filter(a => a.driverId === driverId && String(a.date || "") <= w)
        .reduce((s, a) => s + (+a.amount || 0), 0);
      const gross = days.length * (+drv.wage || 0) + days.filter(a => a.outstation).length * (+drv.batta || 0);
      recovered += Math.min(Math.max(0, takenBy - recovered), gross);
    }
  }
  return Math.max(0, taken - recovered);
};

/* Which campaigns a vehicle was carrying on a given day. A van can carry two
   brands at once, so the day's wage is split between them rather than charged
   twice — the total across all campaigns always equals the wage actually paid. */
const ordersOnDay = (orders, vehicleId, date) => (orders || []).filter(o => {
  if (!(o.vehicleIds || []).includes(vehicleId)) return false;
  // A day-wise order has no real start/end, so unguarded it matched every
  // date going — a day-wise campaign on a van would wrongly claim a share of
  // every OTHER campaign's wage on that same van, on any day at all.
  const { start, end } = effectiveWindow(o);
  return start <= date && end >= date;
});

/* Everything one campaign cost and earned. Driver wages come from the days its
   vehicles actually ran, not from a guess at the number of days quoted. */
const campaignPnl = (db, order) => {
  const m = orderMath(order);
  const ids = order.vehicleIds || [];
  // A day-wise campaign has no start/end to bound this to — effectiveWindow
  // gives it one anyway, so its costs stop leaking in every duty and every
  // un-tagged expense that vehicle has ever had, at any other time.
  const { start: winStart, end: winEnd } = effectiveWindow(order);
  let wages = 0, battas = 0, dutyDays = 0;
  (db.attendance || []).forEach(a => {
    if (!ids.includes(a.vehicleId)) return;
    const date = String(a.date || "");
    if (date < winStart || date > winEnd) return;
    const drv = (db.drivers || []).find(d => d.id === a.driverId);
    if (!drv) return;
    const share = Math.max(1, ordersOnDay(db.orders, a.vehicleId, date).length);
    wages += (+drv.wage || 0) / share;
    battas += a.outstation ? (+drv.batta || 0) / share : 0;
    dutyDays += 1 / share;
  });
  wages = Math.round(wages); battas = Math.round(battas);
  // Workshop jobs on those vans while the campaign was running.
  const workshop = (db.jobs || []).filter(j => ids.includes(j.vehicleId)
    && String(j.date || "") >= winStart && String(j.date || "") <= winEnd)
    .reduce((s, j) => s + (+j.cost || 0), 0);
  const production = (+order.fabrication || 0) + (+order.flex || 0);
  /* Money out that belongs to this campaign: anything booked directly against
     it, plus running costs on its vans while it was on the road — shared the
     same way the wages are when a van carried two brands at once. */
  let running = 0;
  (db.expenses || []).forEach(e => {
    const date = String(e.date || "");
    if (e.orderId === order.id) { running += +e.amount || 0; return; }
    if (e.orderId) return;                                   // belongs to a different campaign
    if (!e.vehicleId || !ids.includes(e.vehicleId)) return;
    if (date < winStart || date > winEnd) return;
    const share = Math.max(1, ordersOnDay(db.orders, e.vehicleId, date).length);
    running += (+e.amount || 0) / share;
  });
  running = Math.round(running);
  const cost = wages + battas + workshop + production + running;
  // Margin is worked on the money we keep — GST collected belongs to the
  // government, and counting it as revenue flattered every campaign by 18%.
  return { m, revenue: m.sub, wages, battas, workshop, production, running, cost,
           margin: m.sub - cost, dutyDays: Math.round(dutyDays * 10) / 10 };
};

/* A running bank/cash position, for the Finance Dashboard's period picker.
   There is no bank feed, so it starts from one figure the Director types in
   once (settings.openingBalance, as of settings.openingBalanceDate — "base"
   below) and carries it forward: balance on any day = that starting figure,
   plus every payment received and minus every expense and paid wage between
   the baseline date and that day.

   The one wrinkle: a period can start before the baseline (pick "This Year"
   the week after first setting an opening balance in August — the financial
   year began in April). There is no honest way to know the balance back
   then, so the walk-forward starts at whichever is later, base or the
   period's own start, and openingAsOf says which date "Opening balance"
   actually describes — it will not always equal the period's nominal start,
   and the UI shows the real date rather than silently mislabelling it.

   Income/Expenses in the two stat cards are NOT clamped to the baseline —
   they show everything genuinely recorded in the nominal period, matching
   every other report in the app. Only the balance walk itself is limited to
   what came after the baseline, since that is the only part that actually
   requires knowing where the count started. */
const cashFlow = (db, fromISO, toISO) => {
  const base = String(db.settings.openingBalanceDate || "1970-01-01");
  const inRange = (d, lo, hi) => d >= lo && d <= hi;
  const sumPayments = (lo, hi) => (db.payments || []).filter(p => inRange(String(p.date || ""), lo, hi)).reduce((s, p) => s + (+p.amount || 0), 0);
  const sumExpenses = (lo, hi) => (db.expenses || []).filter(e => inRange(String(e.date || ""), lo, hi)).reduce((s, e) => s + (+e.amount || 0), 0);
  const sumPayroll  = (lo, hi) => (db.payruns  || []).filter(p => p.status === "paid" && inRange(String(p.paidOn || ""), lo, hi)).reduce((s, p) => s + (+p.total || 0), 0);

  const openingAsOf = fromISO > base ? fromISO : base;
  const opening = (+db.settings.openingBalance || 0)
    + sumPayments(base, addDays(openingAsOf, -1)) - sumExpenses(base, addDays(openingAsOf, -1)) - sumPayroll(base, addDays(openingAsOf, -1));

  const income = sumPayments(fromISO, toISO);
  const expenses = sumExpenses(fromISO, toISO) + sumPayroll(fromISO, toISO);
  // The walk that actually reaches "closing" only counts from openingAsOf —
  // may be narrower than the income/expenses cards above in the edge case.
  const closing = opening + sumPayments(openingAsOf, toISO) - sumExpenses(openingAsOf, toISO) - sumPayroll(openingAsOf, toISO);

  return { openingAsOf, opening, income, expenses, closing };
};

/* Petty cash: a separate small float, topped up from the bank now and then
   rather than tracked bank-transaction by bank-transaction. An imprest
   system — cashPaid is the "Petty cash" mode on the existing expense form,
   so petty spending keeps its category/vendor/vehicle tagging for free;
   only the top-ups themselves are a new kind of record, since moving money
   from the bank into the tin isn't an expense. Never double-counted against
   the overall cashFlow() above: top-ups are a transfer between two pots the
   business already holds, not new income or a new cost. */
const pettyCashBalance = (db, uptoISO) => {
  const base = String(db.settings.pettyBalanceDate || "1970-01-01");
  const upto = uptoISO || today();
  const topups = (db.pettyTopups || []).filter(t => String(t.date || "") >= base && String(t.date || "") <= upto)
    .reduce((s, t) => s + (+t.amount || 0), 0);
  const spent = (db.expenses || []).filter(e => e.mode === "Petty cash" && String(e.date || "") >= base && String(e.date || "") <= upto)
    .reduce((s, e) => s + (+e.amount || 0), 0);
  return (+db.settings.pettyBalance || 0) + topups - spent;
};

/* ---------------------------- payment discipline ----------------------------
   The business runs on a strict rule: 50% advance before a campaign's vehicles
   go out, the remaining 50% collected at the campaign's own midpoint — never
   at completion, because by completion nothing should be left to collect. A
   10-day booking at ₹2,500/day (₹25,000 + GST) is ₹12,500 + GST before day 1,
   the balance by around day 5. This is not the invoice's credit-period due
   date (that is about the tax invoice raised afterwards) — it is the cash
   discipline that decides whether the vans go out and stay out at all.

   The milestones follow the campaign's own advance %, so a quote deliberately
   written at a different split (rare, but the field exists) never disagrees
   with what this screen demands. */
const paymentMilestones = (o, v) => {
  if (!o) return null;
  const m = orderMath(o);
  const { start, end } = effectiveWindow(o);
  const days = m.days || spanDays(start, end) || 0;
  if (days <= 0) return null;
  const mid = addDays(start, Math.floor(days / 2));
  return [
    { key:"advance", label:"Advance before the vans go out", dueOn: start, cum: m.advance || 0 },
    { key:"mid", label:"Balance by the campaign's midpoint", dueOn: mid, cum: m.total },
  ];
};

/* One alert per campaign — whichever milestone is first still unmet. A
   campaign that has cleared its advance but not yet reached its midpoint
   raises nothing; one where the midpoint has passed with money still owed
   raises the strict, red kind. `lead` is how many days ahead of a due date
   counts as a heads-up rather than silence. */
const paymentAlertsFor = (db, paidOn, lead) => {
  const out = [];
  (db.orders || []).forEach(o => {
    // Only while the campaign is actually running: a proforma has nothing to
    // collect yet, and a completed one is the receivables screen's job.
    if (!["Confirmed", "Advance paid", "Running"].includes(o.stage)) return;
    const v = (db.vendors || []).find(x => x.id === o.vendorId);
    const ms = paymentMilestones(o, v);
    if (!ms) return;
    const collected = paidOn(o.id);
    for (const ms1 of ms) {
      if (collected >= ms1.cum - 1) continue;        // this checkpoint is met; try the next
      const days = daysTo(ms1.dueOn);
      if (days === null || days > lead) break;        // too far out to say anything yet
      out.push({
        orderId: o.id, o, v, milestone: ms1.key, label: ms1.label, dueOn: ms1.dueOn,
        expected: ms1.cum, collected, short: Math.round(ms1.cum - collected), days,
        level: days > 0 ? "upcoming" : "overdue",       // due today counts as overdue: the rule is strict
      });
      break;                                            // one alert per campaign — the nearest unmet milestone
    }
  });
  return out.sort((a, b) => a.days - b.days);
};

/* Receivables: one row per invoice still owed, aged from its own due date. */
const AGE_BUCKETS = [
  { k:"cur",  label:"Not yet due",  test:(d) => d >= 0 },
  { k:"b30",  label:"1–30 days",    test:(d) => d < 0 && d >= -30 },
  { k:"b60",  label:"31–60 days",   test:(d) => d < -30 && d >= -60 },
  { k:"b90",  label:"61–90 days",   test:(d) => d < -60 && d >= -90 },
  { k:"b90p", label:"Over 90 days", test:(d) => d < -90 },
];
const receivables = (db, paidOn) => {
  const rows = [];
  (db.orders || []).forEach(o => {
    if (o.stage === "Proforma" && !o.invNo && !(o.parts || []).length) return;   // a quotation is not owed yet
    const v = (db.vendors || []).find(x => x.id === o.vendorId);
    const m = orderMath(o);
    let bills = billsOf(o, v);
    if (!bills.length) {
      // Confirmed but not yet invoiced: owed on the campaign's own terms.
      bills = [{ id: "unbilled", invNo: null, date: o.created, dueDate: dueDateOf(o, v),
                 from: o.start || "", to: o.end || "", total: m.total }];
    }
    /* Money in is held against the campaign, not the slice, so it settles the
       oldest bill first — which is how a customer paying "one month" is meant
       to be applied. Credit notes reduce the same balance but are kept apart
       from cash: a customer who was credited has not paid. */
    let cash = paidOn(o.id), credit = creditedOn(db, o.id);
    bills.forEach(b => {
      const total = +b.total || 0;
      const paid = Math.min(cash, total); cash -= paid;
      const credited = Math.min(credit, total - paid); credit -= credited;
      const due = Math.round(total - paid - credited);
      if (due <= 0) return;
      const dueOn = b.dueDate || dueDateOf(o, v);
      rows.push({ o, v, m, bill: b, paid, credited, due, dueOn, daysLeft: daysTo(dueOn) || 0 });
    });
  });
  rows.sort((a, b) => (a.dueOn < b.dueOn ? -1 : 1));
  const buckets = {}; AGE_BUCKETS.forEach(b => { buckets[b.k] = 0; });
  rows.forEach(r => { const b = AGE_BUCKETS.find(b => b.test(r.daysLeft)); if (b) buckets[b.k] += r.due; });
  const total = rows.reduce((s, r) => s + r.due, 0);
  const overdue = rows.filter(r => r.daysLeft < 0).reduce((s, r) => s + r.due, 0);
  return { rows, buckets, total, overdue };
};

function GstSheet({ db, vendorOf, onClose }) {
  const s = db.settings || {};
  const [month, setMonth] = useState(today().slice(0, 7));

  /* Every numbered tax invoice raised in the month — a campaign billed once at
     the end counts as one, a campaign billed monthly as one per slice. */
  const invoices = (db.orders || [])
    .flatMap(o => {
      const v = vendorOf(o.vendorId);
      return billsOf(o, v).map(b => ({ o, v, m: b, date: String(b.date || "").slice(0, 10) }));
    })
    .filter(x => x.date.slice(0, 7) === month)
    .sort((a, b) => (a.date === b.date ? (+a.m.invNo) - (+b.m.invNo) : (a.date < b.date ? -1 : 1)));

  const sum = invoices.reduce((t, x) => ({
    taxable: t.taxable + x.m.sub, cgst: t.cgst + x.m.cgst, sgst: t.sgst + x.m.sgst,
    igst: t.igst + x.m.igst, total: t.total + x.m.total,
  }), { taxable:0, cgst:0, sgst:0, igst:0, total:0 });

  /* Credit notes raised in the month reverse tax already charged, and input GST
     paid on our own bills comes off too. What actually leaves on the 20th is
     output tax, less both. */
  const notes = (db.creditNotes || [])
    .filter(c => String(c.date || "").slice(0, 7) === month)
    .map(c => ({ c, o: (db.orders || []).find(o => o.id === c.orderId), v: vendorOf((( db.orders || []).find(o => o.id === c.orderId) || {}).vendorId) }))
    .sort((a, b) => (a.c.date < b.c.date ? -1 : 1));
  const noteSum = notes.reduce((t, x) => ({
    taxable: t.taxable + (+x.c.sub || 0), tax: t.tax + (+x.c.gst || 0), total: t.total + (+x.c.total || 0),
  }), { taxable:0, tax:0, total:0 });
  const inputGst = inputGstIn(db, month);
  const outputGst = sum.cgst + sum.sgst + sum.igst;
  const netGst = Math.max(0, outputGst - noteSum.tax - inputGst);

  // Money actually received in the month, whatever it was invoiced against.
  const receipts = (db.payments || []).filter(p => String(p.date || "").slice(0, 7) === month);
  const received = receipts.reduce((t, p) => t + (+p.amount || 0), 0);
  const tds = receipts.reduce((t, p) => t + (+p.tds || 0), 0);

  // Quotations still waiting to become invoices — not taxable yet, but finance
  // asks what is coming, and an old one usually means nobody chased it.
  const openProformas = (db.orders || []).filter(o => !o.invNo && !(o.parts || []).length && o.stage !== "Completed");

  const months = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    months.push(d.getFullYear() + "-" + pad2(d.getMonth() + 1));
  }

  const exportInvoices = () => {
    const rows = [[
      "Invoice No", "Invoice Date", "Customer", "Customer GSTIN", "Place of Supply",
      "HSN/SAC", "Taxable Value", "CGST Rate", "CGST Amount", "SGST Rate", "SGST Amount",
      "IGST Rate", "IGST Amount", "Invoice Total", "Campaign", "Vehicles", "Days",
    ]];
    invoices.forEach(({ o, v, m, date }) => rows.push([
      m.invNo, dmy(date), v ? v.name : "", v && v.gst ? v.gst : "", stateOf(v),
      s.sac || "998365", m.sub,
      o.gst && !m.inter ? "9%" : "0%", m.cgst, o.gst && !m.inter ? "9%" : "0%", m.sgst,
      o.gst && m.inter ? "18%" : "0%", m.igst,
      m.total, o.title || "", o.vehicles || 0, m.days || spanDays(m.from, m.to),
    ]));
    rows.push([]);
    rows.push(["", "", "", "", "", "TOTAL", sum.taxable, "", sum.cgst, "", sum.sgst, "", sum.igst, sum.total]);
    if (notes.length) {
      rows.push([]);
      rows.push(["CREDIT NOTES"]);
      rows.push(["Note No", "Date", "Customer", "Against Invoice", "Reason", "", "Taxable", "", "CGST", "", "SGST", "", "IGST", "Total"]);
      notes.forEach(({ c, v }) => rows.push([
        c.no, dmy(c.date), v ? v.name : "", c.againstInv || "", c.reason || "", "", -c.sub, "",
        -(c.cgst || 0), "", -(c.sgst || 0), "", -(c.igst || 0), -c.total,
      ]));
    }
    rows.push([]);
    rows.push(["", "", "", "", "", "Output tax", "", "", "", "", "", "", "", outputGst]);
    rows.push(["", "", "", "", "", "Less credit notes", "", "", "", "", "", "", "", -noteSum.tax]);
    rows.push(["", "", "", "", "", "Less input GST on expenses", "", "", "", "", "", "", "", -inputGst]);
    rows.push(["", "", "", "", "", "NET GST PAYABLE", "", "", "", "", "", "", "", netGst]);
    downloadCsv("gst-invoices-" + month + ".csv", rows);
  };

  const exportReceipts = () => {
    const rows = [["Date", "Customer", "Campaign", "Invoice No", "Method", "Reference", "Amount", "TDS deducted", "Settled"]];
    receipts.forEach(p => {
      const o = (db.orders || []).find(x => x.id === p.orderId);
      const v = o ? vendorOf(o.vendorId) : null;
      rows.push([dmy(p.date), v ? v.name : "", o ? o.title : "", o && o.invNo ? o.invNo : "",
                 p.mode || "", p.ref || "", +p.amount || 0, +p.tds || 0, (+p.amount || 0) + (+p.tds || 0)]);
    });
    rows.push([]);
    rows.push(["", "", "", "", "", "TOTAL", received, tds, received + tds]);
    downloadCsv("receipts-" + month + ".csv", rows);
  };

  return (
    <Sheet title="GST & filing" onClose={onClose}>
      <F label="Month">
        <select value={month} onChange={e => setMonth(e.target.value)}>
          {months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}
        </select>
      </F>

      <div className="vz-grid" style={{ marginBottom:6 }}>
        <div className="vz-stat"><i>Taxable value</i><b style={{ fontSize:17 }}>{inr(sum.taxable)}</b><small>{invoices.length} invoice{invoices.length === 1 ? "" : "s"}</small></div>
        <div className="vz-stat"><i>GST payable</i><b style={{ fontSize:17 }}>{inr(netGst)}</b>
          <small>{noteSum.tax || inputGst
            ? "output " + inr(outputGst) + (noteSum.tax ? " − notes " + inr(noteSum.tax) : "") + (inputGst ? " − input " + inr(inputGst) : "")
            : (sum.igst > 0 ? "IGST " + inr(sum.igst) + " · " : "") + "CGST " + inr(sum.cgst) + " · SGST " + inr(sum.sgst)}</small></div>
        <div className="vz-stat"><i>Invoiced</i><b style={{ fontSize:17 }}>{inr(sum.total)}</b><small>including tax</small></div>
        <div className="vz-stat"><i>Received</i><b style={{ fontSize:17 }}>{inr(received)}</b><small>{tds > 0 ? inr(tds) + " TDS deducted" : receipts.length + " payment" + (receipts.length === 1 ? "" : "s")}</small></div>
      </div>

      <div className="vz-2">
        <button className="vz-btn go" style={{ margin:0 }} disabled={!invoices.length} onClick={exportInvoices}>Export invoices</button>
        <button className="vz-btn alt" style={{ margin:0 }} disabled={!receipts.length} onClick={exportReceipts}>Export receipts</button>
      </div>
      <div className="vz-meta" style={{ marginTop:6, marginBottom:10 }}>
        Opens in Excel. GSTIN {s.gstin || "—"} · place of supply {s.placeOfSupply || "33-Tamil Nadu"}.
      </div>

      <div className="vz-eyebrow">Tax invoices · {monthLabel(month)}</div>
      {invoices.length === 0 && <div className="vz-card"><div className="vz-meta">No tax invoice was raised in this month.</div></div>}
      {invoices.map(({ o, v, m, date }) => (
        <div className="vz-card" key={o.id + ":" + m.id}>
          <div className="vz-row">
            <div style={{ minWidth:0 }}>
              <div className="vz-title">#{m.invNo} · {v ? v.name : "—"}</div>
              <div className="vz-meta">{dmy(date)} · {o.title || "—"}
                {m.whole ? "" : " · " + dmy(m.from) + " to " + dmy(m.to)}</div>
              <div className="vz-meta">{v && v.gst ? "GSTIN " + v.gst : "No GSTIN on file — B2C"}</div>
            </div>
            <b className="vz-money">{inr(m.total)}</b>
          </div>
          <div className="vz-kv"><span>Taxable</span><b className="vz-money">{inr(m.sub)}</b></div>
          {!o.gst
            ? <div className="vz-kv"><span>Tax</span><b className="vz-money" style={{ color:"#B4262A" }}>not charged</b></div>
            : m.inter
              ? <div className="vz-kv"><span>IGST 18% · {stateOf(v).split("-")[1]}</span><b className="vz-money">{inr(m.igst)}</b></div>
              : <div className="vz-kv"><span>CGST 9% + SGST 9%</span><b className="vz-money">{inr(m.cgst)} + {inr(m.sgst)}</b></div>}
        </div>
      ))}

      {notes.length > 0 && (
        <>
          <div className="vz-eyebrow">Credit notes · {monthLabel(month)}</div>
          {notes.map(({ c, v }) => (
            <div className="vz-card" key={c.id} style={{ background:"#FFF6F6", borderColor:"#F2C9C9" }}>
              <div className="vz-row">
                <div style={{ minWidth:0 }}>
                  <div className="vz-title">{c.no} · {v ? v.name : "—"}</div>
                  <div className="vz-meta">{dmy(c.date)} · against invoice #{c.againstInv} · {c.reason || "no reason given"}</div>
                </div>
                <b className="vz-money" style={{ color:"#B4262A" }}>− {inr(c.total)}</b>
              </div>
              <div className="vz-kv"><span>Taxable reversed</span><b className="vz-money">− {inr(c.sub)}</b></div>
              {(+c.gst || 0) > 0 && <div className="vz-kv"><span>Tax reversed</span><b className="vz-money">− {inr(c.gst)}</b></div>}
            </div>
          ))}
        </>
      )}

      {(noteSum.tax > 0 || inputGst > 0) && (
        <>
          <div className="vz-eyebrow">What actually leaves on the 20th</div>
          <div className="vz-card">
            <div className="vz-kv"><span>Tax charged on invoices</span><b className="vz-money">{inr(outputGst)}</b></div>
            {noteSum.tax > 0 && <div className="vz-kv"><span>Less credit notes</span><b className="vz-money">− {inr(noteSum.tax)}</b></div>}
            {inputGst > 0 && <div className="vz-kv"><span>Less input GST on expenses</span><b className="vz-money">− {inr(inputGst)}</b></div>}
            <div className="vz-kv"><span style={{ fontWeight:700 }}>Net GST payable</span><b className="vz-money" style={{ fontSize:15 }}>{inr(netGst)}</b></div>
          </div>
          <div className="vz-meta" style={{ marginTop:-2 }}>
            Input credit is the GST on our own bills — flex, fabrication, spares, insurance. It is only
            claimable if the supplier has filed it, so treat this as the best case.
          </div>
        </>
      )}

      {openProformas.length > 0 && (
        <>
          <div className="vz-eyebrow">Quotations not yet invoiced</div>
          {openProformas.map(o => {
            const v = vendorOf(o.vendorId), m = orderMath(o), age = Math.abs(daysTo(o.created) || 0);
            return (
              <div className="vz-kv" key={o.id} style={{ background:"#fff", padding:"11px 13px", border:"1px solid var(--line)", borderRadius:10, marginBottom:6 }}>
                <span style={{ color:"var(--ink)", fontWeight:600 }}>{v ? v.name : "—"}<br />
                  <small style={{ color:"var(--muted)", fontWeight:400 }}>{o.no} · {o.stage} · {age} days old</small></span>
                <b className="vz-money">{inr(m.total)}</b>
              </div>
            );
          })}
        </>
      )}
    </Sheet>
  );
}

/* ---------------------------- petrol cards ----------------------------

   first, because that is the order she works down. */
function FuelCardsSheet({ db, vehOf, perm, onAddCard, onEditCard, onRecharge, onBalance, onClose }) {
  const cards = cardsToWatch(db);
  const low = cards.filter(c => cardLow(c, db.settings));
  const threshold = +((db.settings || {}).fuelLow) || LOW_FUEL_DEFAULT;
  const mth = today().slice(0, 7);
  const rechargedThisMonth = (db.fuelTxns || [])
    .filter(t => t.type === "recharge" && String(t.date || "").slice(0, 7) === mth)
    .reduce((s, t) => s + (+t.amount || 0), 0);

  return (

      <div className="vz-grid" style={{ marginBottom:6 }}>

          <b style={{ fontSize:18, color: low.length ? "#E5484D" : "#178951" }}>{low.length}</b>

        const isLow = cardLow(c, db.settings);
        return (

                <div className="vz-meta">
                  {checked ? "Balance read " + (staleDays === 0 ? "today" : staleDays + " day" + (staleDays === 1 ? "" : "s") + " ago") : "never checked"}
                  {last ? " · last recharge " + dmy(last.date) + " " + inr(last.amount) : " · never recharged"}
                </div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div className="vz-money" style={{ fontSize:16, color: isLow ? "#B4262A" : "var(--ink)" }}>{inr(cardBalance(c))}</div>
                {isLow && <Chip c="c-red">recharge</Chip>}

              <div className="vz-inline" style={{ marginTop:9, flexWrap:"wrap" }}>

                <button className="vz-chip c-blue" onClick={() => onBalance(c)}>Balance today</button>
                <button className="vz-chip c-grey" onClick={() => onEditCard(c)}>Edit</button>
              </div>
            )}
          </div>
        );
      })}

      {perm.money && <button className="vz-btn alt" onClick={() => onAddCard()}>+ Add a card</button>}

      <div className="vz-eyebrow">Recent recharges</div>
      {(db.fuelTxns || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 12).map(t => {
        const card = (db.fuelCards || []).find(c => c.id === t.cardId);
        const veh = card ? vehOf(card.vehicleId) : null;
        return (

      {(db.fuelTxns || []).length === 0 && <div className="vz-card"><div className="vz-meta">Nothing yet.</div></div>}

      <div className="vz-meta">

        van — it reaches the campaign that van was carrying, and the month's costs, on its own.
      </div>
    </Sheet>
  );
}

function ExpensesSheet({ db, vehOf, onAdd, onEdit, onClose }) {
  const [month, setMonth] = useState(today().slice(0, 7));
  const months = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    months.push(d.getFullYear() + "-" + pad2(d.getMonth() + 1));
  }
  const list = expensesIn(db, month).sort((a, b) => (a.date < b.date ? 1 : -1));
  const total = expenseTotal(list);
  const gst = list.reduce((s, e) => s + (+e.gstPaid || 0), 0);

  const byCat = {};
  list.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + (+e.amount || 0); });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

  const supplierOf = (id) => (db.suppliers || []).find(s => s.id === id);

  const exportCsv = () => {
    const rows = [["Date", "Category", "Amount", "GST paid", "Paid by", "Vendor", "Vehicle", "Campaign", "Note"]];

      const o = (db.orders || []).find(x => x.id === e.orderId);
      rows.push([dmy(e.date), e.cat, +e.amount || 0, +e.gstPaid || 0, e.mode || "",
                 (supplierOf(e.supplierId) || {}).name || "",
                 (vehOf(e.vehicleId) || {}).plate || "", o ? o.title : "", e.note || ""]);

    <Sheet title="Expenses" onClose={onClose}>

/* ---------------------------- credit notes ----------------------------
   Raised against an invoice that has already gone out. Full cancels it, part
   reduces it — either way the original invoice stays exactly as it was sent. */
function CreditNoteForm({ db, vendorOf, paidOn, nextNo, onSave, onClose }) {
  const billed = (db.orders || [])
    .filter(o => o.invNo || (o.parts || []).length)
    .sort((a, b) => (String(a.invDate || a.created) < String(b.invDate || b.created) ? 1 : -1));
  const [f, set] = useState({ orderId: billed[0]?.id || "", date: today(), amount:"", reason:"", full:true });
  const o = billed.find(x => x.id === f.orderId);
  const v = o ? vendorOf(o.vendorId) : null;
  const bills = o ? billsOf(o, v) : [];
  const invoiced = bills.reduce((s, b) => s + (+b.total || 0), 0);
  const alreadyCredited = o ? creditedOn(db, o.id) : 0;
  // Never credit more than is left uncredited — a note bigger than the invoice
  // is not a correction, it is a mistake waiting for the GST officer.
  const creditable = Math.max(0, invoiced - alreadyCredited);
  const taxableLeft = o ? Math.round(creditable / (o.gst ? 1.18 : 1)) : 0;
  const sub = f.full ? taxableLeft : Math.round(+f.amount || 0);
  const m = cnMath(o, sub);
  const over = m.total > creditable + 1;
  const ready = o && sub > 0 && !over && f.reason.trim();
  return (
    <Sheet title="Raise a credit note" onClose={onClose}>
      <F label="Against which invoice">
        <select value={f.orderId} onChange={e => set({ ...f, orderId: e.target.value, amount:"" })}>
          {billed.map(x => {
            const vv = vendorOf(x.vendorId);
            const nos = billsOf(x, vv).map(b => "#" + b.invNo).join(", ");
            return <option key={x.id} value={x.id}>{nos} · {vv ? vv.name : "—"} · {x.title}</option>;
          })}
        </select>
      </F>
      {!o && <div className="vz-meta">No invoice has been raised yet — there is nothing to credit.</div>}
      {o && <>
        <div className="vz-card" style={{ background:"#FAFBFC" }}>
          <div className="vz-kv"><span>Invoiced</span><b className="vz-money">{inr(invoiced)}</b></div>
          <div className="vz-kv"><span>Received</span><b className="vz-money">{inr(paidOn(o.id))}</b></div>
          {alreadyCredited > 0 && <div className="vz-kv"><span>Already credited</span><b className="vz-money">{inr(alreadyCredited)}</b></div>}
          <div className="vz-kv"><span>Can still be credited</span><b className="vz-money">{inr(creditable)}</b></div>
        </div>

        <div className="vz-mode" style={{ margin:"12px auto", width:"fit-content" }}>
          <button data-on={f.full ? "1" : "0"} onClick={() => set({ ...f, full:true })}>Cancel it in full</button>
          <button data-on={!f.full ? "1" : "0"} onClick={() => set({ ...f, full:false })}>Credit part of it</button>
        </div>

        {!f.full && (
          <F label="Amount to credit ₹ (before GST)">
            <input type="number" value={f.amount} onChange={e => set({ ...f, amount: e.target.value })} inputMode="numeric" />
          </F>
        )}
        <div className="vz-2">
          <F label="Date"><input type="date" value={f.date} onChange={e => set({ ...f, date: e.target.value })} /></F>
          <F label="Note number"><input value={nextNo} readOnly style={{ fontFamily:"var(--mono)" }} /></F>
        </div>
        <F label="Reason (printed on the note)">
          <input value={f.reason} onChange={e => set({ ...f, reason: e.target.value })}
            placeholder="campaign cut short / rate corrected / billed twice" />
        </F>

        <div className="vz-card">
          <div className="vz-kv"><span>Taxable credited</span><b className="vz-money">{inr(m.sub)}</b></div>
          {o.gst && (m.inter
            ? <div className="vz-kv"><span>IGST 18% reversed</span><b className="vz-money">{inr(m.igst)}</b></div>
            : <div className="vz-kv"><span>CGST + SGST reversed</span><b className="vz-money">{inr(m.cgst)} + {inr(m.sgst)}</b></div>)}
          <div className="vz-kv"><span style={{ fontWeight:700 }}>Credit note total</span><b className="vz-money" style={{ fontSize:15 }}>{inr(m.total)}</b></div>
        </div>
        {over && <div className="vz-meta" style={{ color:"#B4262A" }}>
          That is more than the {inr(creditable)} left on this invoice.
        </div>}
        {!f.reason.trim() && <div className="vz-meta" style={{ color:"#8A6100" }}>A reason is required — it goes on the note and the GST return.</div>}

        <button className="vz-btn" disabled={!ready}
          onClick={() => onSave({
            id: uid(), orderId: o.id, no: nextNo, date: f.date, reason: f.reason.trim(),
            againstInv: bills.map(b => b.invNo).join(", "),
            sub: m.sub, gst: m.gst, cgst: m.cgst, sgst: m.sgst, igst: m.igst, total: m.total,
          })}>
          Raise credit note for {inr(m.total)}
        </button>
        <div className="vz-meta">
          The invoice stays exactly as it was sent. This note reverses the amount and its tax,
          and the customer's balance drops by {inr(m.total)}.
        </div>
      </>}
    </Sheet>
  );
}

/* ---------------------------- the day book ----------------------------
   The entry made once, here, instead of again in Tally. Every voucher the
   month produced, with both its sides, ticked off as it goes into the books
   so nothing is keyed twice and nothing is missed. */
function DayBookSheet({ db, onMark, onAddVoucher, onClose }) {
  const [month, setMonth] = useState(today().slice(0, 7));
  const [only, setOnly] = useState("todo");        // todo | all
  const months = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    months.push(d.getFullYear() + "-" + pad2(d.getMonth() + 1));
  }
  const done = new Set((db.tallyMarks || []).map(m => m.id));
  const all = dayBook(db, month);
  const list = only === "todo" ? all.filter(v => !done.has(v.id)) : all;
  const pending = all.filter(v => !done.has(v.id)).length;

  const TYPE_CHIP = { Sales:"c-green", "Credit Note":"c-red", Receipt:"c-blue", Payment:"c-yellow", Journal:"c-grey" };

  const exportCsv = () => {
    const rows = [["Date", "Voucher type", "Reference", "Party / narration", "Ledger", "Debit", "Credit", "In books"]];
    all.forEach(v => v.lines.forEach((l, i) => rows.push([
      i === 0 ? dmy(v.date) : "", i === 0 ? v.type : "", i === 0 ? v.ref : "",
      i === 0 ? (v.party + (v.narration ? " — " + v.narration : "")) : "",
      l.dr || l.cr, l.dr ? l.amount : "", l.cr ? l.amount : "",
      i === 0 ? (done.has(v.id) ? "yes" : "no") : "",
    ])));
    downloadCsv("day-book-" + month + ".csv", rows);
  };

  return (
    <Sheet title="Day book" onClose={onClose}>
      <div className="vz-meta" style={{ marginTop:0 }}>
        Every entry the month has produced, with both sides and the ledger it belongs to.
        Tick one when it is in the books.
      </div>
      <F label="Month">
        <select value={month} onChange={e => setMonth(e.target.value)}>
          {months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}
        </select>
      </F>
      <div className="vz-grid" style={{ marginBottom:6 }}>
        <div className="vz-stat"><i>Still to enter</i>
          <b style={{ fontSize:18, color: pending ? "#E5484D" : "#178951" }}>{pending}</b>
          <small>of {all.length} voucher{all.length === 1 ? "" : "s"}</small></div>
        <div className="vz-stat"><i>Month</i><b style={{ fontSize:18 }}>{monthLabel(month)}</b><small>{done.size} ticked in all</small></div>
      </div>

      <div className="vz-mode" style={{ margin:"10px auto", width:"fit-content" }}>
        <button data-on={only === "todo" ? "1" : "0"} onClick={() => setOnly("todo")}>Still to enter</button>
        <button data-on={only === "all" ? "1" : "0"} onClick={() => setOnly("all")}>Everything</button>
      </div>
      <div className="vz-2">
        <button className="vz-btn alt" style={{ margin:0 }} onClick={() => onAddVoucher()}>+ Entry by hand</button>
        <button className="vz-btn alt" style={{ margin:0 }} disabled={!all.length} onClick={exportCsv}>Export</button>
      </div>

      {list.length === 0 && (
        <div className="vz-card"><div className="vz-meta">
          {all.length ? "Everything this month is in the books." : "Nothing happened this month."}
        </div></div>
      )}

      {list.map(v => {
        const isDone = done.has(v.id);
        return (
          <div className="vz-card" key={v.id} style={isDone ? { background:"#F7FAF8", borderColor:"#CFE3D6" } : null}>
            <div className="vz-row">
              <div style={{ minWidth:0 }}>
                <div className="vz-title">{v.party}</div>
                <div className="vz-meta">{dmy(v.date)}{v.ref ? " · " + v.ref : ""}{v.narration ? " · " + v.narration : ""}</div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div className="vz-money">{inr(v.amount)}</div>
                <Chip c={TYPE_CHIP[v.type] || "c-grey"}>{v.type}</Chip>
              </div>
            </div>
            {v.lines.map((l, i) => (
              <div className="vz-kv" key={i}>
                <span style={{ fontFamily:"var(--mono)", fontSize:12 }}>
                  {l.dr ? "Dr" : "  Cr"} &nbsp;{l.dr || l.cr}
                </span>
                <b className="vz-money">{inr(l.amount)}</b>
              </div>
            ))}
            <button className={"vz-chip " + (isDone ? "c-green" : "c-grey")} style={{ marginTop:9 }}
              onClick={() => onMark(v.id, !isDone)}>
              {isDone ? "In the books ✓" : "Mark as entered"}
            </button>
          </div>
        );
      })}
    </Sheet>
  );
}

      <F label="Credit (where it came from)">
        <input list="vz-ledgers" value={f.cr} onChange={u("cr")} />
      </F>
      <datalist id="vz-ledgers">{suggestions.map(s => <option key={s} value={s} />)}</datalist>
      <F label="Narration"><input value={f.narration} onChange={u("narration")} placeholder="what this was" /></F>
      <button className="vz-btn" disabled={!(+f.amount > 0) || !f.dr.trim() || !f.cr.trim()}
        onClick={() => onSave({ id: uid(), ...f, dr: f.dr.trim(), cr: f.cr.trim(), amount: +f.amount })}>
        Save entry
      </button>
      <div className="vz-meta">
        Invoices, receipts, expenses and payroll are already in the day book on their own —
        this is only for what happened outside the app.
      </div>
    </Sheet>
  );
}

/* ---------------------------- reports ----------------------------
   Everything the office is ever asked for, over any stretch of time, as a file
   that opens in Excel. One period picker at the top drives all of them, so a
   month's sales and that month's expenses can never be measured over two
   different windows. */
const FY_START_MONTH = 4;                       // April, as the Indian year runs
const fyOf = (d) => {
  const y = +String(d).slice(0, 4), m = +String(d).slice(5, 7);
  return m >= FY_START_MONTH ? y : y - 1;
};
const fyRange = (y) => ({ from: y + "-04-01", to: (y + 1) + "-03-31", label: "FY " + y + "–" + String(y + 1).slice(2) });
const monthRange = (ym) => {
  const [y, m] = ym.split("-").map(Number);
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return { from: ym + "-01", to: ym + "-" + pad2(last), label: monthLabel(ym) };
};
const quarterRange = (y, q) => {
  const startM = FY_START_MONTH + (q - 1) * 3;
  const sy = y + (startM > 12 ? 1 : 0), sm = ((startM - 1) % 12) + 1;
  const from = sy + "-" + pad2(sm) + "-01";
  const endD = new Date(Date.UTC(sy, sm + 2, 0));
  return { from, to: localDay(endD), label: "Q" + q + " " + fyRange(y).label };
};

/* Everything that happened between two dates, worked out once. */
const periodFigures = (db, from, to, paidOn) => {
  const inP = (d) => { const s = String(d || "").slice(0, 10); return s >= from && s <= to; };

  const bills = (db.orders || []).flatMap(o => {
    const v = (db.vendors || []).find(x => x.id === o.vendorId);
    return billsOf(o, v).filter(b => inP(b.date)).map(b => ({ o, v, b }));
  });
  const notes = (db.creditNotes || []).filter(c => inP(c.date));
  const receipts = (db.payments || []).filter(p => inP(p.date));
  const spend = (db.expenses || []).filter(e => inP(e.date));
  const jobs = (db.jobs || []).filter(j => inP(j.date));
  const runs = (db.payruns || []).filter(p => p.paidOn && inP(p.paidOn));

  const revenue = bills.reduce((s, x) => s + (+x.b.sub || 0), 0) - notes.reduce((s, c) => s + (+c.sub || 0), 0);
  const outTax = bills.reduce((s, x) => s + (+x.b.gst || 0), 0) - notes.reduce((s, c) => s + (+c.gst || 0), 0);
  const inTax = spend.reduce((s, e) => s + (+e.gstPaid || 0), 0);
  const collected = receipts.reduce((s, p) => s + (+p.amount || 0), 0);
  const tds = receipts.reduce((s, p) => s + (+p.tds || 0), 0);
  const wages = runs.reduce((s, p) => s + (+p.total || 0), 0);
  const workshop = jobs.reduce((s, j) => s + (+j.cost || 0), 0);

  const byCat = {};
  spend.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + (+e.amount || 0); });
  const DIRECT = ["Diesel", "Flex printing", "Fabrication", "Tolls & parking"];
  const direct = DIRECT.reduce((s, c) => s + (byCat[c] || 0), 0);
  const overhead = Object.entries(byCat).filter(([c]) => !DIRECT.includes(c)).reduce((s, [, v]) => s + v, 0);

  const grossCost = wages + direct + workshop;
  return { from, to, bills, notes, receipts, spend, jobs, runs, byCat,
           revenue, outTax, inTax, netTax: Math.max(0, outTax - inTax),
           collected, tds, wages, workshop, direct, overhead,
           gross: revenue - grossCost, net: revenue - grossCost - overhead, grossCost };
};

function ReportsSheet({ db, paidOn, vendorOf, vehOf, drvOf, onClose }) {
  const [mode, setMode] = useState("month");     // day | month | quarter | year | custom
  const [month, setMonth] = useState(today().slice(0, 7));
  const [day, setDay] = useState(today());
  const [fy, setFy] = useState(fyOf(today()));
  const [q, setQ] = useState(Math.floor(((+today().slice(5, 7) - FY_START_MONTH + 12) % 12) / 3) + 1);
  const [custom, setCustom] = useState({ from: addDays(today(), -30), to: today() });

  const range = mode === "day" ? { from: day, to: day, label: dmy(day) }
    : mode === "month" ? monthRange(month)
    : mode === "quarter" ? quarterRange(fy, q)
    : mode === "year" ? fyRange(fy)
    : { from: custom.from, to: custom.to, label: dmy(custom.from) + " – " + dmy(custom.to) };

  const f = periodFigures(db, range.from, range.to, paidOn);
  const stamp = range.from + "_to_" + range.to;

  // Same fleet slice the on-screen card and the download both read, so the
  // two can never disagree.
  const fleetInP = (db.attendance || []).filter(a => { const s = String(a.date || "").slice(0, 10); return s >= range.from && s <= range.to; });
  const fleetKm = fleetInP.reduce((s, a) => s + ((a.openKm != null && a.closeKm != null) ? Math.max(0, a.closeKm - a.openKm) : 0), 0);
  const fleetVehicles = new Set(fleetInP.map(a => a.vehicleId)).size;
  const fleetDrivers = new Set(fleetInP.map(a => a.driverId || a.driverName)).size;
  const months = [];
  for (let i = 0; i < 18; i++) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    months.push(d.getFullYear() + "-" + pad2(d.getMonth() + 1));
  }
  const fys = [];
  for (let i = 0; i < 4; i++) fys.push(fyOf(today()) - i);

  /* ---- the reports themselves ---- */
  const head = (title) => [[((db.settings || {}).company || "Vibe Marketing")],
                           [title + " · " + range.label], []];

  const repSales = () => {
    const rows = head("Sales register").concat([[
      "Invoice No", "Date", "Customer", "GSTIN", "Place of supply", "Campaign", "Period",
      "Taxable", "CGST", "SGST", "IGST", "Invoice total"]]);
    f.bills.forEach(({ o, v, b }) => rows.push([
      b.invNo, dmy(b.date), v ? v.name : "", (v && v.gst) || "", stateOf(v), o.title || "",
      b.whole ? "" : dmy(b.from) + " to " + dmy(b.to),
      b.sub, b.cgst, b.sgst, b.igst, b.total]));
    rows.push([]);
    rows.push(["", "", "", "", "", "", "TOTAL",
      f.bills.reduce((s, x) => s + x.b.sub, 0), f.bills.reduce((s, x) => s + x.b.cgst, 0),
      f.bills.reduce((s, x) => s + x.b.sgst, 0), f.bills.reduce((s, x) => s + x.b.igst, 0),
      f.bills.reduce((s, x) => s + x.b.total, 0)]);
    downloadCsv("sales-register-" + stamp + ".csv", rows);
  };

  const repCollections = () => {
    const rows = head("Collections").concat([["Date", "Customer", "Campaign", "Invoice", "Mode", "Reference", "Received", "TDS", "Settled"]]);
    f.receipts.forEach(p => {
      const o = (db.orders || []).find(x => x.id === p.orderId) || {};
      const v = vendorOf(o.vendorId);
      rows.push([dmy(p.date), v ? v.name : "", o.title || "", o.invNo || "", p.mode || "", p.ref || "",
                 +p.amount || 0, +p.tds || 0, (+p.amount || 0) + (+p.tds || 0)]);
    });
    rows.push([]);
    rows.push(["", "", "", "", "", "TOTAL", f.collected, f.tds, f.collected + f.tds]);
    downloadCsv("collections-" + stamp + ".csv", rows);
  };

  const repOutstanding = () => {
    const r = receivables(db, paidOn);
    const rows = head("Outstanding as at " + dmy(range.to)).concat([[
      "Customer", "Invoice", "Campaign", "Invoice date", "Due date", "Invoiced", "Received", "Credited", "Balance", "Days overdue"]]);
    r.rows.forEach(x => rows.push([
      x.v ? x.v.name : "", x.bill.invNo || "not invoiced", x.o.title || "",
      dmy(x.bill.date || ""), dmy(x.dueOn), x.bill.total, x.paid, x.credited || 0, x.due,
      x.daysLeft < 0 ? -x.daysLeft : 0]));
    rows.push([]);
    AGE_BUCKETS.forEach(b => rows.push(["", "", "", "", b.label, "", "", "", r.buckets[b.k]]));
    rows.push(["", "", "", "", "TOTAL", "", "", "", r.total]);
    downloadCsv("outstanding-" + range.to + ".csv", rows);
  };

  /* The customer ledger — every document against a customer with a running
     balance. This is what anyone means by "send me their account". */
  const repLedger = () => {
    const rows = head("Customer ledger").concat([["Customer", "Date", "Particulars", "Debit", "Credit", "Balance"]]);
    (db.vendors || []).forEach(v => {
      const entries = [];
      (db.orders || []).filter(o => o.vendorId === v.id).forEach(o => {
        billsOf(o, v).forEach(b => entries.push({ date: b.date, what: "Invoice #" + b.invNo + " · " + (o.title || ""), dr: b.total, cr: 0 }));
      });
      (db.creditNotes || []).forEach(c => {
        const o = (db.orders || []).find(x => x.id === c.orderId);
        if (!o || o.vendorId !== v.id) return;
        entries.push({ date: c.date, what: "Credit note " + c.no + " · " + (c.reason || ""), dr: 0, cr: c.total });
      });
      (db.payments || []).forEach(p => {
        const o = (db.orders || []).find(x => x.id === p.orderId);
        if (!o || o.vendorId !== v.id) return;
        entries.push({ date: p.date, what: "Receipt " + (p.mode || "") + (p.ref ? " " + p.ref : ""), dr: 0, cr: +p.amount || 0 });
        if (+p.tds > 0) entries.push({ date: p.date, what: "TDS deducted", dr: 0, cr: +p.tds });
      });
      if (!entries.length) return;
      entries.sort((a, b) => (a.date < b.date ? -1 : 1));
      let bal = 0;
      rows.push([v.name, "", (v.gst ? "GSTIN " + v.gst + " · " : "") + (creditDaysOf(v) ? creditDaysOf(v) + "-day terms" : "pays on completion"), "", "", ""]);
      entries.forEach(e => { bal += e.dr - e.cr; rows.push(["", dmy(e.date), e.what, e.dr || "", e.cr || "", bal]); });
      rows.push(["", "", "Closing balance", "", "", bal]);
      rows.push([]);
    });
    downloadCsv("customer-ledger-" + stamp + ".csv", rows);
  };

  const repExpenses = () => {
    const rows = head("Expenses").concat([["Date", "Category", "Amount", "GST paid", "Paid by", "Vehicle", "Campaign", "Note"]]);
    f.spend.forEach(e => {
      const o = (db.orders || []).find(x => x.id === e.orderId);
      rows.push([dmy(e.date), e.cat, +e.amount || 0, +e.gstPaid || 0, e.mode || "",
                 (vehOf(e.vehicleId) || {}).plate || "", o ? o.title : "", e.note || ""]);
    });
    rows.push([]);
    Object.entries(f.byCat).sort((a, b) => b[1] - a[1]).forEach(([c, v]) => rows.push(["", c, v]));
    rows.push(["", "TOTAL", f.spend.reduce((s, e) => s + (+e.amount || 0), 0), f.inTax]);
    downloadCsv("expenses-" + stamp + ".csv", rows);
  };

  const repPayroll = () => {
    const rows = head("Payroll register").concat([["Week ending", "Paid on", "Name", "Type", "Days", "Outstation", "Wage", "Batta", "Advance", "Net", "Released by", "Paid by"]]);
    f.runs.forEach(p => (p.lines || []).forEach(l => rows.push([
      dmy(p.weekEnd), dmy(p.paidOn), l.name, l.kind, l.days || "", l.outDays || "",
      l.wage || l.net, l.batta || 0, l.advance || 0, l.net, p.initiatedBy || "", p.paidBy || ""])));
    rows.push([]);
    rows.push(["", "", "", "", "", "", "", "", "TOTAL", f.wages]);
    downloadCsv("payroll-" + stamp + ".csv", rows);
  };

  /* Which vehicles ran, who drove them, and how far — day by day. Built
     straight from attendance, the same record a driver punches on his own
     phone, so this is what actually happened, not what was scheduled. For a
     single-day report this answers "how many vehicles were active today" on
     its own; for a month or a year the by-day table above the detail does. */
  const repFleet = () => {
    const inP = (d) => { const s = String(d || "").slice(0, 10); return s >= range.from && s <= range.to; };
    const rows0 = (db.attendance || []).filter(a => inP(a.date)).sort((a, b) => (a.date < b.date ? 1 : -1));

    const byDay = {};
    rows0.forEach(a => {
      const d = byDay[a.date] || (byDay[a.date] = { vehicles: new Set(), drivers: new Set(), km: 0 });
      d.vehicles.add(a.vehicleId); d.drivers.add(a.driverId || a.driverName);
      if (a.openKm != null && a.closeKm != null) d.km += Math.max(0, a.closeKm - a.openKm);
    });

    const rows = head("Fleet & driver activity");
    rows.push(["By day — vehicles active"]);
    rows.push(["Date", "Vehicles active", "Drivers on duty", "KM run"]);
    Object.keys(byDay).sort((a, b) => (a < b ? 1 : -1)).forEach(d => {
      const x = byDay[d];
      rows.push([dmy(d), x.vehicles.size, x.drivers.size, x.km]);
    });

    rows.push([]);
    rows.push(["Every duty, day by day"]);
    rows.push(["Date", "Vehicle", "Driver", "In time", "Out time", "Opening KM", "Closing KM", "KM run",
               "Outstation", "Wage for the day", "Punch-in location"]);
    let kmTotal = 0, wageTotal = 0;
    rows0.forEach(a => {
      const veh = vehOf(a.vehicleId);
      const drv = a.driverId ? drvOf(a.driverId) : null;
      const km = (a.openKm != null && a.closeKm != null) ? Math.max(0, a.closeKm - a.openKm) : "";
      const wage = (+((drv || {}).wage) || 0) + (a.outstation ? (+((drv || {}).batta) || 0) : 0);
      if (typeof km === "number") kmTotal += km;
      wageTotal += wage;
      rows.push([
        dmy(a.date), veh ? veh.plate : "", a.driverName || (drv ? drv.name : ""),
        a.inAt ? clock(a.inAt) : "", a.outAt ? clock(a.outAt) : (a.date === today() ? "still on duty" : ""),
        a.openKm != null ? a.openKm : "", a.closeKm != null ? a.closeKm : "", km,
        a.outstation ? "yes" : "", wage,
        (a.lat != null && a.lng != null) ? mapLink(a.lat, a.lng) : "",
      ]);
    });

    rows.push([]);
    rows.push(["Vehicle-days", rows0.length]);
    rows.push(["Distinct vehicles used", new Set(rows0.map(a => a.vehicleId)).size]);
    rows.push(["Distinct drivers on duty", new Set(rows0.map(a => a.driverId || a.driverName)).size]);
    rows.push(["Total KM run", kmTotal]);
    rows.push(["Total wage cost (days in this report)", wageTotal]);
    downloadCsv("fleet-activity-" + stamp + ".csv", rows);
  };

  /* GSTR-1 shape: B2B invoices listed one by one, B2C summarised, then the
     3B summary the return actually asks for. */
  const repGst = () => {
    const b2b = f.bills.filter(x => x.v && String(x.v.gst || "").trim());
    const b2c = f.bills.filter(x => !x.v || !String(x.v.gst || "").trim());
    const rows = head("GST return");
    rows.push(["B2B — invoices to registered customers"]);
    rows.push(["GSTIN", "Customer", "Invoice No", "Date", "Invoice value", "Place of supply", "Rate", "Taxable", "CGST", "SGST", "IGST"]);
    b2b.forEach(({ o, v, b }) => rows.push([
      v.gst, v.name, b.invNo, dmy(b.date), b.total, stateOf(v), o.gst ? "18%" : "0%",
      b.sub, b.cgst, b.sgst, b.igst]));
    rows.push([]);
    rows.push(["B2C — customers with no GSTIN"]);
    rows.push(["Invoice No", "Date", "Customer", "Place of supply", "Rate", "Taxable", "CGST", "SGST", "IGST", "Total"]);
    b2c.forEach(({ o, v, b }) => rows.push([
      b.invNo, dmy(b.date), v ? v.name : "", stateOf(v), o.gst ? "18%" : "0%",
      b.sub, b.cgst, b.sgst, b.igst, b.total]));
    rows.push([]);
    rows.push(["Credit notes"]);
    rows.push(["Note No", "Date", "Customer", "Against invoice", "Reason", "Taxable", "Tax", "Total"]);
    f.notes.forEach(c => {
      const o = (db.orders || []).find(x => x.id === c.orderId) || {};
      rows.push([c.no, dmy(c.date), (vendorOf(o.vendorId) || {}).name || "", c.againstInv, c.reason, -c.sub, -c.gst, -c.total]);
    });
    rows.push([]);
    rows.push(["Summary for GSTR-3B"]);
    rows.push(["Taxable value of supplies", f.revenue]);
    rows.push(["Output tax", f.outTax]);
    rows.push(["Input tax credit on expenses", f.inTax]);
    rows.push(["Net GST payable", f.netTax]);
    rows.push(["HSN / SAC", (db.settings || {}).sac || "998365"]);
    downloadCsv("gst-return-" + stamp + ".csv", rows);
  };

  const repPnl = () => {
    const rows = head("Profit & loss");
    rows.push(["INCOME"]);
    rows.push(["Campaign revenue (excluding GST)", f.revenue]);
    rows.push([]);
    rows.push(["DIRECT COSTS"]);
    rows.push(["Driver & staff wages", f.wages]);
    ["Diesel", "Flex printing", "Fabrication", "Tolls & parking"].forEach(c => {
      if (f.byCat[c]) rows.push([c, f.byCat[c]]);
    });
    rows.push(["Workshop & repairs", f.workshop]);
    rows.push(["Total direct costs", f.grossCost]);
    rows.push([]);
    rows.push(["GROSS PROFIT", f.gross]);
    rows.push([]);
    rows.push(["OVERHEADS"]);
    Object.entries(f.byCat).filter(([c]) => !["Diesel", "Flex printing", "Fabrication", "Tolls & parking"].includes(c))
      .sort((a, b) => b[1] - a[1]).forEach(([c, v]) => rows.push([c, v]));
    rows.push(["Total overheads", f.overhead]);
    rows.push([]);
    rows.push(["NET PROFIT", f.net]);
    rows.push([]);
    rows.push(["Note", "Revenue is invoiced value excluding GST, net of credit notes. GST is not income."]);
    downloadCsv("profit-and-loss-" + stamp + ".csv", rows);
  };

  const repDayBook = () => {
    const marks = new Set((db.tallyMarks || []).map(m => m.id));
    const rows = head("Day book");
    rows.push(["Date", "Voucher", "Reference", "Party / narration", "Ledger", "Debit", "Credit", "In books"]);
    const ms = {};
    (db.orders || []).length;                       // day book is built month by month
    for (let d = new Date(range.from + "T12:00:00Z"); localDay(d) <= range.to; d.setUTCMonth(d.getUTCMonth() + 1)) {
      ms[d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1)] = true;
    }
    Object.keys(ms).forEach(m => dayBook(db, m)
      .filter(v => v.date >= range.from && v.date <= range.to)
      .forEach(v => v.lines.forEach((l, i) => rows.push([
        i === 0 ? dmy(v.date) : "", i === 0 ? v.type : "", i === 0 ? v.ref : "",
        i === 0 ? v.party + (v.narration ? " — " + v.narration : "") : "",
        l.dr || l.cr, l.dr ? l.amount : "", l.cr ? l.amount : "",
        i === 0 ? (marks.has(v.id) ? "yes" : "no") : "",
      ]))));
    downloadCsv("day-book-" + stamp + ".csv", rows);
  };

  const repFuel = () => {
    const rows = head("Petrol cards").concat([["Vehicle", "Card", "Balance now", "Balance read on", "Recharges in period", "Total recharged"]]);
    (db.fuelCards || []).forEach(c => {
      const txns = (db.fuelTxns || []).filter(t => t.cardId === c.id && t.type === "recharge"
        && String(t.date) >= range.from && String(t.date) <= range.to);
      rows.push([(vehOf(c.vehicleId) || {}).plate || "", c.number || "", cardBalance(c),
                 dmy(c.balanceAt || ""), txns.length, txns.reduce((s, t) => s + (+t.amount || 0), 0)]);
    });
    rows.push([]);
    rows.push(["Every recharge"]);
    rows.push(["Date", "Vehicle", "Card", "Amount"]);
    (db.fuelTxns || []).filter(t => t.type === "recharge" && String(t.date) >= range.from && String(t.date) <= range.to)
      .sort((a, b) => (a.date < b.date ? -1 : 1))
      .forEach(t => {
        const c = (db.fuelCards || []).find(x => x.id === t.cardId) || {};
        rows.push([dmy(t.date), (vehOf(c.vehicleId) || {}).plate || "", c.number || "", +t.amount || 0]);
      });
    downloadCsv("petrol-cards-" + stamp + ".csv", rows);
  };

  const repTds = () => {
    const rows = head("TDS deducted by customers").concat([["Customer", "PAN / GSTIN", "Date", "Invoice", "Received", "TDS"]]);
    const byV = {};
    f.receipts.filter(p => +p.tds > 0).forEach(p => {
      const o = (db.orders || []).find(x => x.id === p.orderId) || {};
      const v = vendorOf(o.vendorId);
      const key = v ? v.id : "_";
      byV[key] = (byV[key] || 0) + (+p.tds || 0);
      rows.push([v ? v.name : "", (v && v.gst) || "", dmy(p.date), o.invNo || "", +p.amount || 0, +p.tds || 0]);
    });
    rows.push([]);
    rows.push(["", "", "", "", "TOTAL TDS", f.tds]);
    downloadCsv("tds-" + stamp + ".csv", rows);
  };

  const repCampaigns = () => {
    const rows = head("Campaign profitability").concat([[
      "Campaign", "Customer", "Period", "Vans", "Duty days", "Revenue", "Wages", "Batta",
      "Production", "Running", "Workshop", "Total cost", "Margin", "Margin %"]]);
    (db.orders || []).forEach(o => {
      const p = campaignPnl(db, o), v = vendorOf(o.vendorId);
      rows.push([o.title || o.no, v ? v.name : "", (o.start || "") + " to " + (o.end || ""),
        (o.vehicleIds || []).length, p.dutyDays, p.revenue, p.wages, p.battas, p.production,
        p.running, p.workshop, p.cost, p.margin,
        p.revenue > 0 ? Math.round((p.margin / p.revenue) * 100) + "%" : ""]);
    });
    downloadCsv("campaign-profit-" + stamp + ".csv", rows);
  };

  const REPORTS = [
    ["Profit & loss", "Income against every cost, down to the net.", repPnl],
    ["GST return", "B2B, B2C and credit notes, with the GSTR-3B summary.", repGst],
    ["Sales register", "Every invoice raised, with its tax split out.", repSales],
    ["Collections", "Money received, and the TDS kept back with it.", repCollections],
    ["Outstanding & ageing", "Who owes what, aged, as at the end date.", repOutstanding],
    ["Customer ledger", "Every document against each customer, with a running balance.", repLedger],

            </select>

          {mode === "quarter" && (

      {mode === "custom" && (

          <F label="To"><input type="date" value={custom.to} onChange={e => setCustom({ ...custom, to: e.target.value })} /></F>

        <div className="vz-stat"><i>Net profit</i><b style={{ fontSize:17, color: f.net >= 0 ? "#178951" : "#E5484D" }}>{inr(f.net)}</b><small>after every cost</small></div>

    return (
      <div className="vz-card" key={a.orderId}

        <div className="vz-row">
          <button className="vz-tapcard" style={{ flex:1 }} onClick={() => onOpenOrder(a.orderId)}>
            <div className="vz-title">{a.v ? a.v.name : "—"}</div>

              {a.o.start && a.o.end ? " · " + dmy(a.o.start) + "–" + dmy(a.o.end) : ""}</div>
          </button>
          <Chip c={a.level === "overdue" ? "c-red" : "c-yellow"}>

        </div>
        <div className="vz-kv"><span>{a.label}</span><b>{dmy(a.dueOn)}</b></div>

        <div className="vz-kv"><span>Received so far</span><b className="vz-money">{inr(a.collected)}</b></div>
        <div className="vz-kv"><span style={{ fontWeight:700, color:"var(--ink)" }}>Short</span>
          <b className="vz-money" style={{ fontSize:15, color:"#B4262A" }}>{inr(a.short)}</b></div>
        <div className="vz-inline" style={{ marginTop:9, flexWrap:"wrap" }}>
          <button className="vz-chip c-green" onClick={() => onRecordPayment(a.orderId, a.milestone === "advance" ? "Advance" : "Part payment")}>Record payment</button>
          {a.v && (a.v.phone || a.v.email) && <button className="vz-chip c-blue" onClick={() => onSend(a)}>Remind customer</button>}
        </div>

    <Sheet title="Payment collection" onClose={onClose}>
      <div className="vz-card" style={{ background:"var(--ink)", borderColor:"var(--ink)", color:"#fff" }}>
        <div className="vz-title" style={{ color:"#fff" }}>We do not run on credit</div>

          50% advance before the vehicles go out, the balance by the campaign's own midpoint —
          never at completion.
        </div>

      {overdue.length > 0 && <div className="vz-eyebrow" style={{ marginTop:14 }}>Overdue — {overdue.length}</div>}
      {overdue.map(Row)}
      {upcoming.length > 0 && <div className="vz-eyebrow" style={{ marginTop:14 }}>Due soon</div>}
      {upcoming.map(Row)}
    </Sheet>
  );
}

function ReceivablesSheet({ db, paidOn, onOpenOrder, onSend, onFollowup, onClose }) {
  const [view, setView] = useState("customer");     // customer | invoice
  const r = receivables(db, paidOn);
  const dueToday = followupsDue(db);
  const dueIds = new Set(dueToday.map(f => f.orderId));

  // Group by customer, worst first — that is the order they get chased in.
  const byVendor = {};
  r.rows.forEach(row => {
    const k = row.v ? row.v.id : "_";
    if (!byVendor[k]) byVendor[k] = { v: row.v, rows: [], due: 0, overdue: 0, oldest: 0 };
    const g = byVendor[k];
    g.rows.push(row); g.due += row.due;
    if (row.daysLeft < 0) { g.overdue += row.due; g.oldest = Math.max(g.oldest, -row.daysLeft); }
  });
  const groups = Object.values(byVendor).sort((a, b) => (b.overdue - a.overdue) || (b.due - a.due));

  const exportCsv = () => {
    const rows = [["Customer", "Invoice No", "Campaign", "Period", "Invoice Date", "Due Date", "Invoiced", "Received", "Credited", "Balance", "Days overdue"]];
    r.rows.forEach(x => rows.push([
      x.v ? x.v.name : "—", x.bill.invNo || "not invoiced", x.o.title || "",
      x.bill.from ? dmy(x.bill.from) + " to " + dmy(x.bill.to) : "",
      dmy(x.bill.date || ""), dmy(x.dueOn), x.bill.total, x.paid, x.credited || 0, x.due, x.daysLeft < 0 ? -x.daysLeft : 0,
    ]));
    rows.push([]);
    rows.push(["", "", "", "", "", "TOTAL", "", "", "", r.total, ""]);
    AGE_BUCKETS.forEach(b => rows.push(["", "", "", "", "", b.label, "", "", "", r.buckets[b.k], ""]));
    downloadCsv("receivables-" + today() + ".csv", rows);
  };

  return (
    <Sheet title="Pending from customers" onClose={onClose}>
      <div className="vz-grid" style={{ marginBottom:6 }}>
        <div className="vz-stat"><i>Total pending</i><b style={{ fontSize:17 }}>{inr(r.total)}</b><small>{r.rows.length} invoice{r.rows.length === 1 ? "" : "s"}</small></div>
        <div className="vz-stat"><i>Overdue</i><b style={{ fontSize:17, color: r.overdue ? "#E5484D" : "#178951" }}>{inr(r.overdue)}</b><small>past the agreed date</small></div>
      </div>

      {dueToday.length > 0 && (
        <div className="vz-card" style={{ background:"#FFF9E6", borderColor:"#F5DFA0" }}>
          <div className="vz-title" style={{ fontSize:15 }}>

          <div className="vz-meta" style={{ marginTop:2 }}>
            {dueToday.slice(0, 4).map(f => {
              const v = (db.vendors || []).find(x => x.id === f.vendorId);
              return (v ? v.name : "a customer") + (f.nextOn < today() ? " (" + dmy(f.nextOn) + ")" : "");
            }).join(" · ")}
          </div>
        </div>
