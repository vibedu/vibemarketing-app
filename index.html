/* ===== Tablets =====================================================
   The base UI is sized for phones, so on a big screen everything looks tiny.
   Zoom the whole interface up uniformly (text, padding, icons) rather than
   re-sizing dozens of elements. max-width is kept small enough that
   width × zoom never exceeds the screen, so there is no sideways scroll.
   These rules live at the END of the stylesheet so they win the cascade. */
@media (min-width:700px){
  /* The dark header and bottom nav run edge to edge like on a phone, while the
     content inside them stays in a centred --col column. */
  .vz { zoom:1.28; --z:1.28; --col:540px; max-width:none; }
  .vz-topline, .vz-body { max-width:var(--col); margin-left:auto; margin-right:auto; }
  .vz-nav { max-width:none; padding-left:calc(50% - var(--col) / 2); padding-right:calc(50% - var(--col) / 2); }
  .vz-grid { grid-template-columns:repeat(4,1fr); }
  /* ...but not inside a sheet. A sheet is narrower than the page, so forcing
     four tiles into it pushed the panel sideways and left every reader of the
     GST and report screens dragging a horizontal scrollbar. Let them wrap. */
  .vz-sheet .vz-grid { grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); }
  /* Forms: keep them at a comfortable entry width and centre the sheet, so
     fields don't stretch into wide boxes with the text stranded on the left. */
  .vz-scrim { align-items:center; }
  .vz-sheet { max-width:400px; border-radius:16px; max-height:calc(88vh / var(--z, 1)); }
  .vz-logincard { max-width:360px; width:100%; margin-left:auto; margin-right:auto; }
  .vz-authwrap { max-width:380px; width:100%; margin-left:auto; margin-right:auto; }
}
/* Larger tablets: room for a bigger zoom (540 × 1.5 = 810 ≤ 840, so still no overflow). */
@media (min-width:840px){
  .vz { zoom:1.5; --z:1.5; }
}

/* ---------------------------- desktop ----------------------------
   Above this width the phone app stops being a phone app. Zooming a
   480px column up to fill a monitor is fine for a driver checking one
   number; it is no way to spend a morning on a ledger. The markup does
   not change — the nav becomes a rail down the side, the content gets
   the width it needs, and sheets open as windows rather than something
   slid up from the bottom of a thumb. */
@media (min-width:1000px){
  .vz {
    zoom:1; --z:1; --col:100%;
    max-width:none; padding-bottom:0; padding-left:236px; min-height:100vh;
  }
  /* The bottom bar becomes the side rail. */
  .vz-nav {
    top:0; bottom:0; left:0; right:auto; width:236px;
    flex-direction:column; align-items:stretch; gap:2px;
    max-width:none; margin:0; padding:96px 14px 20px;
  }
  .vz-nav button {
    flex:none; flex-direction:row; justify-content:flex-start; align-items:center; gap:12px;
    font-size:12.5px; letter-spacing:.6px; padding:11px 14px; border-radius:9px;
    transition:background .12s ease, color .12s ease;
  }
  .vz-nav button:hover { background:rgba(255,255,255,.07); color:#DCE3F0; }
  .vz-nav button[data-on="1"] { background:rgba(255,198,41,.14); }
  .vz-nav svg { width:17px; height:17px; }

  /* The brand sits at the top of the rail; the header keeps the page title,
     the alerts and the account controls over the content. */
  .vz-top { padding:18px 32px 16px; }
  .vz-topline, .vz-body { max-width:1180px; margin-left:0; margin-right:0; }
  .vz-body { padding:22px 32px 60px; max-width:1180px; }

  /* Four stat tiles across, and cards that use the room instead of stacking
     into a narrow ribbon down the middle of a wide screen. */
  .vz-grid { grid-template-columns:repeat(4,1fr); gap:14px; }
  .vz-stat b { font-size:22px; }
  .vz-eyebrow { font-size:11px; margin:26px 0 10px; }

  /* Sheets become centred windows. Reports and ledgers need the width. */

  .vz-sheet {
    max-width:820px; border-radius:14px; max-height:88vh; padding:10px 26px 30px;
    box-shadow:0 24px 60px rgba(10,14,24,.35);
  }
  .vz-sheethd { margin:0 -26px 16px; padding:6px 22px 12px; }
  .vz-handle { display:none; }

}

const roleOf = (u) => ROLES[u && u.role] || ROLES["Field manager"];
const addMonths = (iso, n) => {
  const p = String(iso || today()).slice(0, 10).split("-").map(Number);
  let y = p[0], mo = p[1] - 1 + n;
  y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12;
  const last = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
  return y + "-" + pad2(mo + 1) + "-" + pad2(Math.min(p[2], last));
};
const addDays = (iso, n) => {
  const d = new Date(String(iso || today()).slice(0, 10) + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};
const alertsFor = (vehicles, settings, snoozes) => {
  const early = +settings.leadEarly || 30, final = +settings.leadFinal || 7;
  const out = [];
  vehicles.forEach(v => DOCS.forEach(doc => {
    const due = v[doc.k];
    if (!due) return;
    const days = daysTo(due);
    if (days === null || days > early) return;
    const key = v.id + ":" + doc.k;
    if (snoozes && snoozes[key] && daysTo(snoozes[key]) > 0) return;
    out.push({ key, vehId: v.id, plate: v.plate, doc, due, days,
      level: days < 0 ? "overdue" : days <= final ? "final" : "early" });
  }));
  return out.sort((a, b) => a.days - b.days);
};

/* A two-tone chime for the payment rule \u2014 the one alert in the app that is
   meant to be heard, not just seen, because a badge nobody looks at is not
   how "we do not run on credit" gets enforced. Plain Web Audio, no asset to
   load. Browsers block audio before the page has had any click/tap; that
   failure is silent and harmless \u2014 the red card on screen still says it. */
const playAlertChime = () => {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const t0 = ctx.currentTime;
    [880, 660, 880].forEach((freq, i) => {
      const start = t0 + i * 0.16;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.32, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.14);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start + 0.15);
    });
    setTimeout(() => { try { ctx.close(); } catch (e) {} }, 900);
  } catch (e) {}
};

/* Advance is only what was actually asked for. `+o.advancePct || 50` treated 0 as
   missing, because zero is falsy in JS, so a customer quoted no advance was still
   billed for half the job up front. Blank means no advance too — a new campaign
   starts at 50%, and clearing it is a deliberate "none". */
const advanceRate = (o) => {
  const raw = o && o.advancePct;
  if (raw === "" || raw === null || raw === undefined || isNaN(+raw)) return 0;
  return Math.min(100, Math.max(0, +raw));
};

const orderMath = (o) => {
  // Day-wise campaigns are quoted for a number of days with no fixed dates,
  // so the typed day count wins over anything left in the date fields.
  const days = o.dayWise
    ? (+o.days || 0)
    : (spanDays(o.start, o.end) || (+o.days || 0) || ((+o.months || 0) * 30));
  const base = Math.round((+o.vehicles || 0) * (+o.rate || 0) * days);
  const extras = (+o.fabrication || 0) + (+o.flex || 0);
  /* Outstation running is quoted as a rate but not charged up front: at quoting
     time nobody knows how far the vans will actually go. The kilometres are
     filled in once the campaign has run, and only then does it join the bill —
     so the same figures serve the quotation and the final invoice. */
  const outKm = +o.outKm || 0;
  // Falls back to the standing rate: typing the kilometres means the customer
  // is being charged for them, and a campaign with no rate of its own would
  // otherwise bill the running at zero.
  const outRate = +o.outRate || (outKm > 0 ? OUT_RATE_DEFAULT : 0);
  const outstation = Math.round(outRate * outKm);
  const sub = base + extras + outstation;
  const gst = o.gst ? Math.round(sub * 0.18) : 0;
  /* Out-of-state customers are charged the same 18%, but as one IGST line
     instead of the CGST/SGST pair. `igst` is stamped on the campaign from the
     customer's state when it is saved, so every screen that only has the
     campaign in hand still prints the right tax. */
  const inter = !!o.igst;
  // Split the ONE rounded GST figure, so CGST + SGST always equals the tax charged.
  // Rounding 9% twice independently disagreed with the 18% total on ~half of all subtotals.
  const cgst = inter ? 0 : Math.floor(gst / 2);
  const sgst = inter ? 0 : gst - cgst;
  const igst = inter ? gst : 0;
  const total = sub + gst;
  const pct = advanceRate(o);
  return { base, extras, sub, gst, cgst, sgst, igst, inter, total, days, outRate, outKm, outstation,
           advance: Math.round((total * pct) / 100) };
};

/* A day-wise campaign ("quote for a number of days, no fixed dates") has no
   start or end field to bind anything to — and several places in the app
   need one anyway: when the advance is due, which attendance and expense
   records actually belong to this campaign, whether it overlaps another
   campaign on the same van on a given day. Leaving those checks unguarded
   against a blank start/end used to mean "the whole vehicle's history",
   not "no window" — a day-wise job silently absorbed every duty and every
   un-tagged expense that vehicle ever had, and, going the other way,
   silently diluted a genuinely-dated campaign's own wage share on every
   date it happened to also run on. This gives every campaign a real
   window: its own dates if it has them, otherwise from when it was raised
   for exactly the number of days it was quoted for. */
const effectiveWindow = (o) => {
  const start = (o && o.start) || (o && o.created) || today();
  if (o && o.end) return { start, end: o.end };
  const days = Math.max(1, (o && o.dayWise ? +o.days : 0) || 0) || 1;
  return { start, end: addDays(start, days - 1) };
};

/* photo capture: shrink + burn a GPS/time stamp into the image */
const processShot = (file, lines) =>
  new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 820;
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const x = c.getContext("2d");
      x.drawImage(img, 0, 0, w, h);
      if (lines && lines.length) {
        const fs = Math.max(11, Math.round(w * 0.029));
        const pad = Math.round(fs * 0.8);
        const barH = pad * 2 + lines.length * (fs + 5);
        x.fillStyle = "rgba(10,14,24,.74)";
        x.fillRect(0, h - barH, w, barH);
        x.fillStyle = "#FFC629";
        x.fillRect(0, h - barH, 5, barH);
        lines.forEach((t, i) => {
          x.font = (i === 0 ? "800 " : "500 ") + fs + "px -apple-system, Segoe UI, sans-serif";
          x.fillStyle = i === 0 ? "#FFC629" : "#FFFFFF";
          x.fillText(t, pad + 8, h - barH + pad + fs + i * (fs + 5) - 3);
        });
      }
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.55));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });

/* ---------------------------- formal documents ----------------------------
   A quotation / tax invoice as a real two-page PDF. Page one carries the
   commercial detail; page two the notes, terms, bank details and signature.
   They used to share one page, and the terms ran so long they pushed the
   figures — the part a customer actually reads — down out of sight.

   Each page is drawn on a canvas and then wrapped in a PDF. Canvas because the
   result must be one file that attaches to a WhatsApp chat; hand-written PDF
   because the page layout is fixed, and a PDF library would be a megabyte of
   vendor code to place two pictures. */
const loadImg = (src) => new Promise((res, rej) => {
  const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src;
});

/* The wordmark is white — it was drawn for the dark app header. On a white
   page it would be invisible, so the lettering is repainted in ink and the
   orange megaphone left as it is. Part-transparent edges keep their alpha, so
   the letters stay smooth.

   logo-dark.png, not logo-src.png: only the first is deployed — the second is
   a local working copy and is deliberately kept out of the repo, so on the
   live site it 404'd and the document fell back to plain text. */
let inkLogoCache;
const inkLogo = async () => {
  if (inkLogoCache !== undefined) return inkLogoCache;
  inkLogoCache = null;
  try {
    const img = await loadImg("logo-dark.png");
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    const x = c.getContext("2d");
    x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
    for (let i = 0; i < p.length; i += 4) {
      if (p[i + 3] > 0 && p[i] > 185 && p[i + 1] > 185 && p[i + 2] > 185) { p[i] = 46; p[i + 1] = 46; p[i + 2] = 46; }
    }
    x.putImageData(d, 0, 0);
    inkLogoCache = c;
  } catch (e) {}
  return inkLogoCache;
};

/* Rupees in words, counted the Indian way — lakh and crore, not millions. */
const W_ONES = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten",
  "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
const W_TENS = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
const w99  = (n) => (n < 20 ? W_ONES[n] : W_TENS[Math.floor(n / 10)] + (n % 10 ? " " + W_ONES[n % 10] : ""));
const w999 = (n) => (n < 100 ? w99(n) : W_ONES[Math.floor(n / 100)] + " Hundred" + (n % 100 ? " " + w99(n % 100) : ""));
const rupeesInWords = (amount) => {
  let n = Math.round(Math.abs(+amount || 0));
  if (!n) return "Zero Rupees Only";
  const out = [];
  const cr = Math.floor(n / 10000000); n %= 10000000;
  const la = Math.floor(n / 100000);   n %= 100000;
  const th = Math.floor(n / 1000);     n %= 1000;
  if (cr) out.push(w999(cr) + " Crore");
  if (la) out.push(w999(la) + " Lakh");
  if (th) out.push(w999(th) + " Thousand");
  if (n)  out.push(w999(n));
  return "Indian Rupee " + out.join(" ") + " Only";
};

const PAGE_W = 1240, PAGE_H = 1754;                 /* A4 at 150 dpi */
const DOC_INK = "#2E2E2E", DOC_ORANGE = "#E5601F", DOC_LINE = "#D6D9DE", DOC_MUTE = "#6B7280";
const DOC_FONT = "-apple-system, 'Segoe UI', Roboto, Arial, sans-serif";

const newDocPage = () => {
  const c = document.createElement("canvas");
  c.width = PAGE_W; c.height = PAGE_H;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, PAGE_W, PAGE_H);
  g.textBaseline = "alphabetic";
  const F = (weight, size) => { g.font = weight + " " + size + "px " + DOC_FONT; };
  /* measure with whatever font is set right now, so callers must pick the font first */
  const wrap = (text, maxW) => {
    const out = []; let line = "";
    String(text == null ? "" : text).split(/\s+/).filter(Boolean).forEach(word => {
      const t = line ? line + " " + word : word;
      if (g.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
    });
    if (line) out.push(line);
    return out.length ? out : [""];
  };
  return { c, g, F, wrap };
};

/* The stored terms carry a general "50% advance" line. A quote for a customer
   paying nothing up front, or 30%, would then contradict its own figures — so
   term 2 is rewritten to match this campaign before it is printed. */
const termsForOrder = (s, o) => {
  const pct = advanceRate(o);
  return String(s.invTerms || "").split("\n").map(t => t.trim()).filter(Boolean).map(line => {
    if (!/^2[.)]/.test(line)) return line;
    if (pct <= 0) return "2. No advance is required for this campaign. The full amount is due on or before the last day of the campaign.";
    return "2. An advance of " + pct + "% of the total is payable before the campaign begins; the balance is due on or before the last day of the campaign.";
  });
};

const docPages = async ({ title, s, v, o, m }) => {
  const M = 64, RIGHT = PAGE_W - M;
  const isInvoice = title === "TAX INVOICE";
  const money = (n) => Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const logo = await inkLogo();
  const docNo = o.invNo || o.no || "";
  const docNoLabel = (isInvoice ? "Invoice# " : "Quotation# ") + docNo;

  const footer = (g, n) => {
    g.fillStyle = DOC_ORANGE; g.fillRect(0, PAGE_H - 9, PAGE_W, 9);
    g.textAlign = "center"; g.fillStyle = DOC_MUTE;
    g.font = "500 17px " + DOC_FONT;
    g.fillText((s.company || "Vibe Marketing") + "   ·   " + CONTACT.phone + "   ·   Page " + n + " of 2", PAGE_W / 2, PAGE_H - 32);
  };

  /* ============================ page 1 — the quote ============================ */
  const P1 = newDocPage(), g = P1.g, F = P1.F, wrap = P1.wrap;
  let y = 64;

  if (logo) {
    const lw = 580, lh = Math.round(lw * logo.height / logo.width);
    g.drawImage(logo, M, y, lw, lh);
    y += lh + 20;
  } else {
    g.textAlign = "left"; g.fillStyle = DOC_INK; F("800", 36);
    g.fillText((s.company || "Vibe Marketing").toUpperCase(), M, y + 32); y += 62;
  }

  g.textAlign = "left"; g.fillStyle = DOC_MUTE; F("500", 19);
  [].concat(
    wrap(s.address || "", 500),
    s.gstin ? ["GSTIN " + s.gstin] : [],
    ["Mob: " + CONTACT.phone],
    [CONTACT.email || ""],
    [s.website || ""]
  ).filter(Boolean).forEach(l => { g.fillText(l, M, y); y += 25; });
  const leftEnd = y;

  g.textAlign = "right";
  g.fillStyle = DOC_ORANGE; F("800", 54);
  g.fillText(isInvoice ? "TAX INVOICE" : "QUOTATION", RIGHT, 132);
  g.fillStyle = DOC_INK; F("600", 23);
  g.fillText(docNoLabel, RIGHT, 176);

  y = Math.max(leftEnd + 14, 216);
  g.strokeStyle = DOC_LINE; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(M, y); g.lineTo(RIGHT, y); g.stroke();
  y += 42;

  /* ---- who it is for ---- */
  g.textAlign = "left";
  g.fillStyle = DOC_ORANGE; F("800", 19); g.fillText("BILL TO", M, y); y += 33;
  g.fillStyle = DOC_INK; F("800", 27); g.fillText(v ? v.name : "—", M, y); y += 31;
  F("500", 20); g.fillStyle = DOC_MUTE;
  [v && v.person ? "Attn: " + v.person : "",
   v && v.area ? v.area : "",
   v && v.phone ? "Mob: " + v.phone : "",
   v && v.gst ? "GSTIN " + v.gst : ""].filter(Boolean).forEach(l => { g.fillText(l, M, y); y += 25; });
  y += 20;

  g.fillStyle = DOC_INK; F("600", 20);
  // Place of supply is the customer's state, and it is what decides IGST vs CGST+SGST.
  const pos = stateOf(v).split("-");
  g.fillText("Place of supply: " + (pos[1] || "Tamil Nadu") + " (" + pos[0] + ")", M, y); y += 36;
  g.fillStyle = DOC_MUTE; F("700", 18); g.fillText("SUBJECT", M, y); y += 28;
  g.fillStyle = DOC_INK; F("500", 21);
  wrap(o.title || "Mobile Van Advertising campaign", RIGHT - M).forEach(l => { g.fillText(l, M, y); y += 27; });
  y += 24;

  /* ---- the four facts a customer checks first ---- */
  const validTill = (() => {
    const d = new Date(o.invDate || o.created || today());
    if (isNaN(d.getTime())) return "—";
    d.setDate(d.getDate() + 15);
    return dmy(localDay(d));
  })();
  const meta = [
    [isInvoice ? "Invoice Date" : "Quotation Date", dmy(o.invDate || o.created || today())],
    // An invoice with no date on it is an invoice nobody chases. Print the date
    // the customer's own credit terms make it due.
    [isInvoice ? "Payment Due" : "Valid Till",
     isInvoice ? (creditDaysOf(v) > 0 ? dmy(dueDateOf(o, v)) + " (" + creditDaysOf(v) + " days)" : dmy(dueDateOf(o, v)))
               : validTill],
    ["Campaign Days", m.days + " day(s)"],
    ["Period", (o.dayWise || !o.start || !o.end) ? "Not specified" : dmy(o.start) + " to " + dmy(o.end)],
  ];
  const cw = (RIGHT - M) / 4;
  g.fillStyle = "#F2F3F5"; g.fillRect(M, y, RIGHT - M, 44);
  g.strokeStyle = DOC_LINE; g.lineWidth = 1;
  g.strokeRect(M, y, RIGHT - M, 92);
  g.beginPath(); g.moveTo(M, y + 44); g.lineTo(RIGHT, y + 44); g.stroke();
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(M + i * cw, y); g.lineTo(M + i * cw, y + 92); g.stroke(); }
  g.textAlign = "left";
  meta.forEach((r, i) => {
    g.fillStyle = DOC_MUTE; F("700", 17); g.fillText(r[0].toUpperCase(), M + i * cw + 14, y + 28);
    g.fillStyle = DOC_INK;  F("600", 20); g.fillText(r[1], M + i * cw + 14, y + 75);
  });
  y += 92 + 36;

  /* ---- what is being charged ---- */
  /* Vehicles and days get a column each rather than one "1 × 10" cell — the
     customer is buying so many vans for so many days, and each number is
     worth reading on its own. */
  /* Vehicle and Days hold small counts, so they are kept narrow; the money
     columns get the room instead — a six-figure rate has to fit. */
  const cx = [M, M + 52, 606, 734, 820, 898, 1024, RIGHT];
  const TH = 50;
  g.fillStyle = "#3A3A3A"; g.fillRect(M, y, RIGHT - M, TH);
  g.fillStyle = "#fff"; F("700", 19);
  g.textAlign = "left";   g.fillText("#", cx[0] + 18, y + 32); g.fillText("Item & Description", cx[1] + 14, y + 32);
  g.textAlign = "center"; g.fillText("HSN/SAC", (cx[2] + cx[3]) / 2, y + 32);
                          g.fillText("Vehicle", (cx[3] + cx[4]) / 2, y + 32);
                          g.fillText("Days",    (cx[4] + cx[5]) / 2, y + 32);
  g.textAlign = "right";  g.fillText("Rate",   cx[6] - 14, y + 32);
                          g.fillText("Amount", cx[7] - 14, y + 32);
  y += TH;

  const area = (o.route || "").split("→")[0].split("-")[0].trim() || "Coimbatore";
  const items = [{
    name: "Mobile Van Advertising",
    sub: [o.route ? "Route: " + o.route : "Area: " + area],
    sac: s.sac || "998365",
    veh: String(o.vehicles || 0), days: String(m.days),
    rate: money(o.rate), amt: money(m.base),
  }];
  if (m.extras > 0) items.push({
    name: "Flex printing & fabrication", sub: [], sac: s.sacFlex || "998912",
    veh: String(o.vehicles || 1), days: "—", rate: money(m.extras), amt: money(m.extras),
  });
  /* The kilometres are only known after the campaign, so this line appears on
     the final invoice and never on the quotation. */
  if (m.outstation > 0) items.push({
    name: "Extra kilometres run — outstation",
    sub: ["Total " + m.outKm + " km × " + inr(m.outRate) + " per kilometre"],
    sac: s.sac || "998365", veh: "—", days: "—",
    rate: money(m.outRate), amt: money(m.outstation),
  });

  items.forEach((it, idx) => {
    F("500", 18);
    const subLines = it.sub.reduce((a, t) => a.concat(wrap(t, cx[2] - cx[1] - 28)), []);
    const h = Math.max(60, 44 + subLines.length * 24 + 10);
    g.strokeStyle = DOC_LINE; g.lineWidth = 1;
    g.strokeRect(M, y, RIGHT - M, h);
    for (let i = 1; i < 7; i++) { g.beginPath(); g.moveTo(cx[i], y); g.lineTo(cx[i], y + h); g.stroke(); }
    g.fillStyle = DOC_INK; F("600", 21); g.textAlign = "left";
    g.fillText(String(idx + 1), cx[0] + 18, y + 36);
    g.fillText(it.name, cx[1] + 14, y + 36);
    g.fillStyle = DOC_MUTE; F("500", 18);
    subLines.forEach((l, i) => g.fillText(l, cx[1] + 14, y + 36 + 26 + i * 24));
    g.fillStyle = DOC_INK; F("500", 20);
    g.textAlign = "center"; g.fillText(it.sac,  (cx[2] + cx[3]) / 2, y + 36);
                            g.fillText(it.veh,  (cx[3] + cx[4]) / 2, y + 36);
                            g.fillText(it.days, (cx[4] + cx[5]) / 2, y + 36);
    g.textAlign = "right";
    g.fillText(it.rate, cx[6] - 14, y + 36);
    F("600", 20); g.fillText(it.amt, cx[7] - 14, y + 36);
    y += h;
  });
  y += 30;

  /* Outstation warning, boxed and in bold on page one. It belongs in the terms,
     but the terms are on page two and go unread — and a customer who first
     hears about extra running when the invoice arrives is a customer in an
     argument. So it is part of the quotation layout: it prints on every one,
     Coimbatore or not, at this campaign's rate or the standing rate. On the
     invoice it gives way to the actual charge in the table above. */
  const noteRate = quotedOutRate(o, s);
  if (!isInvoice && noteRate > 0) {
    const inner = RIGHT - M - 28;
    F("700", 20);
    const note = "For outstation campaigns (outside Coimbatore), transport is charged extra at "
      + inr(noteRate) + " per kilometre. The kilometres run are measured after the campaign "
      + "and billed in the final invoice.";
    const lines = wrap(note, inner);
    const bh = lines.length * 28 + 26;
    g.fillStyle = "#FFF6EC"; g.fillRect(M, y, RIGHT - M, bh);
    g.strokeStyle = DOC_INK; g.lineWidth = 2; g.strokeRect(M, y, RIGHT - M, bh);
    g.fillStyle = DOC_INK; F("700", 20); g.textAlign = "left";
    lines.forEach((l, i) => g.fillText(l, M + 14, y + 32 + i * 28));
    y += bh + 26;
  }

  /* ---- totals, stacked on the right where the eye goes ---- */
  const tl = 700;
  const totRow = (label, val, opt) => {
    const o2 = opt || {}, h = o2.h || 46;
    if (o2.fill) { g.fillStyle = o2.fill; g.fillRect(tl, y, RIGHT - tl, h); }
    g.strokeStyle = DOC_LINE; g.lineWidth = 1; g.strokeRect(tl, y, RIGHT - tl, h);

/* Wrap the drawn pages in a PDF: one full-page JPEG per page. Offsets are
   counted in bytes as the file is built, because the cross-reference table at
   the end has to point at each object exactly. */
const jpegBytes = (dataUrl) => {
  const bin = atob(dataUrl.slice(dataUrl.indexOf(",") + 1));
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
};

const pdfFromPages = (pages) => {
  const PT_W = 595.28, PT_H = 841.89;              /* A4 in points */
  const enc = new TextEncoder();
  const parts = []; let len = 0;
  const put = (d) => { const b = typeof d === "string" ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const off = {};
  const obj = (n, dict, stream) => {
    off[n] = len;
    put(n + " 0 obj\n" + dict + "\n");
    if (stream) { put("stream\n"); put(stream); put("\nendstream\n"); }
    put("endobj\n");
  };

  put("%PDF-1.4\n");
  put(new Uint8Array([37, 226, 227, 207, 211, 10]));   /* marks the file as binary */
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Count " + pages.length + " /Kids ["
        + pages.map((_, i) => (3 + i * 3) + " 0 R").join(" ") + "] >>");
  pages.forEach((p, i) => {
    const pg = 3 + i * 3, ct = pg + 1, im = pg + 2;
    const content = "q " + PT_W.toFixed(2) + " 0 0 " + PT_H.toFixed(2) + " 0 0 cm /Im0 Do Q";
    const bytes = jpegBytes(p.url);
    obj(pg, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PT_W.toFixed(2) + " " + PT_H.toFixed(2) + "]"
          + " /Resources << /XObject << /Im0 " + im + " 0 R >> >> /Contents " + ct + " 0 R >>");
    obj(ct, "<< /Length " + content.length + " >>", content);
    obj(im, "<< /Type /XObject /Subtype /Image /Width " + p.w + " /Height " + p.h
          + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + bytes.length + " >>", bytes);
  });

  const startxref = len;
  const total = 3 + pages.length * 3;                 /* objects 1..n, plus the free entry 0 */
  let x = "xref\n0 " + total + "\n0000000000 65535 f \n";
  for (let n = 1; n < total; n++) x += String(off[n] || 0).padStart(10, "0") + " 00000 n \n";
  x += "trailer\n<< /Size " + total + " /Root 1 0 R >>\nstartxref\n" + startxref + "\n%%EOF\n";
  put(x);

  return new Blob(parts, { type: "application/pdf" });
};

const getFix = () =>
  new Promise((resolve) => {
    if (!navigator.geolocation) return resolve({ ok: false, why: "This device has no location service." });
    const t = setTimeout(() => resolve({ ok: false, why: "Location timed out. Move to open sky and retry." }), 9000);
    navigator.geolocation.getCurrentPosition(
      (p) => { clearTimeout(t); resolve({ ok: true, lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5), acc: Math.round(p.coords.accuracy) }); },
      (e) => { clearTimeout(t); resolve({ ok: false, why: e.code === 1 ? "Location permission denied. Allow it to stamp the photo." : "Could not get a fix. Type the landmark instead." }); },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
    );
  });

const mapLink = (lat, lng) => "https://maps.google.com/?q=" + lat + "," + lng;

/* Hand the PDF to the phone's share sheet — WhatsApp, mail, anything. No text
   goes with it: the document says everything, and a message repeating it under
   the attachment just made the chat noisy. */
const sharePdf = async (blob, filename) => {
  try {
    const file = new File([blob], filename || "document.pdf", { type: "application/pdf" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      return true;
    }
  } catch (e) {}
  return false;
};

const savePdf = (blob, filename) => {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename || "document.pdf";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  // Let the download start before the URL is thrown away.
  setTimeout(() => URL.revokeObjectURL(url), 20000);
};

/* share the stamped photo itself through the phone's share sheet (WhatsApp, etc.) */
const sharePhoto = async (dataUrl, text) => {
  try {
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const file = new File([blob], "vibe-proof.jpg", { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text });
      return true;
    }
  } catch (e) {}
  return false;
};

// Compute which reminders are due today: festival milestones + overdue general nudges.
const remindersDue = (db) => {
  const vendors = (db.vendors || []).filter(v => (v.phone || v.email));
  const log = db.reminderLog || {};
  const festival = [];
  (db.occasions || []).filter(o => o.active && o.date).forEach(occ => {
    // Festivals come round every year. Once the date passes, roll it forward so
    // Diwali keeps generating reminders instead of going quiet after 2026.
    let when = String(occ.date).slice(0, 10);
    let left = daysTo(when);
    let year = +when.slice(0, 4);
    for (let i = 0; i < 5 && left != null && left < 0; i++) {
      year += 1;
      when = year + when.slice(4);
      left = daysTo(when);
    }
    if (left == null || left < 0) return;
    const offsets = (occ.offsets && occ.offsets.length ? occ.offsets : [60, 45, 30, 15]);
    // A milestone is "due" from its day until the next milestone (so a missed day still shows).
    const hit = offsets.filter(o => left <= o).sort((a, b) => a - b)[0]; // smallest offset >= left
    if (hit == null) return;
    vendors.forEach(v => {
      // Year is part of the key so the same festival can fire again next year.
      const key = v.id + "|" + occ.id + "|" + year + "|" + hit;
      if (log[key]) return;
      festival.push({ kind: "occasion", key, vendor: v, occ: { ...occ, date: when }, daysLeft: left, milestone: hit });
    });
  });
  const gapDays = +(db.settings && db.settings.serviceReminderDays) || 90;
  const service = [];
  vendors.forEach(v => {
    const last = log["svc|" + v.id];
    const overdue = !last || (daysTo(last) != null && Math.abs(daysTo(last)) >= gapDays);
    if (overdue) service.push({ kind: "service", key: "svc|" + v.id, vendor: v });
  });
  return { festival, service };
};

/* Full-screen photo viewer — licence scans, driver faces, field proofs.
   Deliberately plain DOM rather than React state: every photo lives inside some
   other sheet, and this has to sit above all of them without each one having to
   carry a viewer of its own.

   Not window.open(): the photos are data: URLs, and browsers refuse to open one
   as a page, so tapping a licence used to give you a blank white screen. */
const viewImage = (src, caption) => {
  if (!src) return;
  const wrap = document.createElement("div");
  wrap.className = "vz-viewer";
  const img = document.createElement("img");
  img.src = src;
  img.alt = caption || "";
  const bar = document.createElement("div");
  bar.className = "vz-viewer-bar";
  bar.innerHTML = '<span></span><button type="button" aria-label="Close">Close</button>';
  bar.firstChild.textContent = caption || "";
  wrap.appendChild(bar);
  wrap.appendChild(img);
  document.body.appendChild(wrap);
  document.body.style.overflow = "hidden";

  const shut = () => {
    if (!wrap.parentNode) return;
    wrap.remove();
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onKey);
  };
  const onKey = (e) => { if (e.key === "Escape") shut(); };
  // Tapping the photo itself shouldn't close it — people pinch to zoom on the
  // licence number, and a stray finger would otherwise dismiss it.
  img.addEventListener("click", (e) => e.stopPropagation());
  wrap.addEventListener("click", shut);
  document.addEventListener("keydown", onKey);
};

const API_BASE = "/api";

// Admin session token (from a server login). Sent so the server hands over the

let ADMIN_TOKEN = "";
let onAuthFail = null; // called when the server rejects the admin token (expired/invalid)
const setAdminToken = (t) => { ADMIN_TOKEN = t || ""; };
const apiPost = async (path, data) => {
  try {
    const r = await fetch(API_BASE + "/" + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Api-Key": API_KEY, "X-Admin-Token": ADMIN_TOKEN },

/* ---- outbox -------------------------------------------------------------
   A van is often out of signal. Driver writes used to be fired once and the
   failure swallowed, so the office simply never saw that shift. Anything
   critical now goes through here: it is kept on the device until the server
   confirms it, and retried whenever we are online again. */
const OUTBOX_KEY = "vibe-outbox-v1";
const outboxRead = () => { try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || "[]"); } catch (e) { return []; } };
const outboxWrite = (list) => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list.slice(-200))); } catch (e) {} };
let outboxRunning = false;

const queuePost = async (path, data) => {
  const res = await apiPost(path, data);
  if (res && !res.error) return res;                 // went through first time
  const q = outboxRead();
  q.push({ id: Math.random().toString(36).slice(2), path, data, at: Date.now(), tries: 1 });
  outboxWrite(q);
  return null;
};

const flushOutbox = async () => {
  if (outboxRunning || !navigator.onLine) return;
  let q = outboxRead();
  if (!q.length) return;
  outboxRunning = true;
  const keep = [];
  for (const item of q) {
    const res = await apiPost(item.path, item.data);
    if (res && !res.error) continue;                 // delivered — drop it
    // Give up only after ~3 days of failures so nothing is lost to a bad week.
    if (item.tries >= 200 || Date.now() - item.at > 3 * 24 * 3600 * 1000) continue;
    keep.push({ ...item, tries: (item.tries || 1) + 1 });
  }
  outboxWrite(keep);
  outboxRunning = false;
};
const apiGet = async (path) => {
  try {
    const sep = path.includes("?") ? "&" : "?";
    const r = await fetch(API_BASE + "/" + path + sep + "key=" + encodeURIComponent(API_KEY), { headers: { "X-Admin-Token": ADMIN_TOKEN } });
    if (r.status === 401) { if (onAuthFail) onAuthFail(); return null; }
    return await r.json();
  } catch (e) { return null; }
};

/* Records created before sync existed have no updatedAt. Stamp them once, well
   in the past, so the first sync uploads them but any later edit — here or on
   another device — still wins over them. */
const stampForSync = (d) => {
  const base = "2000-01-01T00:00:00.000Z";
  let touched = false;
  const out = { ...d };
  Object.keys(SYNC_KEYS).forEach(key => {
    const list = out[key] || [];
    if (list.some(r => r && !r.updatedAt)) {
      out[key] = list.map(r => (r && !r.updatedAt ? { ...r, updatedAt: base } : r));
      touched = true;
    }
  });
  return touched ? out : d;
};

/* Number plates padded to one shape: state, district, series, number each in a
   fixed-width column. Registrations vary — "TN 66 E 7101" has a one-letter
   series where "TN 38 AM 4378" has two — so without this the groups sit at
   different places on every line and the list reads as ragged.
   Display only; the plate itself is never changed. */
const platePad = (plate) => {
  const p = String(plate || "").trim().toUpperCase().split(/\s+/);
  if (p.length !== 4) return String(plate || "");   // unusual format — leave it be
  return p[0] + " " + p[1].padStart(2) + " " + p[2].padEnd(2) + " " + p[3].padStart(4);
};

function OrderForm({ init, vendors, settings = {}, onSave, onClose }) {
  const [f, set] = useState(init || {
    title:"", vendorId: vendors[0]?.id || "", vehicles:1, rate:1900, months:0,
    fabrication:0, flex:0, gst:true, advancePct:50, start:today(), end:"", route:"", stage:"Proforma", vehicleIds:[], sends:[],
    // Left blank on purpose: every quotation states the standing rate anyway,
    // so this is only filled in to quote one customer something different.
    outRate: "",
  });
  const u = (k) => (e) => set({ ...f, [k]: e.target.value });
  // Money and counts can't be negative, and an advance over 100% would ask for
  // more than the job is worth. Clamp on entry rather than letting it reach an invoice.
  const num = (k, { min = 0, max = Infinity } = {}) => (e) => {
    const raw = e.target.value;
    if (raw === "") return set({ ...f, [k]: "" });
    const n = Math.min(max, Math.max(min, Math.floor(Number(raw) || 0)));
    set({ ...f, [k]: n });
  };
  const m = orderMath(f);
  const stdOutRate = +settings.outRateDefault || OUT_RATE_DEFAULT;
  return (
    <Sheet title={init ? "Edit campaign" : "New campaign"} onClose={onClose}>
      <F label="Campaign name"><input value={f.title} onChange={u("title")} placeholder="Aadi offer 25%" /></F>
      <F label="Vendor"><select value={f.vendorId} onChange={u("vendorId")}>{vendors.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}</select></F>
      <div className="vz-2">
        <F label="Vehicles"><input type="number" value={f.vehicles} onChange={num("vehicles")} inputMode="numeric" min="0" /></F>
        <F label="Rate / vehicle / day"><input type="number" value={f.rate} onChange={num("rate")} inputMode="numeric" min="0" /></F>
      </div>
      <label className="vz-check">
        <input type="checkbox" checked={!!f.dayWise} onChange={(e) => set({ ...f, dayWise: e.target.checked })} />
        Day wise — quote for a number of days, no fixed dates
      </label>
      <div className="vz-2">
        <F label="Start date"><input type="date" value={f.dayWise ? "" : f.start} onChange={u("start")}
          disabled={!!f.dayWise} placeholder={f.dayWise ? "not specified" : undefined} /></F>
        <F label="End date"><input type="date" value={f.dayWise ? "" : f.end} onChange={u("end")}
          disabled={!!f.dayWise} min={f.start || undefined} /></F>
      </div>
      <div className="vz-2">
        <F label="Days">
          {f.dayWise
            ? <input type="number" inputMode="numeric" value={f.days || ""} autoFocus placeholder="e.g. 10"
                onChange={e => set({ ...f, days: e.target.value.replace(/[^\d]/g, "") })} />
            : <input type="number" value={m.days || ""} readOnly placeholder="pick the dates"
                style={{ background:"#EEF1F6", color:"#12192A", fontWeight:700 }} />}
        </F>
        <F label="Advance %"><input type="number" value={f.advancePct} onChange={num("advancePct", { max: 100 })}
          inputMode="numeric" min="0" max="100" placeholder="0 = no advance" /></F>
      </div>
      <div className="vz-2">
        <F label="Fabrication ₹"><input type="number" value={f.fabrication} onChange={num("fabrication")} inputMode="numeric" min="0" /></F>
        <F label="Flex printing ₹"><input type="number" value={f.flex} onChange={num("flex")} inputMode="numeric" min="0" /></F>
      </div>
      <F label="Billing">
        <select value={f.billing || (vendors.find(v => v.id === f.vendorId) || {}).billing || "end"} onChange={u("billing")}>
          <option value="end">Invoice once, when it finishes</option>
          <option value="monthly">Invoice month by month while it runs</option>
        </select>
      </F>
      <F label="Route / coverage"><input value={f.route} onChange={u("route")} placeholder="Thillai Nagar → Chatram" /></F>

      {/* Outstation running. The rate is only a warning on the quotation; it
          reaches the bill when the kilometres are filled in after the campaign.
          Leave both blank for a Coimbatore campaign and nothing is shown. */}
      <div className="vz-2">
        <F label="Transport charge extra for outstations">
          <input type="number" value={f.outRate === 0 ? "" : (f.outRate ?? "")} onChange={num("outRate")}
            inputMode="numeric" min="0" placeholder={"₹" + stdOutRate + " per km"} />
        </F>
        <F label="Extra km run — final invoice only">
          <input type="number" value={f.outKm === 0 ? "" : (f.outKm ?? "")} onChange={num("outKm")}
            inputMode="numeric" min="0" placeholder="blank while quoting" />
        </F>
      </div>
      <div className="vz-meta" style={{ marginTop:-6 }}>
        Every quotation states {inr(stdOutRate)} per km for outstation running. Fill the
        left box only to quote this customer a different rate.
      </div>
      <label className="vz-check"><input type="checkbox" checked={!!f.gst} onChange={(e) => set({ ...f, gst: e.target.checked })} />Add GST @ 18%</label>
      <div className="vz-card" style={{ background:"#FAFBFC" }}>
        <div className="vz-kv"><span>Duration</span><b>{m.days ? m.days + " days" : "—"}</b></div>
        <div className="vz-kv"><span>Display charges</span><b className="vz-money">{inr(m.base)}</b></div>
        <div className="vz-kv"><span>Fabrication + flex</span><b className="vz-money">{inr(m.extras)}</b></div>
        {m.outRate > 0 && (
          <div className="vz-kv">
            <span>Outstation {m.outKm ? m.outKm + " km × " + inr(m.outRate) : "(₹" + m.outRate + "/km — not billed yet)"}</span>
            <b className="vz-money">{m.outstation ? inr(m.outstation) : "—"}</b>
          </div>
        )}
        <div className="vz-kv"><span>GST</span><b className="vz-money">{inr(m.gst)}</b></div>
        <div className="vz-kv"><span style={{ fontWeight:700, color:"#12192A" }}>Proforma total</span><b className="vz-money" style={{ fontSize:16 }}>{inr(m.total)}</b></div>
        <div className="vz-kv"><span>Advance to start</span><b className="vz-money">{inr(m.advance)}</b></div>
      </div>
      <button className="vz-btn" disabled={!f.title.trim() || m.days <= 0 || (!f.dayWise && (!f.start || !f.end))}
        onClick={() => onSave({ ...f, id: f.id || uid(), days: m.days, months: Math.max(1, Math.round(m.days / 30)),
          start: f.dayWise ? "" : f.start, end: f.dayWise ? "" : f.end })}>
        {init ? "Save changes" : "Raise proforma invoice"}
      </button>
      {(!f.start || !f.end || m.days <= 0) && <div className="vz-meta">Pick a start and end date — the campaign length in days is worked out automatically.</div>}
    </Sheet>
  );
}
