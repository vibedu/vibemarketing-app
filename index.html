/* ===== Tablets =====================================================
   The base UI is sized for phones, so on a big screen everything looks tiny.
   Zoom the whole interface up uniformly (text, padding, icons) rather than
   re-sizing dozens of elements. max-width is kept small enough that
   width × zoom never exceeds the screen, so there is no sideways scroll.
   These rules live at the END of the stylesheet so they win the cascade. */
@media (min-width:700px){
  /* The dark header and bottom nav run edge to edge like on a phone, while the
     content inside them stays in a centred --col column. */
  .vz { zoom:1.28; --z:1.28; --col:540px; max-width:none; }
  .vz-topline, .vz-body { max-width:var(--col); margin-left:auto; margin-right:auto; }
  .vz-nav { max-width:none; padding-left:calc(50% - var(--col) / 2); padding-right:calc(50% - var(--col) / 2); }
  .vz-grid { grid-template-columns:repeat(4,1fr); }
  /* Forms: keep them at a comfortable entry width and centre the sheet, so
     fields don't stretch into wide boxes with the text stranded on the left. */
  .vz-scrim { align-items:center; }
  .vz-sheet { max-width:400px; border-radius:16px; max-height:calc(88vh / var(--z, 1)); }
  .vz-logincard { max-width:360px; width:100%; margin-left:auto; margin-right:auto; }
  .vz-authwrap { max-width:380px; width:100%; margin-left:auto; margin-right:auto; }
}
/* Larger tablets: room for a bigger zoom (540 × 1.5 = 810 ≤ 840, so still no overflow). */
@media (min-width:840px){
  .vz { zoom:1.5; --z:1.5; }
}
/* Big landscape tablets. */
@media (min-width:1100px){
  .vz { zoom:1.7; --z:1.7; --col:560px; }
}
`;

const pad2 = (n) => String(n).padStart(2, "0");
const localDay = (d) => { const x = d ? new Date(d) : new Date(); return x.getFullYear() + "-" + pad2(x.getMonth() + 1) + "-" + pad2(x.getDate()); };
const today = () => localDay();

const dmy = (d) => (d ? String(d).slice(0, 10).split("-").reverse().join("/") : "—");
const daysTo = (d) => {
  if (!d) return null;
  const a = Date.parse(String(d).slice(0, 10) + "T00:00:00Z");
  const b = Date.parse(today() + "T00:00:00Z");
  return Number.isNaN(a) ? null : Math.round((a - b) / 86400000);
};
/* inclusive number of days from start to end (both days counted) */
const spanDays = (s, e) => {
  if (!s || !e) return 0;
  const a = Date.parse(String(s).slice(0, 10) + "T00:00:00Z");
  const b = Date.parse(String(e).slice(0, 10) + "T00:00:00Z");
  if (Number.isNaN(a) || Number.isNaN(b) || b < a) return 0;
  return Math.round((b - a) / 86400000) + 1;
};

const addMonths = (iso, n) => {
  const p = String(iso || today()).slice(0, 10).split("-").map(Number);
  let y = p[0], mo = p[1] - 1 + n;
  y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12;
  const last = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
  return y + "-" + pad2(mo + 1) + "-" + pad2(Math.min(p[2], last));
};
const addDays = (iso, n) => {
  const d = new Date(String(iso || today()).slice(0, 10) + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};
const alertsFor = (vehicles, settings, snoozes) => {
  const early = +settings.leadEarly || 30, final = +settings.leadFinal || 7;
  const out = [];
  vehicles.forEach(v => DOCS.forEach(doc => {
    const due = v[doc.k];
    if (!due) return;
    const days = daysTo(due);
    if (days === null || days > early) return;
    const key = v.id + ":" + doc.k;
    if (snoozes && snoozes[key] && daysTo(snoozes[key]) > 0) return;
    out.push({ key, vehId: v.id, plate: v.plate, doc, due, days,
      level: days < 0 ? "overdue" : days <= final ? "final" : "early" });
  }));
  return out.sort((a, b) => a.days - b.days);
};

const orderMath = (o) => {
  const days = spanDays(o.start, o.end) || (+o.days || 0) || ((+o.months || 0) * 30);
  const base = Math.round((+o.vehicles || 0) * (+o.rate || 0) * days);
  const extras = (+o.fabrication || 0) + (+o.flex || 0);
  const sub = base + extras;
  const gst = o.gst ? Math.round(sub * 0.18) : 0;
  const total = sub + gst;
  return { base, extras, sub, gst, total, days, advance: Math.round((total * (+o.advancePct || 50)) / 100) };
};

/* photo capture: shrink + burn a GPS/time stamp into the image */
const processShot = (file, lines) =>
  new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 820;
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const x = c.getContext("2d");
      x.drawImage(img, 0, 0, w, h);
      if (lines && lines.length) {
        const fs = Math.max(11, Math.round(w * 0.029));
        const pad = Math.round(fs * 0.8);
        const barH = pad * 2 + lines.length * (fs + 5);
        x.fillStyle = "rgba(10,14,24,.74)";
        x.fillRect(0, h - barH, w, barH);
        x.fillStyle = "#FFC629";
        x.fillRect(0, h - barH, 5, barH);
        lines.forEach((t, i) => {
          x.font = (i === 0 ? "800 " : "500 ") + fs + "px -apple-system, Segoe UI, sans-serif";
          x.fillStyle = i === 0 ? "#FFC629" : "#FFFFFF";
          x.fillText(t, pad + 8, h - barH + pad + fs + i * (fs + 5) - 3);
        });
      }
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.55));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });

/* ---------------------------- formal documents ----------------------------
   Draws a quotation / proforma / tax invoice onto a canvas so it can be shared
   straight into WhatsApp as an image, saved, or printed to PDF. Canvas rather
   than HTML because a single image is what actually attaches to a chat. */
const loadImg = (src) => new Promise((res, rej) => {
  const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src;
});

const docImage = async ({ title, s, v, o, m }) => {
  const W = 1240, PAD = 34, INK = "#2E2E2E", ORANGE = "#E5601F", LINE = "#B9B9B9";
  const big = document.createElement("canvas");
  big.width = W; big.height = 3600;
  const g = big.getContext("2d");
  const F = (w, sz) => { g.font = w + " " + sz + "px -apple-system, 'Segoe UI', Roboto, sans-serif"; };
  const wrap = (text, maxW) => {
    const out = []; let line = "";
    String(text || "").split(/\s+/).forEach(word => {
      const t = line ? line + " " + word : word;
      if (g.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
    });
    if (line) out.push(line);
    return out;
  };
  const box = (x1, y1, x2, y2) => { g.strokeStyle = LINE; g.lineWidth = 1.5; g.strokeRect(x1, y1, x2 - x1, y2 - y1); };

  g.fillStyle = "#fff"; g.fillRect(0, 0, W, big.height);
  g.textBaseline = "alphabetic";

  /* ---- dark header: logo centred, then contact lines and GSTIN ---- */
  let y = 0;
  const HDR_TOP = 26;
  let logo = null;
  try { logo = await loadImg("logo-dark.png"); } catch (e) {}
  let hy = HDR_TOP;
  if (logo) { const lw = 470, lh = Math.round(lw * logo.height / logo.width); hy += lh + 18; }
  g.textAlign = "center";
  F("500", 20);
  const addr = wrap(s.address || "", W - 200);
  const contact = "Mob: " + (s.bizPhone || "") + ".  " + (s.website || "") + "  Email: " + (s.bizEmail || "");
  const hdrH = hy + addr.length * 27 + 30 + 40 + 24;
  g.fillStyle = "#2E2E2E"; g.fillRect(0, 0, W, hdrH);
  if (logo) { const lw = 470, lh = Math.round(lw * logo.height / logo.width); g.drawImage(logo, (W - lw) / 2, HDR_TOP, lw, lh); }
  let ty = (logo ? HDR_TOP + Math.round(470 * logo.height / logo.width) + 40 : HDR_TOP + 40);
  g.fillStyle = "#E4E7EC"; F("500", 20);
  addr.forEach(l => { g.fillText(l, W / 2, ty); ty += 27; });
  F("600", 19); g.fillText(contact, W / 2, ty); ty += 34;
  g.fillStyle = "#fff"; F("800", 24); g.fillText("GSTIN: " + (s.gstin || ""), W / 2, ty);
  y = hdrH;

  /* ---- orange title band ---- */
  const bandH = 74;
  g.fillStyle = ORANGE; g.fillRect(0, y, W, bandH);
  g.fillStyle = "#fff"; F("800", 40);
  g.fillText(title, W / 2, y + 52);
  y += bandH;

  /* ---- bill-to / document meta ---- */
  g.textAlign = "left";
  const midX = Math.round(W * 0.56), rowH = 46, metaTop = y;
  const billLines = [
    (v ? v.name : "—") + (v && v.person ? " (" + v.person + ")" : ""),
    v && v.area ? v.area : "",
    v && v.gst ? "GSTIN: " + v.gst : "",
  ].filter(Boolean);
  const metaRows = Math.max(billLines.length + 1, 3);
  const metaH = metaRows * rowH;
  g.fillStyle = ORANGE; F("800", 20); g.fillText("BILL TO", PAD + 12, y + 30);
  g.fillStyle = INK; F("500", 22);
  billLines.forEach((l, i) => g.fillText(l, PAD + 12, y + 30 + (i + 1) * rowH));
  F("800", 22); g.fillStyle = INK;
  g.fillText(title === "TAX INVOICE" ? "Tax Invoice No. :" : "Quotation No. :", midX + 14, y + 30);
  g.fillText("Date:", midX + 14, y + 30 + rowH);
  F("500", 22);
  g.fillText(" " + (o.invNo || o.no || ""), midX + 250, y + 30);
  g.fillText(" " + dmy(o.invDate || o.created || today()), midX + 250, y + 30 + rowH);
  if (o.title) { F("500", 20); g.fillText("Campaign: " + o.title, midX + 14, y + 30 + rowH * 2); }
  box(PAD, metaTop, midX, metaTop + metaH);
  box(midX, metaTop, W - PAD, metaTop + metaH);
  y = metaTop + metaH + 18;

  /* ---- line-item table ---- */
  const cols = [PAD, Math.round(W * 0.55), Math.round(W * 0.655), Math.round(W * 0.79), Math.round(W * 0.885), W - PAD];
  const head = ["DESCRIPTION", "DAYS", "No. Vehicle", "Rate", "TOTAL"];
  const thH = 50;
  g.fillStyle = ORANGE; g.fillRect(PAD, y, W - PAD * 2, thH);
  g.fillStyle = "#fff"; F("800", 20);
  g.textAlign = "left";  g.fillText(head[0], cols[0] + 12, y + 33);
  g.textAlign = "right";
  for (let i = 1; i < 5; i++) g.fillText(head[i], cols[i + 1] - 12, y + 33);
  y += thH;

  const money = (n) => Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const row = (desc, days, veh, rate, total) => {
    const h = 48;
    g.fillStyle = INK; F("500", 22);
    g.textAlign = "left";  g.fillText(desc, cols[0] + 12, y + 32);
    g.textAlign = "right";
    [days, veh, rate, total].forEach((val, i) => g.fillText(val, cols[i + 2] - 12, y + 32));
    box(PAD, y, W - PAD, y + h);
    [cols[1], cols[2], cols[3], cols[4]].forEach(cx => { g.beginPath(); g.moveTo(cx, y); g.lineTo(cx, y + h); g.stroke(); });
    y += h;
  };
  const area = (o.route || "").split("→")[0].split("-")[0].trim() || "Coimbatore";
  row("Vehicle Charges " + area, String(m.days), String(o.vehicles || 0), money(o.rate), money(m.base));
  if (m.extras > 0) row("Regular Flex & Fabrication Work", "0", String(o.vehicles || 1), money(m.extras), money(m.extras));

  /* ---- totals ---- */
  const totRow = (label, value, bold) => {
    const h = 48;
    box(PAD, y, W - PAD, y + h);
    g.beginPath(); g.moveTo(cols[4], y); g.lineTo(cols[4], y + h); g.stroke();
    g.beginPath(); g.moveTo(midX, y); g.lineTo(midX, y + h); g.stroke();
    g.fillStyle = INK; F(bold ? "800" : "600", 22); g.textAlign = "right";
    if (label) g.fillText(label, cols[4] - 12, y + 32);
    F("800", 22); g.fillText(value, W - PAD - 12, y + 32);
    y += h;
  };
  totRow("", money(m.sub), true);
  if (o.gst) { totRow("CGST 9%", money(Math.round(m.sub * 0.09)), false); totRow("SGST 9%", money(Math.round(m.sub * 0.09)), false); }
  totRow("GRAND TOTAL", money(m.total), true);

  /* ---- terms ---- */
  y += 4;
  const secTitle = (t) => { const h = 48; box(PAD, y, W - PAD, y + h); g.fillStyle = INK; F("800", 24); g.textAlign = "left"; g.fillText(t, PAD + 12, y + 32); y += h; };
  secTitle("Terms & Conditions");
  F("500", 21);
  String(s.invTerms || "").split("\n").filter(Boolean).forEach(line => {
    const body = line.replace(/^\s*\d+\.\s*/, "");
    const ls = wrap(body, W - PAD * 2 - 30);
    const h = Math.max(48, ls.length * 30 + 18);
    box(PAD, y, W - PAD, y + h);
    g.fillStyle = INK; F("500", 21); g.textAlign = "left";
    ls.forEach((l, i) => g.fillText(l, PAD + 12, y + 30 + i * 30));
    y += h;
  });

  /* ---- bank details ---- */
  secTitle("Bank details:");
  const bank = [["Bank Name", s.bankName], ["Account Holder Name", s.bankHolder],
                ["Account Number", s.bankAcNo], ["IFSC", s.bankIFSC],
                ["Branch", s.bankBranch], ["Account Type", s.bankAcType]];
  bank.forEach(([k, val]) => {
    const h = 46; box(PAD, y, W - PAD, y + h);
    g.fillStyle = INK; F("800", 21); g.textAlign = "left"; g.fillText(k, PAD + 12, y + 30);
    F("500", 21); g.fillText(": " + (val || ""), PAD + 330, y + 30);
    y += h;
  });

  const h = 52; box(PAD, y, W - PAD, y + h);
  g.fillStyle = INK; F("500", 22); g.textAlign = "center";
  g.fillText("Thank you for your business!", W / 2, y + 34);
  y += h + PAD;

  /* crop to the content we actually drew */
  const out = document.createElement("canvas");
  out.width = W; out.height = y;
  const og = out.getContext("2d");
  og.fillStyle = "#fff"; og.fillRect(0, 0, W, y);
  og.drawImage(big, 0, 0);
  return out.toDataURL("image/jpeg", 0.92);
};

const getFix = () =>
  new Promise((resolve) => {
    if (!navigator.geolocation) return resolve({ ok: false, why: "This device has no location service." });
    const t = setTimeout(() => resolve({ ok: false, why: "Location timed out. Move to open sky and retry." }), 9000);
    navigator.geolocation.getCurrentPosition(
      (p) => { clearTimeout(t); resolve({ ok: true, lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5), acc: Math.round(p.coords.accuracy) }); },
      (e) => { clearTimeout(t); resolve({ ok: false, why: e.code === 1 ? "Location permission denied. Allow it to stamp the photo." : "Could not get a fix. Type the landmark instead." }); },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
    );
  });

const mapLink = (lat, lng) => "https://maps.google.com/?q=" + lat + "," + lng;

const sharePhoto = async (dataUrl, text) => {
  try {
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const file = new File([blob], "vibe-proof.jpg", { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text });
      return true;
    }
  } catch (e) {}
  return false;
};

// Compute which reminders are due today: festival milestones + overdue general nudges.
const remindersDue = (db) => {
  const vendors = (db.vendors || []).filter(v => (v.phone || v.email));
  const log = db.reminderLog || {};
  const festival = [];
  (db.occasions || []).filter(o => o.active && o.date).forEach(occ => {
    const left = daysTo(occ.date);
    if (left == null || left < 0) return;
    const offsets = (occ.offsets && occ.offsets.length ? occ.offsets : [60, 45, 30, 15]);
    // A milestone is "due" from its day until the next milestone (so a missed day still shows).
    const hit = offsets.filter(o => left <= o).sort((a, b) => a - b)[0]; // smallest offset >= left
    if (hit == null) return;
    vendors.forEach(v => {
      const key = v.id + "|" + occ.id + "|" + hit;
      if (log[key]) return;
      festival.push({ kind: "occasion", key, vendor: v, occ, daysLeft: left, milestone: hit });
    });
  });
  const gapDays = +(db.settings && db.settings.serviceReminderDays) || 90;
  const service = [];
  vendors.forEach(v => {
    const last = log["svc|" + v.id];
    const overdue = !last || (daysTo(last) != null && Math.abs(daysTo(last)) >= gapDays);
    if (overdue) service.push({ kind: "service", key: "svc|" + v.id, vendor: v });
  });
  return { festival, service };
};

/* Change the admin password. The current password is required, so a device that
   is merely still signed in cannot change it. */
function ChangePwSheet({ onSave, onClose }) {
  const [f, set] = useState({ cur:"", nw:"", nw2:"" });
  const [busy, setBusy] = useState(false);
  const u = (k) => (e) => set({ ...f, [k]: e.target.value });
  const short = f.nw.length > 0 && f.nw.length < 6;
  const mismatch = f.nw2.length > 0 && f.nw !== f.nw2;
  const ready = f.cur && f.nw.length >= 6 && f.nw === f.nw2;
  return (
    <Sheet title="Change admin password" onClose={onClose}>
      <F label="Current password"><input type="password" value={f.cur} onChange={u("cur")} autoComplete="current-password" /></F>
      <F label="New password (at least 6 characters)"><input type="password" value={f.nw} onChange={u("nw")} autoComplete="new-password" /></F>
      <F label="Type the new password again"><input type="password" value={f.nw2} onChange={u("nw2")} autoComplete="new-password" /></F>
      {short && <div className="vz-meta" style={{ color:"#B4262A" }}>Use at least 6 characters.</div>}
      {mismatch && <div className="vz-meta" style={{ color:"#B4262A" }}>The two new passwords do not match.</div>}
      <button className="vz-btn" disabled={!ready || busy}
        onClick={async () => { setBusy(true); await onSave(f.cur, f.nw); setBusy(false); }}>
        {busy ? "Saving…" : "Change password"}
      </button>
      <div className="vz-meta" style={{ textAlign:"center" }}>
        Every other signed-in device will be signed out.
      </div>

/* Create a Razorpay payment link for a campaign and share it with the customer. */
function PayLinkSheet({ order, vendor, math, paid, busy, status, onCreate, onClose }) {
  const due = Math.max(0, math.total - paid);
  const advanceLeft = Math.max(0, math.advance - paid);
  const [kind, setKind] = useState(paid > 0 ? "Balance" : "Advance");
  const [amount, setAmount] = useState(String(paid > 0 ? due : (math.advance || due)));
  const preset = (label, value) => (
    <button className="vz-chip c-blue" onClick={() => { setKind(label); setAmount(String(value)); }}>{label} · {inr(value)}</button>
  );
  const notReady = status && !status.error && !status.ready;
  return (
    <Sheet title="Payment link" onClose={onClose}>
      {notReady && (
        <div className="vz-card" style={{ background:"#FFF9E6", borderColor:"#F5DFA0" }}>
          <div className="vz-title" style={{ color:"#8A6100" }}>Razorpay is not set up yet</div>
          <div className="vz-meta" style={{ color:"#8A6100" }}>
            {!status.keys && <>• Add <b>RAZORPAY_KEY_ID</b> and <b>RAZORPAY_KEY_SECRET</b> in api/config.php<br /></>}
            {!status.webhook && <>• Add <b>RAZORPAY_WEBHOOK_SECRET</b> in api/config.php<br /></>}
            {!status.table && <>• Run <b>db/db-payments.sql</b> in phpMyAdmin</>}
          </div>
        </div>
      )}
      {status && status.ready && status.mode === "test" && (
        <div className="vz-card" style={{ background:"#FFF9E6", borderColor:"#F5DFA0" }}>
          <div className="vz-meta" style={{ marginTop:0, color:"#8A6100" }}>
            <b>Test mode</b> — this link will not take real money.
          </div>
        </div>
      )}
      <div className="vz-card" style={{ background:"#FAFBFC" }}>
        <div className="vz-title">{vendor ? vendor.name : "—"}</div>
        <div className="vz-meta">{order.no} · {order.title}</div>
        <div className="vz-kv" style={{ marginTop:6 }}><span>Grand total</span><b>{inr(math.total)}</b></div>
        <div className="vz-kv"><span>Received so far</span><b>{inr(paid)}</b></div>
        <div className="vz-kv"><span>Balance due</span><b className="vz-money">{inr(due)}</b></div>
      </div>

      <div className="vz-eyebrow">Quick amounts</div>
      <div className="vz-inline" style={{ flexWrap:"wrap", marginBottom:12 }}>
        {advanceLeft > 0 && preset("Advance", advanceLeft)}
        {due > 0 && preset("Balance", due)}
      </div>

      <div className="vz-2">
        <F label="Amount ₹"><input type="number" inputMode="numeric" value={amount}
          onChange={e => setAmount(e.target.value.replace(/[^\d]/g, ""))} /></F>
        <F label="For"><select value={kind} onChange={e => setKind(e.target.value)}>
          {["Advance","Balance","Part payment"].map(k => <option key={k}>{k}</option>)}
        </select></F>
      </div>

      <button className="vz-btn go" disabled={busy || notReady || !(+amount > 0)} onClick={() => onCreate(+amount, kind)}>
        {busy ? "Creating link…" : notReady ? "Finish the setup above first" : "Create link & share"}
      </button>
      <div className="vz-meta" style={{ textAlign:"center" }}>
        The customer pays online and it records here automatically.

      {!vendor?.phone && !vendor?.email && (
        <div className="vz-meta" style={{ color:"#8A6100" }}>

}

function AttendanceSheet({ db, vehOf, drvOf, onClose }) {
  const month = today().slice(0, 7);

  const rows = db.drivers.map(d => {
    const mine = recs.filter(a => a.driverId === d.id);
    return { d, days: mine.length, pay: mine.length * (+d.wage || 0) };
  }).sort((a, b) => b.days - a.days);
  const bill = rows.reduce((s, r) => s + r.pay, 0);
  const log = (db.attendance || []).filter(a => a.date === today());
  return (
    <Sheet title="Attendance & wages" onClose={onClose}>
      <div className="vz-grid" style={{ marginBottom:4 }}>
        <div className="vz-stat"><i>Present today</i><b>{log.length}<small style={{ fontSize:13 }}> / {db.drivers.length}</small></b><small>signed in with a vehicle</small></div>
        <div className="vz-stat"><i>Wage bill, this month</i><b style={{ fontSize:18 }}>{inr(bill)}</b><small>days worked × daily rate</small></div>

      {log.map(a => {
        const d = drvOf(a.driverId), v = vehOf(a.vehicleId);
        return (
          <div className="vz-card" key={a.id}>
            <div className="vz-row">
              <div>
                <div className="vz-title">{a.driverName || (d ? d.name : "—")}</div>
                <div className="vz-meta" style={{ fontFamily:"var(--mono)" }}>{a.vehiclePlate || (v ? v.plate : "—")}</div>
                <div className="vz-meta">In {clock(a.inAt)}{a.outAt ? " · Out " + clock(a.outAt) : ""}{a.autoClosed ? " · auto" : ""}</div>
                <div className="vz-meta">KM {a.openKm != null ? a.openKm : "—"} → {a.closeKm != null ? a.closeKm : "—"}{(a.openKm != null && a.closeKm != null) ? "  (" + (a.closeKm - a.openKm) + " km)" : ""}</div>

                  <a href={a.selfieUrl} target="_blank" rel="noreferrer" style={{ display:"inline-block", marginTop:6 }}>
                    <img src={a.selfieUrl} alt="punch-in selfie" style={{ width:64, height:84, objectFit:"cover", borderRadius:8, border:"1px solid var(--line)" }} />

                  <a className="vz-meta" style={{ color:"#2C6FD1", display:"block" }} href={mapLink(a.lat, a.lng)} target="_blank" rel="noreferrer">Open punch-in location</a>
                )}

      {rows.map(r => (
        <div className="vz-kv" key={r.d.id} style={{ background:"#fff", padding:"11px 13px", border:"1px solid var(--line)", borderRadius:10, marginBottom:6 }}>

/* ---------------------------- capture sheet ---------------------------- */
function CaptureSheet({ ctx, pics, lang, onPhoto, onSave, onClose }) {
  const t = (k) => tr(lang, k);
  const { order, vendor, vehicle, driver } = ctx;
  const [kind, setKind] = useState(ctx.kind || "Daily run");
  const [fix, setFix] = useState(null);
  const [busy, setBusy] = useState(true);
  const [shotId, setShotId] = useState("");
  const [place, setPlace] = useState("");
  const [note, setNote] = useState("");
  const fileRef = useRef(null);

  const locate = async () => { setBusy(true); setFix(await getFix()); setBusy(false); };
  useEffect(() => { locate(); }, []);

  const grab = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const stamp = [
      "VIBE MARKETING · " + (vendor ? vendor.name : ""),
      (vehicle ? vehicle.plate : "") + "  ·  " + (driver ? driver.name : "") + "  ·  " + kind,
      new Date().toLocaleString("en-IN", { day:"2-digit", month:"short", year:"numeric", hour:"numeric", minute:"2-digit", hour12:true }),
      fix && fix.ok ? "GPS " + fix.lat + ", " + fix.lng + "  (±" + fix.acc + "m)" : (place ? "Location: " + place : "Location not captured"),
    ];
    const dataUrl = await processShot(file, stamp);
    const id = uid();
    onPhoto(id, dataUrl);
    setShotId(id);
    e.target.value = "";
  };

  const ready = shotId && (fix?.ok || place.trim());

  return (
    <Sheet title={t("campaignPhoto")} onClose={onClose}>
      <div className="vz-meta" style={{ marginTop:-8, marginBottom:12 }}>
        {vendor ? vendor.name : "—"} · {order ? order.title : "—"}<br />
        {vehicle ? vehicle.plate : "—"} · {driver ? driver.name : "—"}
      </div>

      <div className="vz-seg">
        {SHOT_KINDS.map(k => (
          <button key={k} data-on={kind === k ? "1" : "0"} onClick={() => setKind(k)}>{trKind(lang, k)}</button>
        ))}
      </div>

      <div className="vz-card" style={{ background: fix?.ok ? "#F2FBF6" : "#FFF9E6", borderColor: fix?.ok ? "#BFE7D2" : "#F5DFA0" }}>
        {busy && <div className="vz-meta" style={{ marginTop:0 }}>{t("gettingGps")}</div>}
        {!busy && fix?.ok && (
          <>
            <div className="vz-row">
              <div className="vz-gps">{fix.lat}, {fix.lng}</div>
              <Chip c="c-green">±{fix.acc} m</Chip>
            </div>
            <a className="vz-meta" style={{ color:"#2C6FD1", display:"block" }} href={mapLink(fix.lat, fix.lng)} target="_blank" rel="noreferrer">Open in Maps</a>
          </>
        )}
        {!busy && fix && !fix.ok && (
          <>
            <div className="vz-meta" style={{ marginTop:0, color:"#8A6100" }}>{fix.why}</div>
            <div className="vz-inline" style={{ marginTop:8 }}>
              <button className="vz-btn alt" style={{ margin:0 }} onClick={locate}>{t("retryGps")}</button>
            </div>
            <div style={{ marginTop:10 }}>
              <F label={t("landmark")}><input value={place} onChange={e => setPlace(e.target.value)} placeholder="Chatram bus stand signal" /></F>
            </div>
          </>
        )}
      </div>

      {shotId && pics[shotId] && <img className="vz-thumb" src={pics[shotId]} alt="campaign proof" style={{ marginBottom:10 }} />}

      <button className="vz-big" onClick={() => fileRef.current && fileRef.current.click()}>
        <Icon d={ICONS.field} />{shotId ? t("retake") : t("openCamera")}
      </button>
      <input ref={fileRef} className="vz-hidden" type="file" accept="image/*" capture="environment" onChange={grab} />

      <F label={t("noteOpt")}><input value={note} onChange={e => setNote(e.target.value)} placeholder="Parked at temple entrance, heavy crowd" /></F>

      <button className="vz-btn go" disabled={!ready} onClick={() => onSave({
        id: uid(), orderId: order?.id || "", vehicleId: vehicle?.id || "", driverId: driver?.id || "", driverName: driver?.name || "",
        photoId: shotId, kind, at: new Date().toISOString(),
        lat: fix?.ok ? fix.lat : null, lng: fix?.ok ? fix.lng : null, acc: fix?.ok ? fix.acc : null,
        place: place.trim(), note: note.trim(), sentVendor: false, sentManager: false,
      })}>
        {ready ? t("submitSend") : t("needBoth")}
      </button>
    </Sheet>
  );
}

/* ---------------------------- app ---------------------------- */
function VibeCRM() {
  const [db, setDb] = useState(blankData);
  const [pics, setPics] = useState({});
  // The admin (office) user has complete rights over everything in the app.
  const me = (db.users || []).find(u => u.id === db.userId) || null;
  const perm = ROLES["Director"];
  const mode = db.role || "";
  const setMode = (v) => setDb(d => ({ ...d, role: v }));
  const [gate, setGate] = useState({ step:"choose", userId:"", name:"", pin:"", pin2:"" });
  const [tab, setTab] = useState("home");
  const [sheet, setSheet] = useState(null);
  const [send, setSend] = useState(null);
  const [capture, setCapture] = useState(null);
  const [fleetView, setFleetView] = useState("vehicles");
  const [pickVeh, setPickVeh] = useState("");
  const [fieldVeh, setFieldVeh] = useState("");
  const [q, setQ] = useState("");
  const [openOrder, setOpenOrder] = useState(null);
  const [openProof, setOpenProof] = useState(null);
  const [invoice, setInvoice] = useState(null);
  const [login, setLogin] = useState({ vehicleId:"", driverId:"", driverName:"", pin:"", openKm:"", selfieId:"", selfieLat:null, selfieLng:null, selfieAcc:null });
  const [verified, setVerified] = useState(null);
  const [closing, setClosing] = useState(false);
  const [closeKm, setCloseKm] = useState("");
  const [snapping, setSnapping] = useState(false);
  const [toast, setToast] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [full, setFull] = useState(false);
  const [locked, setLocked] = useState(false);   // admin session is locked until the PIN is re-entered
  const [lockPin, setLockPin] = useState("");
  const [adminCfg, setAdminCfg] = useState(null); // { configured, setup_enabled } from the server
  const [rzpStatus, setRzpStatus] = useState(null); // Razorpay setup state (booleans only)

  useEffect(() => {
    (async () => {
      try { const r = await window.storage.get(KEY_DATA); const base = (r && r.value) ? JSON.parse(r.value) : blankData(); setDb(seedOccasionsIfEmpty(seedInvoiceDefaults(seedFleetIfEmpty(base))));
        setAdminToken(base && base.adminToken ? base.adminToken : "");
        // If an admin was left signed in, lock the app on open so the PIN is required again.
        if (base && base.role === "manager" && base.userId && (base.users || []).some(u => u.id === base.userId && u.pin)) setLocked(true);
      } catch (e) {}
      try { const r = await window.storage.get(KEY_PICS); if (r && r.value) setPics(JSON.parse(r.value)); } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  // Auto-lock the admin after idle time, and whenever the app returns to the foreground after a short absence.
  useEffect(() => {
    if (mode !== "manager" || !me || !me.pin) return;
    let lastActive = Date.now();
    const IDLE = 5 * 60 * 1000;   // 5 minutes idle
    const AWAY = 60 * 1000;       // re-lock if backgrounded for over a minute
    const doLock = () => { setLocked(true); setSheet(null); setSend(null); setInvoice(null); setOpenOrder(null); setOpenProof(null); };
    const bump = () => { lastActive = Date.now(); };
    const check = () => { if (Date.now() - lastActive > IDLE) doLock(); };
    const onVis = () => { if (document.visibilityState === "visible" && Date.now() - lastActive > AWAY) doLock(); };
    const iv = setInterval(check, 30000);
    window.addEventListener("pointerdown", bump);
    window.addEventListener("keydown", bump);
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(iv); window.removeEventListener("pointerdown", bump); window.removeEventListener("keydown", bump); document.removeEventListener("visibilitychange", onVis); };
  }, [mode, me]);
  useEffect(() => { if (loaded) (async () => { try { await window.storage.set(KEY_DATA, JSON.stringify(db)); } catch (e) {} })(); }, [db, loaded]);

  // When the server rejects our admin token (expired/invalid), drop it so the login screen shows.
  useEffect(() => {
    onAuthFail = () => { setAdminToken(""); setDb(d => (d.adminToken ? { ...d, adminToken: "" } : d)); };
    return () => { onAuthFail = null; };
  }, []);

  // Ask the server whether an admin exists yet (login) or needs first-time setup.
  useEffect(() => {
    if (!loaded) return;
    apiGet("admin_status.php").then(r => { if (r) setAdminCfg(r); });
  }, [loaded, gate.step, db.adminToken]);

  // Razorpay setup state, refreshed when Settings or the payment-link sheet opens.
  // Uses fetch directly so a server error can be reported instead of silently
  // leaving the panel on "Checking…".
  useEffect(() => {
    if (!loaded || !db.adminToken) { setRzpStatus(null); return; }
    if (sheet?.type !== "settings" && sheet?.type !== "paylink") return;
    let gone = false;
    (async () => {
      try {
        const r = await fetch(API_BASE + "/razorpay_status.php?key=" + encodeURIComponent(API_KEY),
                              { headers: { "X-Admin-Token": ADMIN_TOKEN } });
        const text = await r.text();
        if (gone) return;
        if (!r.ok) { setRzpStatus({ error: "Server error " + r.status, detail: text.slice(0, 120) }); return; }
        try { setRzpStatus(JSON.parse(text)); }
        catch (e) { setRzpStatus({ error: "Unexpected reply from the server", detail: text.slice(0, 120) }); }
      } catch (e) {
        if (!gone) setRzpStatus({ error: "Could not reach the server", detail: String(e.message || e) });
      }
    })();
    return () => { gone = true; };
  }, [loaded, db.adminToken, sheet?.type]);
  useEffect(() => { if (loaded) (async () => { try { await window.storage.set(KEY_PICS, JSON.stringify(pics)); setFull(false); } catch (e) { setFull(true); } })(); }, [pics, loaded]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 2600); return () => clearTimeout(t); }, [toast]);

  /* phone/browser Back closes the open page instead of leaving the app */
  useEffect(() => {
    const onPop = () => {
      if (capture) { setCapture(null); return; }
      if (openProof) { setOpenProof(null); return; }
      if (openOrder) { setOpenOrder(null); return; }
      if (sheet) { setSheet(null); return; }
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, [capture, openProof, openOrder, sheet]);
  useEffect(() => {
    if (sheet || openOrder || openProof || capture) {
      try { window.history.pushState({ vibeOverlay: 1 }, ""); } catch (e) {}
    }
  }, [sheet, openOrder, openProof, capture]);

  /* office: pull photos + attendance from the shared server every 15s */
  useEffect(() => {
    if (!loaded || mode !== "manager" || !db.adminToken) return; // only pull once the admin is authenticated
    const srvISO = (s) => (s && typeof s === "string") ? s.replace(" ", "T") + "Z" : (s || "");
    let stop = false;
    const pull = async () => {
      const [pr, at, dr, pay] = await Promise.all([apiGet("proofs.php"), apiGet("attendance.php"), apiGet("drivers.php"), apiGet("payments.php")]);
      if (stop || (!Array.isArray(pr) && !Array.isArray(at) && !Array.isArray(dr) && !Array.isArray(pay))) return;
      setDb(d => {
        let next = d;
        if (Array.isArray(dr)) {
          const have = new Set((next.drivers || []).map(x => x.id));
          const add = dr.filter(r => !have.has(r.id)).map(r => ({
            id: r.id, name: r.name, phone: r.phone, refPhone: r.emergency || "", dl: r.dl || "", dlExpiry: r.dl_expiry || "",
            wage: 0, joined: "", aadhaar: "", pan: "", photoId: "", dlFrontId: "", dlBackId: "", pin: "", bank: false, address: "",
            photoUrl: r.photo_url || "", dlFrontUrl: r.dl_front_url || "", dlBackUrl: r.dl_back_url || "", fromServer: true,
          }));
          if (add.length) next = { ...next, drivers: [...add, ...(next.drivers || [])] };
        }
        if (Array.isArray(pay)) {
          // Paid Razorpay links become payment entries; pending links are kept so the
          // office can see what is still awaiting payment.
          const have = new Set((next.payments || []).map(p => p.id));
          const add = pay.filter(r => r.status === "paid" && !have.has(r.id)).map(r => ({
            id: r.id, orderId: r.order_id, amount: +r.amount, date: (r.paid_at || r.created_at || "").slice(0, 10),
            kind: r.kind || "Advance", mode: "Razorpay" + (r.method ? " · " + r.method : ""),
            ref: r.payment_id || "", online: true, fromServer: true,
          }));
          if (add.length) next = { ...next, payments: [...add, ...(next.payments || [])] };
          next = { ...next, payLinks: pay.filter(r => r.status === "created") };
        }
        if (Array.isArray(pr)) {
          const have = new Set((d.proofs || []).map(p => p.id));
          const add = pr.filter(r => !have.has(r.id)).map(r => ({
            id: r.id, at: srvISO(r.at), kind: r.kind, vehicleId: r.vehicle_id, driverName: r.driver_name,
            vehiclePlate: r.vehicle_plate || "", orderId: r.order_id || "", vendorName: r.vendor_name || "",
            lat: r.lat != null ? +r.lat : null, lng: r.lng != null ? +r.lng : null,
            place: r.place || "", note: r.note || "", photoUrl: r.photo_url || "",
            sentVendor: false, sentManager: false, fromServer: true,
          }));
          if (add.length) next = { ...next, proofs: [...add, ...(next.proofs || [])] };
        }
        if (Array.isArray(at)) {
          const byId = {}; (next.attendance || []).forEach(a => { byId[a.id] = a; });
          at.forEach(r => { byId[r.id] = {
            id: r.id, date: r.date, vehicleId: r.vehicle_id, vehiclePlate: r.vehicle_plate || "", driverName: r.driver_name,
            inAt: srvISO(r.in_at), outAt: srvISO(r.out_at), lat: r.lat != null ? +r.lat : null,
            lng: r.lng != null ? +r.lng : null, autoClosed: !!(+r.auto_closed),
            openKm: r.open_km != null ? +r.open_km : null, closeKm: r.close_km != null ? +r.close_km : null,
            selfieUrl: r.selfie_url || "" }; });
          next = { ...next, attendance: Object.values(byId) };
        }
        return next;
      });
    };
    pull();
    const t = setInterval(pull, 15000);
    return () => { stop = true; clearInterval(t); };
  }, [loaded, mode, db.adminToken]);

  /* office: push the driver roster to the shared server so drivers can log in on their phones */
  useEffect(() => {
    if (!loaded || mode !== "manager" || !db.adminToken) return; // only the authenticated admin pushes the roster
    (db.drivers || []).filter(d => !d.fromServer).forEach(d => apiPost("drivers.php", { id: d.id, name: d.name, phone: d.phone, pin: d.pin || "", active: 1,
      emergency: d.refPhone || "", dl: d.dl || "", dl_expiry: d.dlExpiry || "" }));
  }, [loaded, mode, db.adminToken]);

  /* Drivers stay signed in all day; the app auto-signs them out at night.
     A shift left open on a past day is auto-closed once it's after 1am (a new day). */
  useEffect(() => {
    if (!loaded) return;
    const sweep = () => {
      if (new Date().getHours() < 1) return; // hold until ~1am so it never logs out during the day
      const stale = (db.attendance || []).filter(a => !a.outAt && a.date < today());
      if (!stale.length) return;
      setDb(d => ({ ...d,
        attendance: (d.attendance || []).map(a => (!a.outAt && a.date < today())
          ? { ...a, outAt: a.date + "T23:59:00", autoClosed: true } : a),
        session: stale.some(a => a.id === d.session) ? "" : d.session }));
      stale.forEach(s => apiPost("attendance.php", { id: s.id, date: s.date, vehicle_id: s.vehicleId,
        vehicle_plate: (vehOf(s.vehicleId) || {}).plate || "", driver_name: s.driverName || "",
        in_at: s.inAt, out_at: s.date + "T23:59:00", lat: s.lat, lng: s.lng, open_km: s.openKm, auto_closed: 1 }));
    };
    sweep();
    const t = setInterval(sweep, 5 * 60 * 1000);
    return () => clearInterval(t);
  }, [loaded, db.attendance]);

  const put = (key, item) => setDb(d => { const arr = d[key] || []; return { ...d, [key]: arr.some(x => x.id === item.id) ? arr.map(x => (x.id === item.id ? item : x)) : [item, ...arr] }; });
  const drop = (key, id) => setDb(d => ({ ...d, [key]: (d[key] || []).filter(x => x.id !== id) }));
  const savePic = (id, dataUrl) => setPics(p => {
    const next = { ...p, [id]: dataUrl };
    const keys = Object.keys(next);
    if (keys.length > 60) keys.slice(0, keys.length - 60).forEach(k => { delete next[k]; });
    return next;
  });
  const setSetting = (k, v) => setDb(d => ({ ...d, settings: { ...d.settings, [k]: v } }));

  const vendorOf = (id) => db.vendors.find(v => v.id === id);
  const orderOf = (id) => db.orders.find(o => o.id === id);
  const vehOf = (id) => db.vehicles.find(v => v.id === id);
  const drvOf = (id) => db.drivers.find(d => d.id === id);
  const paidOn = (oid) => db.payments.filter(p => p.orderId === oid).reduce((s, p) => s + p.amount, 0);

  const stats = useMemo(() => {
    const onRoad = db.vehicles.filter(v => v.status === "On road").length;
    const workshop = db.vehicles.filter(v => v.status === "Workshop").length;
    const alerts = alertsFor(db.vehicles, db.settings, db.snoozes || {});
    const live = db.orders.filter(o => o.stage === "Running" || o.stage === "Advance paid");
    const billed = db.orders.filter(o => o.stage !== "Proforma").reduce((s, o) => s + orderMath(o).total, 0);
    const collected = db.payments.reduce((s, p) => s + p.amount, 0);
    const kycGaps = db.drivers.filter(d => !d.aadhaar || !d.pan || !d.dl || !d.photoId).length;
    const chase = db.orders.filter(o => o.stage === "Proforma" && Math.abs(daysTo(o.created) || 0) >= (db.settings.remindDays || 3));
    const todays = db.proofs.filter(p => localDay(p.at) === today());
    const runningVeh = db.orders.filter(o => o.stage === "Running").flatMap(o => o.vehicleIds || []);
    const missingToday = runningVeh.filter(vid => !todays.some(p => p.vehicleId === vid));
    return { onRoad, workshop, alerts, live, billed, collected, due: billed - collected, kycGaps, chase, todays, missingToday };
  }, [db]);

  useEffect(() => {
    if (mode === "manager" && !perm.tabs.includes(tab)) setTab(perm.tabs[0]);
  }, [mode, db.userId, tab]);

  const nextOrderNo = () => "VM/PI/" + new Date().getFullYear() + "/" + String(db.orders.length + 1).padStart(3, "0");

  /* fire one phone notification a day for anything overdue or inside the final window */
  useEffect(() => {
    if (!loaded || !db.settings.browserAlerts) return;
    const urgent = stats.alerts.filter(a => a.level !== "early");
    if (!urgent.length) return;
    const stamp = today();
    try {
      if (window.__vibeNotified === stamp) return;
      window.__vibeNotified = stamp;
      if (typeof Notification !== "undefined" && Notification.permission === "granted") {
        new Notification("Vibe Marketing — " + urgent.length + " renewals due", {
          body: urgent.slice(0, 4).map(a => a.plate + "  " + a.doc.label + "  " +
            (a.days < 0 ? Math.abs(a.days) + "d overdue" : "in " + a.days + "d")).join("\n"),
        });
      }
    } catch (e) {}
  }, [loaded, db.settings.browserAlerts, stats.alerts]);

  /* ---------- send helpers ---------- */
  const logSend = (order, kind, channel) => put("orders", { ...order, sends: [{ id: uid(), kind, channel, at: new Date().toISOString() }, ...(order.sends || [])] });

  const sendProforma = (o, auto) => {
    const v = vendorOf(o.vendorId), m = orderMath(o);
    setSend({
      title: auto ? "Auto-send proforma" : "Send proforma", auto, to: v ? v.name : "—",
      phone: v?.phone, email: v?.email, subject: "Proforma invoice " + o.no + " — Vibe Marketing",
      text: proformaText(o, v, m),
      onSent: (ch) => { logSend(o, "Proforma", ch); setToast("Proforma " + o.no + " sent · " + ch); },
    });
  };
  const sendReminder = (o) => {
    const v = vendorOf(o.vendorId), m = orderMath(o);
    setSend({
      title: "Send reminder", to: v ? v.name : "—", phone: v?.phone, email: v?.email,
      subject: "Reminder — proforma " + o.no, text: reminderText(o, v, m, Math.abs(daysTo(o.created) || 0)),
      onSent: (ch) => { logSend(o, "Reminder", ch); setToast("Reminder sent · " + ch); },
    });
  };

  /* Razorpay: create a payment link for a campaign, then share it with the customer.
     Once they pay, Razorpay calls our webhook and the payment appears here by itself. */
  const [payBusy, setPayBusy] = useState(false);
  const [doc, setDoc] = useState(null);      // generated quotation / invoice image
  const [docBusy, setDocBusy] = useState(false);

  /* Build the formal document image for a campaign and open the viewer. */
  const openDoc = async (o, title) => {
    const v = vendorOf(o.vendorId), m = orderMath(o), s = db.settings;
    setDocBusy(true);
    try {
      const url = await docImage({ title, s, v, o, m });
      setOpenOrder(null); setSheet(null);
      setDoc({
        url, title, order: o, vendor: v,
        text: proformaText(o, v, m),
        subject: (title === "TAX INVOICE" ? "Tax invoice " : "Quotation ") + (o.invNo || o.no) + " — Vibe Marketing",
      });
    } catch (e) { setToast("Could not build the document"); }
    setDocBusy(false);
  };
  const makePayLink = async (o, amount, kind) => {
    const v = vendorOf(o.vendorId);
    const amt = Math.round(+amount || 0);
    if (amt < 1) { setToast("Enter an amount first"); return; }
    setPayBusy(true);
    const res = await apiPost("razorpay_link.php", {
      order_id: o.id, order_no: o.no, vendor_name: v ? v.name : "",
      phone: v?.phone || "", email: v?.email || "", amount: amt, kind,
    });
    setPayBusy(false);
    if (!res) { setToast("Could not reach the server"); return; }
    if (!res.ok || !res.url) { setToast(res.error || "Could not create the payment link"); return; }
    setSheet(null);
    setSend({
      title: "Send payment link", to: v ? v.name : "customer", phone: v?.phone, email: v?.email,
      subject: kind + " payment — " + o.no + " — Vibe Marketing",
      text: "Hello " + (v ? (v.person || v.name) : "") + ",\n\n" +
            kind + " for " + o.title + " (" + o.no + ").\n" +
            "Amount: " + inr(amt) + "\n\nPay securely here:\n" + res.url +
            "\n\nThank you!\n— Vibe Marketing",
      onSent: (ch) => { logSend(o, "Payment link", ch); setToast("Payment link sent · " + ch); },
    });
  };
  const sendReceipt = (o, p) => {
    const v = vendorOf(o.vendorId), m = orderMath(o);
    setSend({
      title: "Auto-send receipt", auto: true, to: v ? v.name : "—", phone: v?.phone, email: v?.email,
      subject: "Payment received — " + o.no, text: receiptText(o, v, p, paidOn(o.id) + p.amount, m),
      onSent: (ch) => { logSend(o, "Receipt", ch); setToast("Receipt sent · " + ch); },
    });
  };
  const lang = db.settings.driverLang || "en";
  const setLang = (v) => setSetting("driverLang", v);

  // Step 1: verify a registered driver (name + PIN). On success we move to the opening-km step.
  const verifyDriver = async () => {
    const veh = vehOf(login.vehicleId);
    const name = (login.driverName || "").trim();
    const pin = (login.pin || "").replace(/\D/g, "");
    if (!veh || !name || pin.length < 4) return;

    const res = await apiPost("driver_login.php", { name, pin });
    let driver = res && res.ok && res.driver ? { id: res.driver.id, name: res.driver.name, photoUrl: res.driver.photo_url || "" } : null;
    if (!driver) {
      const d0 = (db.drivers || []).find(x =>
        String(x.name || "").trim().toLowerCase() === name.toLowerCase() &&
        (String(x.pin || "").trim() || String(x.phone || "").replace(/\D/g, "").slice(-4)) === pin);
      if (d0) driver = { id: d0.id, name: d0.name, photoUrl: pics[d0.photoId] || d0.photoUrl || "" };
    }
    if (!driver) {
      setToast(lang === "ta" ? "பெயர் அல்லது கடவுச்சொல் பொருந்தவில்லை" : "Name or PIN doesn't match a registered driver");
      return;
    }
    setVerified(driver);
  };

  // Step 2a: capture a punch-in selfie with a GPS + time stamp burned into it.
  const selfieRef = useRef(null);
  const grabSelfie = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (e.target) e.target.value = "";
    if (!file) return;
    setSnapping(true);
    const veh = vehOf(login.vehicleId);
    const fix = await getFix();
    const stamp = [
      (verified && verified.name ? verified.name : (login.driverName || "Driver")) + (veh ? " · " + veh.plate : ""),
      new Date().toLocaleString(),
      fix.ok ? ("GPS " + fix.lat + ", " + fix.lng + " (±" + fix.acc + "m)") : "GPS unavailable",
    ];
    try {
      const dataUrl = await processShot(file, stamp);
      const id = "self_" + uid();
      savePic(id, dataUrl);
      setLogin(l => ({ ...l, selfieId: id, selfieLat: fix.ok ? fix.lat : null, selfieLng: fix.ok ? fix.lng : null, selfieAcc: fix.ok ? fix.acc : null }));
    } catch (err) {
      setToast(lang === "ta" ? "படத்தை படிக்க முடியவில்லை, மீண்டும் முயற்சிக்கவும்" : "Couldn't read that photo — try again");
    }
    setSnapping(false);
  };

  // Step 2b: opening kilometres entered -> start the shift.
  const beginDuty = async () => {
    const veh = vehOf(login.vehicleId);
    const driver = verified;
    const openKm = (login.openKm || "").replace(/\D/g, "");
    if (!veh || !driver || openKm === "") return;
    if (!login.selfieId || !pics[login.selfieId]) { setToast(lang === "ta" ? "முதலில் உங்கள் செல்தியை எடுக்கவும்" : "Please take your punch-in selfie first"); return; }
    // Sanity-check the odometer: opening km should not be below the vehicle's last recorded reading.
    const last = (db.attendance || []).filter(a => a.vehicleId === veh.id && (a.closeKm != null || a.openKm != null))
      .sort((a, b) => (String(a.inAt) < String(b.inAt) ? 1 : -1))[0];

      return;

    const rec = { id: uid(), driverId: driver.id || "", driverName: driver.name, driverPhoto: driver.photoUrl || "", vehicleId: veh.id, date: today(),
      inAt: new Date().toISOString(), outAt: "", substitute: false, openKm: +openKm, closeKm: null,
      lat: login.selfieLat != null ? login.selfieLat : null, lng: login.selfieLng != null ? login.selfieLng : null,
      selfieId: login.selfieId, selfieUrl: "" };
    setDb(d => ({ ...d, attendance: [rec, ...(d.attendance || [])], session: rec.id }));
    apiPost("attendance.php", { id: rec.id, date: rec.date, vehicle_id: veh.id, vehicle_plate: veh.plate,

    setLogin({ vehicleId:"", driverId:"", driverName:"", pin:"", openKm:"", selfieId:"", selfieLat:null, selfieLng:null, selfieAcc:null });

    const stamp = today().replace(/-/g, "");
    try {
      const blob = new Blob([text], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "vibe-backup-" + stamp + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      setToast("Backup saved to your downloads");
    } catch (e) { setToast("Could not save the backup here"); }
  };

    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || parsed.app !== "vibe-marketing" || !parsed.data) throw new Error("bad file");
        if (!window.confirm("Replace everything on this phone with the backup from " + dmy(parsed.exportedAt) + "?")) return;
        setDb({ ...blankData(), ...parsed.data });
        if (parsed.photos) setPics(parsed.photos);
        setSheet(null);
        setToast("Backup restored");
      } catch (err) { setToast("That file is not a Vibe backup"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

            <div className="vz-kv" key={p.id}><span>{dmy(p.date)} · {p.kind} · {p.mode}</span><b className="vz-money">{inr(p.amount)}</b></div>
          ))}
        </>}

        <div className="vz-inline" style={{ marginTop:14 }}>
          <button className="vz-btn alt" onClick={() => { setOpenOrder(null); setSheet({ type:"order", data:o }); }}>Edit</button>

        </div>
      </Sheet>
    );
  };

  /* assign a stable tax-invoice number the first time an invoice is opened, then show it */
  const openInvoice = (o) => {
    let ord = o;
    if (!o.invNo) {
      const n = db.settings.nextInvNo || 1;
      ord = { ...o, invNo: n, invDate: today() };
      put("orders", ord);
      setSetting("nextInvNo", n + 1);
    }
    setInvoice(ord.id);
  };

  const invoiceText = (o, v, m, s) => {
    const cgst = o.gst ? Math.round(m.sub * 0.09) : 0;
    return ["*" + (s.company || "Vibe Marketing") + "* — Tax Invoice",
      "Invoice No: " + (o.invNo || "-") + "  ·  " + dmy(o.invDate || today()),
      "To: " + (v ? v.name : "—"),
      "Vehicle charges: " + o.vehicles + " veh x " + inr(o.rate) + "/day x " + m.days + " day = " + inr(m.base),
      m.extras ? "Flex & fabrication: " + inr(m.extras) : "",
      "Subtotal: " + inr(m.sub),
      o.gst ? "CGST 9%: " + inr(cgst) + "  ·  SGST 9%: " + inr(cgst) : "",
      "*Grand total: " + inr(m.total) + "*",
      "Advance (" + (o.advancePct || 50) + "%): " + inr(m.advance),
      "",
      "Bank: " + s.bankName + " · A/c " + s.bankAcNo + " · IFSC " + s.bankIFSC + " (" + s.bankBranch + ")",
      "GSTIN: " + (s.gstin || "")].filter(Boolean).join("\n");
  };

  const InvoiceView = () => {
    const o = db.orders.find(x => x.id === invoice);
    if (!o) return null;
    const v = vendorOf(o.vendorId);
    const m = orderMath(o);
    const s = db.settings;
    const cgst = o.gst ? Math.round(m.sub * 0.09) : 0;
    const area = (o.route || "").split("→")[0].split("-")[0].trim() || "Coimbatore";
    return (
      <div className="vz-invoice-overlay">
        <div className="vz-invoice-actions vz-noprint">
          <button className="vz-btn alt" style={{ margin:0 }} onClick={() => setInvoice(null)}>← Close</button>
          <button className="vz-btn" style={{ margin:0 }} onClick={() => window.print()}>Print / Save PDF</button>
          {v && <button className="vz-btn alt" style={{ margin:0 }} onClick={() => openWA(v.phone, invoiceText(o, v, m, s))}>Share</button>}
        </div>
        <div className="vz-invoice">
          <div className="inv-head">
            <div style={{ minWidth:0 }}>
              <img src="logo-dark.png" alt={s.company} className="inv-logo" />
              <div className="inv-sm">{s.address}</div>
              <div className="inv-sm">Mob: {s.bizPhone}  ·  {s.website}  ·  {s.bizEmail}</div>
              <div className="inv-gstin">GSTIN: {s.gstin}</div>
            </div>
            <div className="inv-title">TAX INVOICE</div>
          </div>
          <div className="inv-meta">
            <div>
              <div className="inv-lbl">Bill to</div>
              <div><b>{v ? v.name : "—"}</b></div>
              {v && v.person && <div className="inv-sm">{v.person}</div>}
              {v && v.area && <div className="inv-sm">{v.area}</div>}
              {v && v.gst && <div className="inv-sm">GSTIN: {v.gst}</div>}
            </div>
            <div style={{ textAlign:"right" }}>
              <div className="inv-sm">Invoice No: <b>{o.invNo}</b></div>
              <div className="inv-sm">Date: <b>{dmy(o.invDate || today())}</b></div>
              <div className="inv-sm">Campaign: {o.title}</div>
            </div>
          </div>
          <table className="inv-table">
            <thead><tr><th>Description</th><th>Days</th><th>Vehicles</th><th>Rate</th><th>Total</th></tr></thead>
            <tbody>
              <tr><td>Vehicle Charges — {area}</td><td>{m.days}</td><td>{o.vehicles}</td><td>{inr(o.rate)}</td><td>{inr(m.base)}</td></tr>
              {m.extras > 0 && <tr><td>Flex &amp; Fabrication charges</td><td>-</td><td>-</td><td>-</td><td>{inr(m.extras)}</td></tr>}
            </tbody>
          </table>
          <div className="inv-totals">
            <div className="inv-trow"><span>Subtotal</span><b>{inr(m.sub)}</b></div>
            {o.gst && <div className="inv-trow"><span>CGST 9%</span><b>{inr(cgst)}</b></div>}
            {o.gst && <div className="inv-trow"><span>SGST 9%</span><b>{inr(cgst)}</b></div>}
            <div className="inv-trow inv-grand"><span>Grand total</span><b>{inr(m.total)}</b></div>
            <div className="inv-trow"><span>Advance ({o.advancePct || 50}%)</span><b>{inr(m.advance)}</b></div>
          </div>
          {s.invTerms && <div className="inv-terms">
            <div className="inv-lbl">Terms &amp; Conditions</div>
            <div className="inv-sm" style={{ whiteSpace:"pre-line" }}>{s.invTerms}</div>
          </div>}
          <div className="inv-bank">
            <div className="inv-lbl">Bank details</div>
            <div className="inv-sm">Bank: {s.bankName}  ·  A/c holder: {s.bankHolder}</div>
            <div className="inv-sm">A/c No: {s.bankAcNo}  ·  IFSC: {s.bankIFSC}</div>
            <div className="inv-sm">Branch: {s.bankBranch}  ·  Type: {s.bankAcType}</div>
          </div>
          <div className="inv-thanks">Thank you for your business!</div>
        </div>
      </div>
    );
  };

  const Field = () => {
    const list = [...db.proofs]
      .filter(p => !fieldVeh || p.vehicleId === fieldVeh)
      .sort((a, b) => (a.at < b.at ? 1 : -1));
    return (
      <>
        <div className="vz-grid">
          <div className="vz-stat"><i>Shots today</i><b>{stats.todays.length}</b><small>{stats.missingToday.length} vehicles yet to send</small></div>
          <div className="vz-stat"><i>Not shared</i><b style={{ color: list.filter(p => !p.sentVendor).length ? "#E5484D" : "#178951" }}>{list.filter(p => !p.sentVendor).length}</b><small>pending to vendor</small></div>
        </div>

        {stats.missingToday.length > 0 && (
          <>
            <div className="vz-eyebrow">No photo today</div>
            <div className="vz-card">
              <div className="vz-meta" style={{ marginTop:0 }}>These running vehicles have not sent today's proof:</div>
              <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginTop:8 }}>
                {stats.missingToday.map(vid => {
                  const veh = vehOf(vid);
                  return <span key={vid} className="vz-chip c-yellow" style={{ fontFamily:"var(--mono)" }}>{veh ? veh.plate : vid}</span>;
                })}
              </div>
            </div>
          </>
        )}

        <div className="vz-card" style={{ marginTop:10 }}>
          <F label="Filter by vehicle">
            <select value={fieldVeh} onChange={e => setFieldVeh(e.target.value)}>
              <option value="">All vehicles</option>
              {db.vehicles.map(v => <option key={v.id} value={v.id}>{v.plate}</option>)}
            </select>
          </F>
        </div>

        <div className="vz-eyebrow">Photo feed — day by day{fieldVeh ? " · " + (vehOf(fieldVeh)?.plate || "") : ""}</div>
        {list.length === 0 && <Empty head="No field photos yet" sub={fieldVeh ? "No photos for this vehicle yet." : "Drivers capture geo-stamped vehicle and campaign photos from Driver mode."} />}
        {(() => {
          const byDay = {};
          list.forEach(p => { const d = localDay(p.at); (byDay[d] = byDay[d] || []).push(p); });
          return Object.keys(byDay).sort().reverse().map(day => (
            <div key={day}>
              <div className="vz-daysep">{day === today() ? "Today" : dmy(day)}<span>{byDay[day].length} photo{byDay[day].length > 1 ? "s" : ""}</span></div>
              {byDay[day].map(p => {
                const o = orderOf(p.orderId), v = o ? vendorOf(o.vendorId) : null;
                const veh = vehOf(p.vehicleId), drv = drvOf(p.driverId);
                const who = p.driverName || (drv ? drv.name : "—");
                const head = v ? v.name : (p.kind === "Vehicle photo" ? "Vehicle photo" : "—");
                return (
                  <div className="vz-card" key={p.id}>
                    <div className="vz-shot">
                      {(pics[p.photoId] || p.photoUrl) ? <img className="vz-thumb sm" src={pics[p.photoId] || p.photoUrl} alt="" onClick={() => setOpenProof(p.id)} /> : <div className="vz-avblank" style={{ width:64, height:64, borderRadius:10 }}>?</div>}
                      <div style={{ flex:1, minWidth:0 }}>
                        <div className="vz-row">
                          <div className="vz-title" style={{ fontSize:13.5 }}>{head}</div>
                          <Chip c={p.kind === "Vehicle photo" ? "c-blue" : p.kind === "Completion" ? "c-grey" : "c-green"}>{p.kind}</Chip>
                        </div>
                        <div className="vz-meta">{p.vehiclePlate || (veh ? veh.plate : "—")} · {who}<br />{clock(p.at)}</div>
                        <div className="vz-gps" style={{ marginTop:3 }}>
                          {p.lat ? <a href={mapLink(p.lat, p.lng)} target="_blank" rel="noreferrer" style={{ color:"#2C6FD1" }}>Location: {p.lat}, {p.lng} — open map</a> : (p.place ? "Location: " + p.place : "no location")}
                        </div>
                      </div>
                    </div>
                    <div className="vz-row" style={{ marginTop:9, alignItems:"center" }}>
                      <div style={{ display:"flex", gap:5 }}>
                        <Chip c={p.sentVendor ? "c-green" : "c-grey"}>{p.sentVendor ? "Vendor ✓" : "Vendor –"}</Chip>
                        <Chip c={p.sentManager ? "c-green" : "c-grey"}>{p.sentManager ? "Manager ✓" : "Manager –"}</Chip>
                      </div>
                      <div className="vz-inline">
                        {!p.sentVendor && <button className="vz-chip c-blue" onClick={() => sendProof(p, "vendor")}>Send vendor</button>}
                        {!p.sentManager && <button className="vz-chip c-yellow" onClick={() => sendProof(p, "manager")}>Manager</button>}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          ));
        })()}
      </>
    );
  };

  const ProofDetail = () => {
    const p = db.proofs.find(x => x.id === openProof);
    if (!p) return null;
    const o = orderOf(p.orderId), v = o ? vendorOf(o.vendorId) : null;
    const veh = vehOf(p.vehicleId), drv = drvOf(p.driverId);
    return (
      <Sheet title={p.kind + " proof"} onClose={() => setOpenProof(null)}>
        {(pics[p.photoId] || p.photoUrl) && <img className="vz-thumb" src={pics[p.photoId] || p.photoUrl} alt="" style={{ marginBottom:12 }} />}
        <div className="vz-card">
          <div className="vz-kv"><span>Vendor</span><b>{v ? v.name : "—"}</b></div>
          <div className="vz-kv"><span>Campaign</span><b>{o ? o.title : "—"}</b></div>
          <div className="vz-kv"><span>Vehicle</span><b style={{ fontFamily:"var(--mono)" }}>{veh ? veh.plate : "—"}</b></div>
          <div className="vz-kv"><span>Driver</span><b>{p.driverName || (drv ? drv.name : "—")}</b></div>
          <div className="vz-kv"><span>Time</span><b>{clock(p.at)}</b></div>
          <div className="vz-kv"><span>Location</span><b>{p.lat ? p.lat + ", " + p.lng : p.place || "—"}</b></div>
          {p.note && <div className="vz-kv"><span>Note</span><b>{p.note}</b></div>}
        </div>
        {p.lat && <a className="vz-btn alt" style={{ display:"block", textAlign:"center", textDecoration:"none" }} href={mapLink(p.lat, p.lng)} target="_blank" rel="noreferrer">Open location in Maps</a>}
        <button className="vz-btn pop" onClick={() => { setOpenProof(null); sendProof(p, "vendor"); }}>Share with vendor</button>
        <button className="vz-btn alt" onClick={() => { setOpenProof(null); sendProof(p, "manager"); }}>Share with manager</button>
        {perm.del && <button className="vz-btn warn" onClick={() => { drop("proofs", p.id); setOpenProof(null); }}>Delete</button>}
      </Sheet>
    );
  };

  const Fleet = () => {
    const now = new Date();
    const monthLoad = Array.from({ length: 12 }, (_, i) => {
      const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
      const tag = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
      const n = db.vehicles.reduce((sum, v) => sum + DOCS.filter(doc => String(v[doc.k] || "").slice(0, 7) === tag).length, 0);
      return { tag, label: d.toLocaleDateString("en-IN", { month: "short" }), n };
    });
    const maxLoad = Math.max(1, ...monthLoad.map(m => m.n));
    return (
    <>
      <div className="vz-seg">
        <button data-on={fleetView === "vehicles" ? "1" : "0"} onClick={() => setFleetView("vehicles")}>Vehicles ({db.vehicles.length})</button>
        <button data-on={fleetView === "drivers" ? "1" : "0"} onClick={() => setFleetView("drivers")}>Drivers ({db.drivers.length})</button>
        <button data-on={fleetView === "jobs" ? "1" : "0"} onClick={() => setFleetView("jobs")}>Workshop</button>
        <button data-on={fleetView === "docs" ? "1" : "0"} onClick={() => setFleetView("docs")}>
          Papers{stats.alerts.length ? " (" + stats.alerts.length + ")" : ""}
        </button>
      </div>

      {fleetView === "vehicles" && db.vehicles.length > 0 && (
        <div className="vz-card">
          <F label="Select a vehicle to see full details">
            <select value={pickVeh} onChange={e => setPickVeh(e.target.value)}>
              <option value="">— choose a vehicle —</option>
              {db.vehicles.map(v => <option key={v.id} value={v.id}>{v.plate}</option>)}
            </select>
          </F>
          {(() => {
            const v = db.vehicles.find(x => x.id === pickVeh);
            if (!v) return null;
            const d = drvOf(v.driverId);
            const col = (due) => (daysTo(due) !== null && daysTo(due) <= 30 ? "#E5484D" : "#12192A");
            const span = (from, to) => (from ? dmy(from) + "  →  " : "") + dmy(to);
            const KV = ({ label, val, mono, color }) => (
              <div className="vz-kv"><span>{label}</span><b style={{ color: color || "#12192A", fontFamily: mono ? "var(--mono)" : "inherit" }}>{val || "—"}</b></div>
            );
            return (
              <div style={{ marginTop:10 }}>
                <div className="vz-row" style={{ marginBottom:6 }}>
                  <div className="vz-title" style={{ fontFamily:"var(--mono)" }}>{v.plate}</div>
                  <Chip c={v.status === "On road" ? "c-green" : v.status === "Workshop" ? "c-red" : "c-grey"}>{v.status}</Chip>
                </div>
                <KV label="Model" val={v.model} />
                <KV label="Driver" val={v.driverName || (d ? d.name : "—")} />
                <KV label="Chassis no." val={v.chassis} mono />
                <KV label="Engine no." val={v.engine} mono />
                <KV label="Insurance" val={span(v.insFrom, v.insDue)} color={col(v.insDue)} />
                {v.insPolicy && <KV label="Policy no." val={v.insPolicy} />}
                <KV label="FC (fitness)" val={span(v.fcFrom, v.fcDue)} color={col(v.fcDue)} />
                {v.fcAppNo && <KV label="FC application no." val={v.fcAppNo} />}
                <KV label="Pollution" val={span(v.pucFrom, v.pucDue)} color={col(v.pucDue)} />
                {v.permitDue && <KV label="Permit" val={dmy(v.permitDue)} color={col(v.permitDue)} />}
                <KV label="Tax valid" val={v.taxValid} />
                <KV label="Board size" val={v.boardSize} />
                <button className="vz-btn alt" style={{ marginTop:10 }} onClick={() => setSheet({ type:"vehicle", data:v })}>{perm.fleetEdit ? "Edit this vehicle" : "View full details"}</button>

                <div className="vz-eyebrow" style={{ marginTop:14 }}>Daily kilometres</div>
                {(() => {
                  const log = (db.attendance || []).filter(a => a.vehicleId === v.id)
                    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (a.inAt < b.inAt ? 1 : -1)));
                  if (!log.length) return <div className="vz-card"><div className="vz-meta">No trips logged for this vehicle yet.</div></div>;
                  return log.slice(0, 60).map(a => {
                    const dist = (a.openKm != null && a.closeKm != null) ? (a.closeKm - a.openKm) : null;
                    return (
                      <div className="vz-card" key={a.id} style={{ padding:"9px 12px" }}>
                        <div className="vz-row">
                          <div>
                            <div className="vz-title" style={{ fontSize:13.5 }}>{a.date === today() ? "Today" : dmy(a.date)}</div>
                            <div className="vz-meta">{a.driverName || "—"}{a.autoClosed ? " · auto-closed" : ""}</div>
                          </div>
                          <div style={{ textAlign:"right" }}>
                            <div className="vz-meta">Open <b>{a.openKm != null ? a.openKm : "—"}</b> · Close <b>{a.closeKm != null ? a.closeKm : "—"}</b></div>
                            <div className="vz-meta" style={{ color: dist != null ? "#12703A" : "inherit", fontWeight:700 }}>{dist != null ? dist + " km" : "in progress"}</div>
                          </div>
                        </div>
                      </div>
                    );
                  });
                })()}
              </div>
            );
          })()}
        </div>
      )}

      {fleetView === "vehicles" && db.vehicles.map(v => {
        const d = drvOf(v.driverId);
        const fc = daysTo(v.fcDue), ins = daysTo(v.insDue);
        return (
          <button className="vz-card vz-tapcard" key={v.id} onClick={() => setSheet({ type:"vehicle", data:v })}>
            <div className="vz-row">
              <div>
                <div className="vz-title" style={{ fontFamily:"var(--mono)" }}>{v.plate}</div>
                <div className="vz-meta">{v.model} · {v.driverName || (d ? d.name : "No driver")}<br />{v.boardSize}</div>
              </div>
              <div style={{ textAlign:"right" }}>
                <Chip c={v.status === "On road" ? "c-green" : v.status === "Workshop" ? "c-red" : "c-grey"}>{v.status}</Chip>
                <div className="vz-meta" style={{ marginTop:6 }}>
                  FC <b style={{ color: fc !== null && fc <= 30 ? "#E5484D" : "inherit" }}>{dmy(v.fcDue)}</b><br />
                  INS <b style={{ color: ins !== null && ins <= 30 ? "#E5484D" : "inherit" }}>{dmy(v.insDue)}</b>
                </div>
              </div>
            </div>
          </button>
        );
      })}

      {fleetView === "drivers" && (
        <div className="vz-eyebrow" style={{ marginTop:0 }}>
          Today · {(db.attendance || []).filter(a => a.date === today()).length} of {db.drivers.length} signed in
          <button onClick={() => setSheet({ type:"attendance" })}>Attendance & wages</button>
        </div>
      )}
      {fleetView === "drivers" && db.drivers.map(d => {
        const kyc = [["Photo", d.photoId], ["Aadhaar", d.aadhaar], ["PAN", d.pan], ["Licence", d.dl], ["Bank", d.bank]];
        const have = kyc.filter(k => k[1]).length;
        const veh = db.vehicles.find(v => v.driverId === d.id);
        const att = (db.attendance || []).find(a => a.driverId === d.id && a.date === today());
        const drove = att ? vehOf(att.vehicleId) : null;
        return (
          <button className="vz-card vz-tapcard" key={d.id} onClick={() => setSheet({ type:"driver", data:d })}>
            <div className="vz-shot">
              {(pics[d.photoId] || d.photoUrl) ? <img className="vz-thumb av" src={pics[d.photoId] || d.photoUrl} alt="" /> : <div className="vz-avblank">{d.name.slice(0, 1)}</div>}
              <div style={{ flex:1, minWidth:0 }}>
                <div className="vz-row">
                  <div className="vz-title">{d.name}</div>
                  <Chip c={have === 5 ? "c-green" : have >= 3 ? "c-yellow" : "c-red"}>File {have}/5</Chip>
                </div>
                <div className="vz-meta">{d.phone} · {inr(d.wage)}/day<br />{veh ? veh.plate : "Not assigned"} · joined {dmy(d.joined)}</div>
                <div className="vz-meta" style={{ color: have === 5 ? "#178951" : "#B4262A" }}>{kyc.filter(k => !k[1]).map(k => k[0]).join(", ") || "Complete"}</div>
                <div style={{ marginTop:6, display:"flex", gap:5, flexWrap:"wrap" }}>
                  <Chip c={att ? (att.outAt ? "c-grey" : "c-green") : "c-red"}>
                    {att ? (att.outAt ? "Duty done" : "On duty") : "Not signed in"}
                  </Chip>
                  {att && drove && <Chip c="c-blue">{drove.plate.replace(/\s/g, "").slice(-4)} · {clock(att.inAt).split(", ").pop()}</Chip>}
                </div>
              </div>
            </div>
          </button>
        );
      })}

      {fleetView === "jobs" && (
        <>
          {db.jobs.length === 0 && <Empty head="No jobs logged" sub="Painting, tinkering, FC and insurance work goes here." />}
          {db.jobs.map(j => {
            const v = vehOf(j.vehicleId);
            return (
              <div className="vz-card" key={j.id}>
                <div className="vz-row">
                  <div>
                    <div className="vz-title">{j.type} · <span style={{ fontFamily:"var(--mono)" }}>{v ? v.plate : "—"}</span></div>
                    <div className="vz-meta">{j.vendor || "Workshop TBD"} · {dmy(j.date)}{j.note ? " · " + j.note : ""}</div>
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <div className="vz-money">{inr(j.cost)}</div>
                    <Chip c={j.done ? "c-green" : "c-yellow"}>{j.done ? "Done" : "Open"}</Chip>
                    {perm.del && <div><button className="vz-chip c-red" style={{ marginTop:6 }}
                      onClick={() => { if (window.confirm("Delete this job?")) { drop("jobs", j.id); setToast("Job deleted"); } }}>Delete</button></div>}
                  </div>
                </div>
              </div>
            );
          })}
        </>
      )}

      {fleetView === "docs" && (
        <>
          <div className="vz-card">
            <div className="vz-eyebrow" style={{ margin:0 }}>Renewal load, next 12 months</div>
            <div style={{ display:"flex", gap:3, alignItems:"flex-end", marginTop:10 }}>
              {monthLoad.map(m => (

  /* ---------------- settings ---------------- */

      <F label="Address"><textarea rows={2} value={db.settings.address || ""} onChange={e => setSetting("address", e.target.value)} /></F>
      <div className="vz-2">
        <F label="Phone"><input value={db.settings.bizPhone || ""} onChange={e => setSetting("bizPhone", e.target.value)} /></F>
        <F label="Website"><input value={db.settings.website || ""} onChange={e => setSetting("website", e.target.value)} /></F>

      <div className="vz-eyebrow">Bank details (on invoices)</div>

      <div className="vz-2">

      </div>
      <div className="vz-2">
        <F label="Branch"><input value={db.settings.bankBranch || ""} onChange={e => setSetting("bankBranch", e.target.value)} /></F>
        <F label="Account type"><input value={db.settings.bankAcType || ""} onChange={e => setSetting("bankAcType", e.target.value)} /></F>
      </div>

      <div className="vz-eyebrow">Invoice</div>

      <F label="Terms &amp; conditions (printed on invoices)"><textarea rows={7} value={db.settings.invTerms || ""} onChange={e => setSetting("invTerms", e.target.value)} /></F>

      <div className="vz-eyebrow">Invoices</div>
      <div className="vz-tog">
        <p>Auto-send proforma<small>Opens the ready message the moment a campaign is raised</small></p>
        <Toggle on={db.settings.autoSendProforma} onChange={v => setSetting("autoSendProforma", v)} />
      </div>
      <div className="vz-tog">
        <p>Auto receipt on payment<small>Confirmation to vendor when you record money in</small></p>
        <Toggle on={db.settings.autoReceipt} onChange={v => setSetting("autoReceipt", v)} />
      </div>
      <div className="vz-f" style={{ marginTop:12 }}>
        <label>Remind vendor after (days unconfirmed)</label>

      <div className="vz-eyebrow">Field photos</div>

      </div>
      <div className="vz-tog">
        <p>Daily photo required<small>Flags running vehicles that skipped today's shot</small></p>
        <Toggle on={db.settings.dailyProofRequired} onChange={v => setSetting("dailyProofRequired", v)} />
      </div>

      <div className="vz-eyebrow">Renewal alerts</div>
      <div className="vz-2">

      </div>
      <div className="vz-tog">
        <p>Phone notifications<small>Alerts you even when the app is closed, if the phone allows it</small></p>

            <div className="vz-row">

                {rzpStatus.ready ? (rzpStatus.mode === "test" ? "TEST MODE" : "LIVE") : "Action needed"}
              </Chip>
            </div>
            <div className="vz-kv"><span>API keys</span><b>{rzpStatus.keys ? "✓ set" : "— missing"}</b></div>

                {!rzpStatus.webhook && <>Add <b>RAZORPAY_WEBHOOK_SECRET</b> in api/config.php.<br /></>}
                {!rzpStatus.table && <>Run <b>db/db-payments.sql</b> in phpMyAdmin.</>}
              </div>
            )}

              <div className="vz-meta" style={{ color:"#8A6100" }}>

              </div>

          </>

        if (!window.confirm("Erase every vendor, campaign, payment, driver and photo on this phone? Take a backup first.")) return;

        setPics({}); setSheet(null); setToast("All records erased");
      }}>Erase all records</button>
    </Sheet>
  );
